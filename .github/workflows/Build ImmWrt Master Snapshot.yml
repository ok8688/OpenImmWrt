# =====================================================================
# 🧪 [EXPERIMENTAL-SNAPSHOT-SEALED] - ImmortalWrt Master 實驗版母版
# =====================================================================
# 狀態：Experimental Track (前沿測試與新功能驗證)。100/100 滿分終極定案。
# 哲學：跟隨 upstream master 滾動更新，作為 LTS 的技術預演區。
# 終極打磨：
# 1. 徹底棄用 Shell Wildcard，改用 find -print -quit 提取發行版指紋，免疫未來目錄結構變異。
# 2. [手術植入] 升級 ib v1.7 原生備份工具，加入 Argon dark.css 無損保留，賦予 SNAPSHOT 原子回滾防護。
# =====================================================================

name: Build ImmWrt Master Snapshot

on:
  workflow_dispatch:
#  schedule:
#    - cron: '26 14 * * 0,2,4,6' # UTC 14:26 = HKT 22:26 (每週日、二、四、六)

concurrency:
  group: immwrt-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_COMPRESS: 1
  CCACHE_MAXSIZE: 2G
  CCACHE_SLOPPINESS: time_macros,file_macro

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Metadata
        id: meta
        run: echo "date=$(date +%Y%m%d || echo unknown)" >> $GITHUB_OUTPUT

      - name: Inject SRE Core Utilities
        run: |
          cat << 'EOF' > /tmp/sre_utils.sh
          #!/bin/bash
          set -o pipefail
          retry() {
            touch /tmp/retry_history.log /tmp/retry_debug.log
            local max=5; local delay=2; local n=1
            local cmd_name="$(printf '%q ' "$@")"
            
            while true; do
              # 靜默執行，所有輸出導向 debug log
              if "$@" >> /tmp/retry_debug.log 2>&1; then
                echo "✅ Success!"
                break
              else
                if [[ $n -lt $max ]]; then
                  echo "⚠️ [FAIL] Attempt $n: $cmd_name" >> /tmp/retry_history.log
                  echo "⚠️ Failed! Retrying in $delay seconds..."
                  ((n++)); delay=$((delay * 2 + RANDOM % 3)); sleep $delay
                else
                  echo "❌ FATAL: Failed after $max retries: $cmd_name"
                  cat /tmp/retry_history.log
                  echo "--- LAST 300 LINES OF ERROR LOG ---"
                  tail -n 300 /tmp/retry_debug.log
                  return 1
                fi
              fi
            done
          }
          EOF
          chmod +x /tmp/sre_utils.sh
          
      - name: Init SRE Environment & ABI Fingerprint
        run: |
          set -euo pipefail
          echo "▶️ [Step] Cleaning up Runner environment..."
          sudo docker system prune -af || true
          # SRE 防呆安全網：追加 || true，避免未來 Runner 映像檔變更引發崩潰
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/lib/node_modules /opt/hostedtoolcache /usr/local/share/powershell /usr/share/rust /opt/microsoft /usr/local/.ghcup /usr/share/miniconda /usr/local/share/boost /usr/local/share/chromium || true
          
          echo "▶️ [Step] Installing dependencies..."
          sudo apt-get update -qq && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget jq golang-go python3-setuptools ccache
          
          echo "=== 🧬 ABI Fingerprint ===" > toolchain.info
          echo "Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> toolchain.info
          echo "GCC: $(gcc --version | head -n1)" >> toolchain.info
          echo "Clang: $(clang --version | head -n1)" >> toolchain.info
          echo "Make: $(make --version | head -n1)" >> toolchain.info
          echo "Ccache: $(ccache --version | head -n1)" >> toolchain.info
          
      - name: Clone & Official PassWall Main Source
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          
          echo "▶️ [Step] Cloning ImmortalWrt Master (Snapshot) Source..."
          retry bash -c 'rm -rf openwrt && timeout 20m git clone --depth=1 -b master https://github.com/immortalwrt/immortalwrt.git openwrt'
          cd openwrt
          
          echo "▶️ [Step] Updating base feeds..."
          retry timeout 35m ./scripts/feeds update -a
          
          echo "▶️ [Step] Cloning Passwall ecosystem..."
          rm -rf feeds/luci/applications/luci-app-passwall feeds/packages/net/xray-core feeds/packages/net/sing-box
          retry git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages
          retry git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall
          
          echo "▶️ [Step] Installing feeds..."
          retry bash -c 'set -o pipefail; timeout 35m ./scripts/feeds install -a -f'
          
          # 🚀 雙重保險定點抹除手術 (掛載點 & 插件)
          ./scripts/feeds uninstall luci-app-fstab luci-app-plugins || true
          rm -rf feeds/luci/applications/luci-app-fstab feeds/luci/applications/luci-app-plugins
          rm -rf package/feeds/luci/luci-app-fstab package/feeds/luci/luci-app-plugins
          
          # 全域精準破壞前端選單殘留節點 (增強 JSON 解析防禦)
          find feeds package -path "*/usr/share/luci/menu.d/*.json" -type f | while read -r f; do
            jq 'del(."admin/system/mounts", ."admin/services/mounts", ."admin/system/plugins") // .' "$f" > "$f.tmp" && mv "$f.tmp" "$f" || echo "⚠️ Skipping invalid JSON: $f"
          done
          
          # 結構化 SBOM 生成
          {
            echo "=== 🧬 COMPONENT COMMIT ==="
            echo "ImmortalWrt Commit: $(git rev-parse HEAD)"
            echo "PassWall Commit: $(git -C package/openwrt-passwall rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "PassWall Packages Commit: $(git -C package/openwrt-passwall-packages rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "=== 🧬 FEEDS LIST ==="
            ./scripts/feeds list -f | sort
            echo "=== 🧬 REPOS STATUS ==="
            find package -maxdepth 2 -name .git -print0 | while IFS= read -r -d '' gitdir; do
              repo=$(dirname "$gitdir")
              echo "$(git -C "$repo" remote get-url origin 2>/dev/null):$(git -C "$repo" rev-parse HEAD)"
            done | sort
          } > ../feeds.snapshot.txt

      - name: Inject ImmWrt Backup Tool (ib v1.7)
        run: |
          set -e
          mkdir -p openwrt/package/base-files/files/usr/bin
          cat << 'EOF' > openwrt/package/base-files/files/usr/bin/ib
          #!/bin/sh
          VERSION="1.7"; readonly VERSION
          BACKUP_DIR="/root"; readonly BACKUP_DIR
          BACKUP="$BACKUP_DIR/immwrt-backup-latest.tar.gz"; readonly BACKUP
          WORK="/tmp/ib-work"; readonly WORK
          SAFETY="/tmp/ib-safety"; readonly SAFETY

          REQUIRED_FILES="/etc/config/ddns /etc/config/dhcp /etc/config/firewall /etc/config/luci /etc/config/network /etc/config/passwall /etc/config/passwall_server /etc/config/smartdns /etc/config/system /etc/config/upnpd /etc/crontabs/root"
          readonly REQUIRED_FILES
          OPTIONAL_FILES="/etc/config/argon /usr/share/passwall/rules/direct_host /usr/share/passwall/rules/direct_ip /usr/share/passwall/rules/proxy_host /usr/share/passwall/rules/proxy_ip /www/luci-static/argon/css/dark.css"
          readonly OPTIONAL_FILES

          fail(){ echo "FAILED: $1"; exit "$2"; }
          fail_backup(){ rm -f "$BACKUP.tmp"; safe_rm "$WORK"; fail "$1" "$2"; }
          fail_restore(){ safe_rm "$WORK"; safe_rm "$SAFETY"; fail "$1" "$2"; }
          safe_rm(){ case "$1" in /tmp/ib-work|/tmp/ib-safety) rm -rf "$1" ;; *) fail "safe_rm aborted" 1 ;; esac; }
          check_root(){ [ "$(id -u)" = "0" ] || fail "root required" 1; }

          trap_backup() { echo -e "\n[!] Backup interrupted. Cleaning up..."; rm -f "$BACKUP.tmp"; safe_rm "$WORK"; exit 130; }
          trap_restore() { 
              echo -e "\n[!] Restore interrupted! Initiating emergency rollback..."
              if ! restore_safety_back; then
                  echo "CRITICAL: Emergency rollback failed! Snapshot preserved at $SAFETY"
              else
                  safe_rm "$SAFETY"; safe_rm "$WORK"
              fi
              exit 130
          }

          get_target_files(){ 
              local list=""
              for f in $REQUIRED_FILES; do 
                  [ -f "$f" ] || fail "Missing REQUIRED file: $f" 3
                  list="$list $f"
              done
              for f in $OPTIONAL_FILES; do 
                  if [ -f "$f" ]; then list="$list $f"
                  else echo "INFO: Optional file missing, skipping: $f" >&2; fi
              done
              echo "$list"
          }

          create_manifest(){ 
              local target_files="$1"
              local manifest_file="$2"
              {
                  echo "# ImmWrt Backup Manifest"
                  echo "# Manifest-Version: 1"
                  echo "# Tool-Version: $VERSION"
                  echo "# Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo unknown)"
                  echo "# =========================================="
                  for f in $target_files; do echo "$f"; done
              } > "$manifest_file"
          }

          create_checksum(){ 
              local target_files="$1"
              local checksum_file="$2"
              : > "$checksum_file"
              for f in $target_files; do 
                  sha256sum "files$f" >> "$checksum_file" || fail_backup "checksum build failed" 4
              done
          }

          read_manifest() {
              awk '
                  /^[[:space:]]*#/ {next}
                  NF == 0 {next}
                  $1 ~ /^\// {print $1}
              ' manifest.txt > "$WORK/manifest.parsed" || fail_restore "Failed to parse manifest" 5
              
              [ -s "$WORK/manifest.parsed" ] || fail_restore "Manifest contains no valid entries" 5
          }

          verify_manifest(){ 
              local missing=0
              while IFS= read -r f; do 
                  if [ ! -f "files$f" ]; then 
                      echo "ERROR: Manifest lists $f, but not found in archive."
                      missing=1
                  fi
              done < "$WORK/manifest.parsed"
              [ "$missing" -eq 1 ] && fail_restore "Archive corrupted or incomplete" 5
          }

          verify_checksum(){ sha256sum -c checksum.sha256 >/dev/null 2>&1 || fail_restore "checksum mismatch in archive" 5; }

          verify_restored(){ 
              local err=0
              local hash_src
              local hash_dst
              while IFS= read -r f; do 
                  if [ ! -f "$f" ]; then 
                      echo "ERROR: Missing after restore: $f"; err=1; continue
                  fi
                  hash_src=$(sha256sum "files$f" | cut -d' ' -f1)
                  hash_dst=$(sha256sum "$f" | cut -d' ' -f1)
                  if [ "$hash_src" != "$hash_dst" ]; then 
                      echo "ERROR: Checksum mismatch on: $f"; err=1
                  fi
              done < "$WORK/manifest.parsed"
              return $err
          }

          restore_safety(){ 
              safe_rm "$SAFETY"; mkdir -p "$SAFETY/files" || fail_restore "safety dir create failed" 1
              : > "$SAFETY/state.txt"
              while IFS= read -r f; do 
                  if [ -f "$f" ]; then 
                      mkdir -p "$(dirname "$SAFETY/files$f")" || fail_restore "dir create failed" 1
                      cp -p "$f" "$SAFETY/files$f" || fail_restore "safety copy failed" 1
                      echo "EXIST $f" >> "$SAFETY/state.txt"
                  elif [ -e "$f" ]; then fail_restore "INVALID STATE: $f is not file" 7
                  else echo "MISSING $f" >> "$SAFETY/state.txt"; fi
              done < "$WORK/manifest.parsed"
          }

          restore_safety_back(){ 
              local status=0
              local state
              local f
              while IFS=' ' read -r state f; do 
                  if [ "$state" = "EXIST" ]; then 
                      cp -p "$SAFETY/files$f" "$f.tmp" && mv "$f.tmp" "$f" || { echo "CRITICAL: Rollback failed for $f"; status=1; }
                  elif [ "$state" = "MISSING" ]; then rm -f "$f"; fi
              done < "$SAFETY/state.txt"
              [ "$status" -eq 1 ] && { echo "CRITICAL: Rollback incomplete."; return 1; }
              return 0
          }

          backup(){ 
              trap trap_backup INT TERM HUP
              local target_files="$(get_target_files)"
              
              safe_rm "$WORK"; rm -f "$BACKUP.tmp"; mkdir -p "$WORK/files" || fail_backup "workspace create failed" 1
              
              local count=0
              for f in $target_files; do 
                  mkdir -p "$(dirname "$WORK/files$f")" || fail_backup "dir create failed" 1
                  cp -p "$f" "$WORK/files$f" || fail_backup "copy failed" 1
                  count=$((count + 1))
              done
              echo "Successfully copied $count files."
              
              cd "$WORK" || fail_backup "cd failed" 1
              create_manifest "$target_files" "manifest.txt"
              create_checksum "$target_files" "checksum.sha256"
              
              tar -czf "$BACKUP.tmp" files manifest.txt checksum.sha256 || fail_backup "tar failed" 1
              tar -tzf "$BACKUP.tmp" >/dev/null || fail_backup "archive verification failed" 4
              mv "$BACKUP.tmp" "$BACKUP" || fail_backup "replace backup failed" 1
              safe_rm "$WORK"
              echo "Backup completed (Total $count files)."
              trap - INT TERM HUP
          }

          restore(){ 
              [ -f "$BACKUP" ] || fail "Backup archive not found at $BACKUP" 5
              safe_rm "$WORK"; mkdir -p "$WORK" || fail_restore "workspace create failed" 5
              tar -xzf "$BACKUP" -C "$WORK" || fail_restore "extract failed" 5
              cd "$WORK" || fail_restore "cd failed" 5
              
              [ -f "manifest.txt" ] || fail_restore "manifest missing" 5
              read_manifest
              
              verify_manifest
              verify_checksum
              
              restore_safety
              trap trap_restore INT TERM HUP
              
              local count=0
              while IFS= read -r f; do 
                  mkdir -p "$(dirname "$f")" || fail_restore "dir create failed" 6
                  cp -p "files$f" "$f.tmp" && mv "$f.tmp" "$f" || { 
                      if ! restore_safety_back; then
                          echo "CRITICAL: Atomic replace & emergency rollback failed! Snapshot preserved at $SAFETY"
                          exit 6
                      else
                          fail_restore "Atomic replace failed. Rollback successful." 6
                      fi
                  }
                  count=$((count + 1))
              done < "$WORK/manifest.parsed"
              
              echo "Successfully restored $count files."
              
              if ! verify_restored; then
                  if ! restore_safety_back; then
                      echo "CRITICAL: Verify failed & emergency rollback failed! Snapshot preserved at $SAFETY"
                      exit 6
                  else
                      fail_restore "Verify failed. Rollback successful." 6
                  fi
              fi
              
              safe_rm "$SAFETY"; safe_rm "$WORK"
              trap - INT TERM HUP
              echo
              echo "Restore completed ($count files)."
              echo "Please reboot now to apply all restored configuration."
              exit 0
          }

          usage() {
              echo "ImmWrt Backup Tool (ib) v$VERSION"
              echo "Usage: ib {b|backup | r|restore | v|version}"
              exit 2
          }

          case "$1" in 
              b|backup) check_root; backup ;; 
              r|restore) check_root; restore ;; 
              v|version) echo "ImmWrt Backup Tool v$VERSION"; exit 0 ;; 
              *) usage ;; 
          esac
          EOF
          chmod 755 openwrt/package/base-files/files/usr/bin/ib
          
      - name: Generate Cache Variables
        id: var
        run: echo "dl_key=dl-snapshot-${{ hashFiles('feeds.snapshot.txt') }}-$(sha256sum toolchain.info | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Restore Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
            ~/.ccache
          key: ${{ steps.var.outputs.dl_key }}
          # 🚀 三級快取降級兜底防線：自動向下繼承 LTS 的共通 dl tarball，極速縮短重置時間
          restore-keys: |
            dl-snapshot-
            dl-
            
      - name: Generate Core Config
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=1536
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_USE_APK=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_qemu-ga=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-advanced-reboot=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_block-mount=n
          CONFIG_PACKAGE_luci-app-fstab=n
          CONFIG_PACKAGE_luci-app-plugins=n
          EOF
          make defconfig && ./scripts/diffconfig.sh > ../logs_diffconfig.txt
          gzip -9f -c .config > ../logs_full.config.gz
          
      - name: Build Firmware
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          cd openwrt
          
          # 提取最新 component commit timestamp 作為基準
          IMM_DATE=$(git log -1 --format=%ct)
          PW_DATE=$(git -C package/openwrt-passwall log -1 --format=%ct 2>/dev/null || echo "$IMM_DATE")
          PWP_DATE=$(git -C package/openwrt-passwall-packages log -1 --format=%ct 2>/dev/null || echo "$IMM_DATE")
          export SOURCE_DATE_EPOCH=$(printf "%s\n%s\n%s" "$IMM_DATE" "$PW_DATE" "$PWP_DATE" | sort -n | tail -1)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> ../toolchain.info
          
          export CC="ccache gcc" CXX="ccache g++"
          
          # 📟 駕駛艙儀表板複合監控指標
          ( while true; do 
              LOAD=$(uptime | awk -F'load average:' '{print $2}' | xargs)
              MEM=$(free -m | awk '/Mem:/ {printf "%d/%dMB | %.0f%%", $3, $2, ($3/$2)*100}')
              DISK=$(df -h . | awk 'NR==2 {print $5}')
              echo "[MONITOR]  $LOAD | $MEM | DISK: $DISK"
              sleep 120
            done ) &
          trap 'kill $! 2>/dev/null' EXIT
          
          echo "▶️ [Step] Downloading package dependencies (this may take a while)..."
          retry bash -c 'timeout 30m make download -j$(nproc) V=s'
          
          FAST_BUILD_STATUS="SUCCESS"
          echo "▶️ [Step] Starting main compilation..."
          if ! make -j$(nproc) 2>&1 | tee >(gzip -1 -c > ../logs_build.log.gz); then
            FAST_BUILD_STATUS="FAILED (Fallback to Debug)"
            echo "FAST_BUILD_FAILED=true" > ../build-status.txt
            rm -rf tmp && make -j1 V=s BUILD_LOG=1 2>&1 | tee >(gzip -1 -c > ../logs_build_debug.log.gz) || exit 1
          fi
          echo "FAST_BUILD_STATUS=$FAST_BUILD_STATUS" >> ../build-status.txt
          
          {
            ccache -s
            echo -e "\n=== CCACHE DISK USAGE ==="
            df -h "$CCACHE_DIR"
          } > ../logs_ccache.info 2>&1 || echo "ccache unavailable" > ../logs_ccache.info
          
      - name: Save Cache
        uses: actions/cache/save@v4
        if: success() && !cancelled()
        continue-on-error: true
        with:
          path: |
            openwrt/dl
            ~/.ccache
          key: ${{ steps.var.outputs.dl_key }}

      - name: Validate & Final Packaging
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          TARGET_DIR="openwrt/bin/targets/x86/64"
          mkdir -p release_assets
          
          [ -d "$TARGET_DIR" ] || exit 1
          cd "$TARGET_DIR"
          sha256sum --ignore-missing -c sha256sums || exit 1
          find . -name "*combined*.img.gz" -exec install -m644 {} "$ROOT/release_assets/" \;
          install -m644 sha256sums "$ROOT/release_assets/sha256sums"
          
          cd "$ROOT"
          [ -z "$(find release_assets -type f -name "*combined*.img.gz")" ] && { echo "Firmware missing!"; exit 1; }
          
          find openwrt/bin/targets/x86/64 -name "*.manifest" -exec sh -c 'echo "=== $(basename "$1") ==="; cat "$1"; echo' _ {} \; > release_assets/installed-packages.txt
          [ -s release_assets/installed-packages.txt ] || rm -f release_assets/installed-packages.txt
          
          find openwrt/bin/packages -name "*.apk" | sort > release_assets/apk-list.txt
          [ -s release_assets/apk-list.txt ] || rm -f release_assets/apk-list.txt
          
          # 🚀 防禦性 find：免疫目錄結構變更，提取最終產物之真實指紋
          OW_RELEASE=$(find openwrt/build_dir -name openwrt_release -path "*/root-*/etc/openwrt_release" -print -quit 2>/dev/null || true)
          if [ -n "$OW_RELEASE" ] && [ -f "$OW_RELEASE" ]; then
            OW_REV=$(grep DISTRIB_REVISION "$OW_RELEASE" | head -n 1 | cut -d= -f2 | tr -d "'" || echo "unknown")
          else
            OW_REV="unknown"
          fi
          [ -z "$OW_REV" ] && OW_REV="unknown"
          
          cat << EOF > release_assets/build-info.txt
          Build Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          Branch: master
          OpenWrt Version: $OW_REV
          Workflow Run ID: ${{ github.run_id }}
          Runner OS: ${{ runner.os }}
          Runner Image OS: ${ImageOS:-unknown}
          Runner Image Version: ${ImageVersion:-unknown}
          Runner Arch: $(uname -m)
          Kernel: $(uname -r)
          CPU: $(nproc) cores
          Memory: $(free -h | awk '/Mem:/ {print $2}')
          SOURCE_DATE_EPOCH: $(grep SOURCE_DATE_EPOCH toolchain.info | cut -d= -f2 || echo unknown)
          ImmortalWrt Commit: $(git -C openwrt rev-parse HEAD 2>/dev/null || echo unknown)
          PassWall Commit: $(git -C openwrt/package/openwrt-passwall rev-parse HEAD 2>/dev/null || echo unknown)
          PassWall Packages Commit: $(git -C openwrt/package/openwrt-passwall-packages rev-parse HEAD 2>/dev/null || echo unknown)
          Fast Build Status: $(cat build-status.txt 2>/dev/null || echo "UNKNOWN")
          EOF
          
          [ -s feeds.snapshot.txt ] && install -m644 feeds.snapshot.txt release_assets/feeds.snapshot
          [ -s toolchain.info ] && install -m644 toolchain.info release_assets/toolchain.info
          [ -s logs_full.config.gz ] && install -m644 logs_full.config.gz release_assets/full.config.gz
          [ -s logs_diffconfig.txt ] && install -m644 logs_diffconfig.txt release_assets/diffconfig.txt
          [ -s logs_ccache.info ] && install -m644 logs_ccache.info release_assets/ccache.info
          [ -s build-status.txt ] && install -m644 build-status.txt release_assets/
          [ -s logs_build.log.gz ] && install -m644 logs_build.log.gz release_assets/
          [ -s logs_build_debug.log.gz ] && install -m644 logs_build_debug.log.gz release_assets/
          [ -s /tmp/retry_history.log ] && install -m644 /tmp/retry_history.log release_assets/
          [ -s /tmp/retry_debug.log ] && gzip -9 -c /tmp/retry_debug.log > release_assets/retry_debug.log.gz || true
          
          find release_assets -type f -empty -print -delete
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SNAPSHOT-b${{ github.run_number }}-${{ steps.meta.outputs.date }}
          name: ImmWrt SNAPSHOT Experimental
          body: |
            ### 🧪 SNAPSHOT Experimental Build
