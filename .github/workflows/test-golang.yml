name: TEST - Sing-box Target Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: d2dc130d7f8341741df04eaaf5fd4c74dcc447d7
          fetch-depth: 1

      - name: Clone PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            https://github.com/xiaorouji/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          cd package/openwrt-passwall-packages

          git checkout a8302d598ca54cda22f7fe76fa553b3df034f8ae

          echo "PassWall-Packages:"
          git rev-parse HEAD

      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE TREE ==="
          echo "========================================"

          echo "--- PWD ---"
          pwd

          echo "--- IMMORTALWRT ---"
          git rev-parse HEAD

          echo "--- REQUIRED DIRECTORIES ---"
          for path in \
            Makefile \
            package \
            scripts \
            target \
            toolchain \
            tools
          do
            test -e "$path"
            echo "OK: $path"
          done

          echo "--- SCRIPT DIRECTORY ---"
          ls -la scripts

      - name: Audit Sing-box package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX PACKAGE AUDIT ==="
          echo "========================================"

          test -f package/openwrt-passwall-packages/sing-box/Makefile

          echo "--- COMMITS ---"
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo "--- SING-BOX DIRECTORY ---"
          ls -la package/openwrt-passwall-packages/sing-box

          echo "--- MAKEFILE ---"
          sed -n '1,140p' \
            package/openwrt-passwall-packages/sing-box/Makefile

      - name: Generate package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

      - name: Inspect Sing-box metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT SING-BOX METADATA ==="
          echo "========================================"

          echo "--- package info ---"
          grep -n -A30 -B5 \
            "Source-Makefile: package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo || true

          echo "--- package dependencies ---"
          grep -n \
            "openwrt-passwall-packages/sing-box" \
            tmp/.packagedeps || true

          echo "--- CONFIG ---"
          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config || true

      - name: Verify Host Ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY HOST NINJA ==="
          echo "========================================"

          echo "--- SYSTEM NINJA ---"
          command -v ninja || true
          ninja --version || true

          echo "--- OPENWRT STAGING NINJA ---"
          ls -l staging_dir/host/bin/ninja 2>&1 || true

          echo "--- HOST MESON / NINJA ---"
          ls -l staging_dir/host/bin/meson 2>&1 || true
          ls -l staging_dir/host/bin/ninja 2>&1 || true

          echo "--- HOST BIN MATCHES ---"
          ls -la staging_dir/host/bin/ 2>/dev/null \
            | grep -E '(^|[[:space:]])(ninja|meson)([[:space:]]|$)' \
            || true

          echo "--- NINJA REFERENCES IN OPENWRT ---"
          grep -RniE 'ninja' \
            package/system \
            package/utils \
            tools \
            include \
            2>/dev/null \
            | head -n 100 \
            || true

          echo "--- NINJA FILES IN TREE ---"
          find . \
            \( -name 'ninja' -o -name 'ninja-*' -o -name '*ninja*' \) \
            2>/dev/null \
            | head -n 100 \
            || true

      - name: Verify Make target
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY MAKE TARGET ==="
          echo "========================================"

          echo "--- REAL TARGET: package/sing-box/compile ---"

          make package/sing-box/compile V=s -n \
            2>&1 | tail -n 150

      - name: Verify source path is not a target
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE PATH TARGET ==="
          echo "========================================"

          set +e

          make \
            package/openwrt-passwall-packages/sing-box/compile \
            V=s -n \
            > /tmp/direct-target.log 2>&1

          rc=$?

          cat /tmp/direct-target.log

          echo
          echo "RETURN_CODE=$rc"

          if grep -q "No rule to make target" /tmp/direct-target.log; then
            echo "EXPECTED: source directory is NOT the Make target."
            exit 0
          fi

          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED: source path is a Make target."
            exit 1
          fi

          echo "Unexpected error."
          exit "$rc"

      - name: Final audit
        shell: bash
        run: |
          echo "========================================"
          echo "=== AUDIT COMPLETE ==="
          echo "========================================"
