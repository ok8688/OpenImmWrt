name: Test Sing-Box Target

on:
  workflow_dispatch:

jobs:
  sing-box-target-test:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. Checkout ImmortalWrt
      # ============================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4

      # ============================================================
      # 2. Prepare build environment
      # ============================================================
      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== PREPARE BUILD ENVIRONMENT ==="
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            cpio \
            rename \
            patch \
            tar \
            gzip \
            xz-utils \
            zstd \
            jq \
            bc \
            swig

          echo "--- Host Go ---"
          command -v go || true
          go version || true

          echo "--- Host GCC ---"
          gcc --version | head -n 1

      # ============================================================
      # 3. Clone exact PassWall-Packages commit
      # ============================================================
      - name: Clone PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE PASSWALL-PACKAGES ==="
          echo "========================================"

          rm -rf package/openwrt-passwall-packages

          git clone --depth=1 \
            https://github.com/xiaorouji/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          cd package/openwrt-passwall-packages

          git fetch --depth=1 origin \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          git checkout \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          cd ../..

          echo "=== COMMITS ==="
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

      # ============================================================
      # 4. Audit sing-box package BEFORE compilation
      # ============================================================
      - name: Audit sing-box package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX PACKAGE AUDIT ==="
          echo "========================================"

          echo "--- package directory ---"
          ls -la package/openwrt-passwall-packages/sing-box/

          echo "--- Makefile ---"
          sed -n '1,180p' \
            package/openwrt-passwall-packages/sing-box/Makefile

      # ============================================================
      # 5. Update feeds / metadata
      # ============================================================
      - name: Prepare OpenWrt feeds
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== PREPARE OPENWRT ==="
          echo "========================================"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          make defconfig

      # ============================================================
      # 6. Confirm sing-box is registered
      # ============================================================
      - name: Verify sing-box metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SING-BOX METADATA ==="
          echo "========================================"

          echo "--- package info ---"
          grep -n \
            -A25 \
            -B5 \
            "Source-Makefile: package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo || true

          echo "--- package dependencies ---"
          grep -n \
            "openwrt-passwall-packages/sing-box" \
            tmp/.packagedeps || true

          echo "--- current config ---"
          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config || true

      # ============================================================
      # 7. ENABLE SING-BOX
      #
      # IMPORTANT:
      # OpenWrt DOES NOT provide ./scripts/config/set
      #
      # Use:
      # ./scripts/config/conf --set-val CONFIG_PACKAGE_sing-box y
      # ============================================================
      - name: Enable sing-box
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== ENABLE SING-BOX ==="
          echo "========================================"

          ./scripts/config/conf \
            --set-val CONFIG_PACKAGE_sing-box y \
            Config.in

          ./scripts/config/conf \
            --defconfig=.config \
            Config.in

          echo "--- sing-box config ---"

          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config

          test "$(grep -c '^CONFIG_PACKAGE_sing-box=y$' .config)" -eq 1

      # ============================================================
      # 8. Enable sing-box optional features
      #
      # These correspond to the Makefile options.
      # ============================================================
      - name: Enable sing-box features
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== ENABLE SING-BOX FEATURES ==="
          echo "========================================"

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_ACME y \
            Config.in

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_CLASH_API y \
            Config.in

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_GVISOR y \
            Config.in

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_QUIC y \
            Config.in

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_TAILSCALE y \
            Config.in

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_UTLS y \
            Config.in

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_WIREGUARD y \
            Config.in

          ./scripts/config/conf \
            --defconfig=.config \
            Config.in

          echo "--- sing-box feature configuration ---"

          grep -E \
            '^CONFIG_(PACKAGE_sing-box|SING_BOX_BUILD_)' \
            .config || true

      # ============================================================
      # 9. FINAL TARGET CHECK
      # ============================================================
      - name: Check sing-box target
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX TARGET CHECK ==="
          echo "========================================"

          echo "--- canonical target ---"

          make \
            V=s \
            package/openwrt-passwall-packages/sing-box/compile \
            -n

      # ============================================================
      # 10. ACTUAL SING-BOX COMPILE
      # ============================================================
      - name: Compile sing-box
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX ACTUAL COMPILE ==="
          echo "========================================"

          make \
            V=s \
            package/openwrt-passwall-packages/sing-box/compile

      # ============================================================
      # 11. Locate generated package
      # ============================================================
      - name: Verify generated package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY GENERATED PACKAGE ==="
          echo "========================================"

          find bin/packages \
            -type f \
            -iname '*sing-box*' \
            -print || true

          find bin/targets \
            -type f \
            -iname '*sing-box*' \
            -print || true

          echo "========================================"
          echo "=== TEST COMPLETE ==="
          echo "========================================"
