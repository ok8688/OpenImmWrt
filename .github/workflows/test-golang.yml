name: 🧪 Test Upstream Golang Feed Substitution

on:
  workflow_dispatch:

jobs:
  test-golang:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Basic Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget jq python3-setuptools

      - name: Clone ImmortalWrt Master
        run: |
          git clone --depth=1 -b master https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Update Feeds & Swap Golang Feed
        run: |
          cd openwrt
          echo "▶️ [1] Updating base feeds..."
          ./scripts/feeds update -a
          
          echo "💥 [2] Removing outdated golang feed..."
          rm -rf feeds/packages/lang/golang
          
          echo "🚀 [3] Cloning upstream openwrt/packages lang/golang..."
          git clone --depth=1 https://github.com/openwrt/packages.git /tmp/openwrt-pkgs
          cp -r /tmp/openwrt-pkgs/lang/golang feeds/packages/lang/golang
          rm -rf /tmp/openwrt-pkgs

      - name: Inspect Upstream Golang Feed Version
        run: |
          cd openwrt
          echo "===== 🔍 Upstream Golang Version Information ====="
          grep -RniE 'GO_DEFAULT_VERSION|GO_VERSION|GO_HOST_VERSION' feeds/packages/lang/golang/ 2>/dev/null || true

      - name: Install Feeds & Clone Passwall Ecosystem
        run: |
          cd openwrt
          echo "▶️ [1] Installing updated base feeds..."
          ./scripts/feeds install -a -f
          
          echo "▶️ [2] Cloning Passwall ecosystem..."
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall
          
          echo "▶️ [3] Re-installing all package feeds..."
          ./scripts/feeds install -a -f

      - name: Generate Minimal Config
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_xray-core=y
          EOF
          make defconfig

      - name: ⚡ Fast Verification (Compile Host Golang Only)
        run: |
          cd openwrt
          echo "=== 1. Test Host Golang Source Download ==="
          make package/golang/host/download V=s
          
          echo "=== 2. Test sing-box Source Download ==="
          make package/openwrt-passwall-packages/sing-box/download V=s || true
          
          echo "=== 3. Test Host Golang Compilation ==="
          make package/golang/host/compile -j$(nproc) V=s
          
          echo "✅ ===== FAST TEST PASSED: Host Go built successfully! ====="
