name: TEST - Sing-box Source Tree

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          fetch-depth: 1

      - name: Verify OpenWrt source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY OPENWRT SOURCE TREE ==="
          echo "========================================"

          echo "--- PWD ---"
          pwd

          echo "--- TOP LEVEL ---"
          ls -la

          echo "--- GIT ---"
          git rev-parse --show-toplevel
          git rev-parse HEAD

          echo "--- OPENWRT FILES ---"
          test -f Makefile
          test -d package
          test -d scripts
          test -f scripts/feeds
          test -f scripts/config/conf

          echo "--- PASS ---"
          echo "OpenWrt source tree is valid."

      - name: Clone PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/xiaorouji/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          cd package/openwrt-passwall-packages

          git fetch --depth=1 origin \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          git checkout \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          echo "PassWall-Packages:"
          git rev-parse HEAD

      - name: Audit Sing-box package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX PACKAGE AUDIT ==="
          echo "========================================"

          echo "--- COMMITS ---"
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo "--- PACKAGE DIRECTORY ---"
          test -d package/openwrt-passwall-packages/sing-box
          ls -la package/openwrt-passwall-packages/sing-box

          echo "--- MAKEFILE ---"
          test -f package/openwrt-passwall-packages/sing-box/Makefile
          sed -n '1,140p' package/openwrt-passwall-packages/sing-box/Makefile

          echo "--- PACKAGE METADATA ---"
          ./scripts/package-metadata.pl \
            pkginfo \
            package/openwrt-passwall-packages/sing-box/Makefile \
            2>&1 || true

      - name: Prepare OpenWrt metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== PREPARE OPENWRT METADATA ==="
          echo "========================================"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          make defconfig

      - name: Verify Sing-box metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SING-BOX METADATA ==="
          echo "========================================"

          echo "--- package info ---"
          grep -n -A25 -B5 \
            "Source-Makefile: package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo || true

          echo "--- package deps ---"
          grep -n \
            "openwrt-passwall-packages/sing-box" \
            tmp/.packagedeps || true

          echo "--- config ---"
          grep -n '^CONFIG_PACKAGE_sing-box=' .config || true

      - name: Verify correct build target
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY BUILD TARGET ==="
          echo "========================================"

          echo "--- sing-box metadata target ---"
          make package/sing-box/compile V=s -n \
            2>&1 | tail -n 120

          echo "--- package directory target ---"
          if make package/openwrt-passwall-packages/sing-box/compile V=s -n 2>&1; then
            echo "UNEXPECTED: direct path target exists."
          else
            echo "EXPECTED: direct source path is not a Make target."
          fi

      - name: Audit complete
        shell: bash
        run: |
          echo "========================================"
          echo "=== AUDIT COMPLETE ==="
          echo "========================================"
