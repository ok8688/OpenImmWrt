name: Test Sing-Box Build

on:
  workflow_dispatch:

jobs:
  sing-box-test:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Prepare build environment
      # ============================================================
      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== PREPARE BUILD ENVIRONMENT ==="
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            cpio \
            rename \
            patch \
            tar \
            gzip \
            xz-utils \
            zstd \
            jq \
            bc \
            swig \
            ninja-build

          echo "--- GCC ---"
          gcc --version | head -n 1

          echo "--- Ninja ---"
          ninja --version

      # ============================================================
      # 2. Clone ImmortalWrt
      # ============================================================
      - name: Clone ImmortalWrt
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE IMMORTALWRT ==="
          echo "========================================"

          rm -rf openwrt

          git clone --depth=1 \
            https://github.com/immortalwrt/immortalwrt.git \
            openwrt

          cd openwrt

          echo "--- ImmortalWrt HEAD ---"
          git rev-parse HEAD

      # ============================================================
      # 3. Checkout PassWall-Packages exact commit
      # ============================================================
      - name: Clone PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== CLONE PASSWALL-PACKAGES ==="
          echo "========================================"

          rm -rf package/openwrt-passwall-packages

          git clone \
            https://github.com/xiaorouji/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          cd package/openwrt-passwall-packages

          git checkout \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          echo "PassWall-Packages:"
          git rev-parse HEAD

          cd ../../..

      # ============================================================
      # 4. Verify source tree
      # ============================================================
      - name: Verify OpenWrt source tree
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== VERIFY OPENWRT SOURCE TREE ==="
          echo "========================================"

          test -f Makefile
          test -x scripts/feeds
          test -f scripts/config/conf

          echo "--- Makefile ---"
          ls -lh Makefile

          echo "--- scripts/feeds ---"
          ls -lh scripts/feeds

          echo "--- scripts/config/conf ---"
          ls -lh scripts/config/conf

          echo "--- sing-box Makefile ---"
          test -f package/openwrt-passwall-packages/sing-box/Makefile
          ls -lh package/openwrt-passwall-packages/sing-box/Makefile

      # ============================================================
      # 5. Audit sing-box Makefile
      # ============================================================
      - name: Audit sing-box
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== SING-BOX AUDIT ==="
          echo "========================================"

          sed -n '1,180p' \
            package/openwrt-passwall-packages/sing-box/Makefile

      # ============================================================
      # 6. Prepare feeds
      # ============================================================
      - name: Prepare feeds
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== PREPARE FEEDS ==="
          echo "========================================"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 7. Prepare default config
      # ============================================================
      - name: Prepare OpenWrt config
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== PREPARE CONFIG ==="
          echo "========================================"

          make defconfig

          echo "--- Initial sing-box config ---"
          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config || true

      # ============================================================
      # 8. Enable sing-box
      #
      # IMPORTANT:
      # DO NOT use ./scripts/config/set
      # It does not exist in OpenWrt.
      # ============================================================
      - name: Enable sing-box
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== ENABLE SING-BOX ==="
          echo "========================================"

          ./scripts/config/conf \
            --set-val CONFIG_PACKAGE_sing-box y \
            Config.in

          ./scripts/config/conf \
            --defconfig=.config \
            Config.in

          echo "--- sing-box ---"

          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config

          test -f .config
          grep -q '^CONFIG_PACKAGE_sing-box=y$' .config

      # ============================================================
      # 9. Enable sing-box features
      # ============================================================
      - name: Enable sing-box features
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== ENABLE SING-BOX FEATURES ==="
          echo "========================================"

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_ACME y \
            Config.in

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_CLASH_API y \
            Config.in

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_GVISOR y \
            Config.in

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_QUIC y \
            Config.in

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_TAILSCALE y \
            Config.in

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_UTLS y \
            Config.in

          ./scripts/config/conf \
            --set-val CONFIG_SING_BOX_BUILD_WIREGUARD y \
            Config.in

          ./scripts/config/conf \
            --defconfig=.config \
            Config.in

          echo "--- sing-box configuration ---"

          grep -E \
            '^CONFIG_(PACKAGE_sing-box|SING_BOX_BUILD_)' \
            .config || true

      # ============================================================
      # 10. Generate package metadata
      # ============================================================
      - name: Verify package metadata
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== VERIFY PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

          echo "--- sing-box package metadata ---"

          grep -n \
            -A25 \
            -B5 \
            "package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo || true

          echo "--- sing-box dependencies ---"

          grep -n \
            "openwrt-passwall-packages/sing-box" \
            tmp/.packagedeps || true

      # ============================================================
      # 11. Test target generation ONLY
      # ============================================================
      - name: Test sing-box target
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== TEST SING-BOX TARGET ==="
          echo "========================================"

          make \
            V=s \
            package/openwrt-passwall-packages/sing-box/compile \
            -n

      # ============================================================
      # 12. Actual compilation
      # ============================================================
      - name: Compile sing-box
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== ACTUAL SING-BOX COMPILE ==="
          echo "========================================"

          make \
            V=s \
            package/openwrt-passwall-packages/sing-box/compile

      # ============================================================
      # 13. Verify output
      # ============================================================
      - name: Verify sing-box output
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== VERIFY OUTPUT ==="
          echo "========================================"

          find bin \
            -type f \
            -iname '*sing-box*' \
            -print || true

          echo "========================================"
          echo "=== BUILD COMPLETE ==="
          echo "========================================"
