name: Test Upstream Golang + sing-box Build

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:

      # ================================================================
      # 1. Runner information
      # ================================================================
      - name: Runner Information
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== RUNNER INFORMATION ==="
          echo "========================================"

          uname -a
          echo
          lsb_release -a 2>/dev/null || true
          echo
          nproc
          free -h
          df -h

      # ================================================================
      # 2. Install required host tools
      # ================================================================
      - name: Install Host Build Dependencies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSTALL HOST BUILD DEPENDENCIES ==="
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            cpio \
            rename \
            ninja-build

          echo
          echo "--- ninja ---"
          command -v ninja
          ninja --version

          echo
          echo "--- gcc ---"
          gcc --version | head -n 1

          echo
          echo "--- go ---"
          command -v go || true
          go version || true

      # ================================================================
      # 3. Clone OpenWrt
      # ================================================================
      - name: Clone OpenWrt
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE OPENWRT ==="
          echo "========================================"

          git clone --depth=1 \
            https://github.com/ImmortalWrt/immortalwrt.git \
            openwrt

          cd openwrt

          echo
          echo "--- OpenWrt commit ---"
          git rev-parse HEAD

          echo
          echo "--- OpenWrt branch ---"
          git branch --show-current

      # ================================================================
      # 4. Clone PassWall Packages
      # ================================================================
      - name: Clone PassWall Packages
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== CLONE PASSWALL PACKAGES ==="
          echo "========================================"

          git clone --depth=1 \
            https://github.com/xiaorouji/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          echo
          echo "--- PassWall-Packages commit ---"
          git -C package/openwrt-passwall-packages rev-parse HEAD

      # ================================================================
      # 5. Show sing-box Makefile BEFORE feeds
      # ================================================================
      - name: Show Custom sing-box Makefile
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== CUSTOM SING-BOX MAKEFILE ==="
          echo "========================================"

          ls -la package/openwrt-passwall-packages/sing-box/

          echo
          echo "--- version/source ---"

          grep -nE \
            '^PKG_NAME|^PKG_VERSION|^PKG_RELEASE|^PKG_SOURCE|^PKG_SOURCE_URL|^PKG_HASH' \
            package/openwrt-passwall-packages/sing-box/Makefile

      # ================================================================
      # 6. Update feeds
      # ================================================================
      - name: Update OpenWrt Feeds
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== UPDATE FEEDS ==="
          echo "========================================"

          ./scripts/feeds update -a

      # ================================================================
      # 7. Install PassWall Packages as feed
      # ================================================================
      - name: Install PassWall Packages Feed
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== INSTALL PASSWALL PACKAGES FEED ==="
          echo "========================================"

          ./scripts/feeds install -p openwrt-passwall-packages -a

      # ================================================================
      # 8. Inspect sing-box provider / feed resolution
      # ================================================================
      - name: Audit sing-box Feed Resolution
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== SING-BOX FEED RESOLUTION ==="
          echo "========================================"

          echo
          echo "--- custom package ---"
          ls -ld package/openwrt-passwall-packages/sing-box || true

          echo
          echo "--- package/feeds/packages/sing-box ---"
          ls -ld package/feeds/packages/sing-box || true

          echo
          echo "--- package/feeds/openwrt-passwall-packages/sing-box ---"
          ls -ld package/feeds/openwrt-passwall-packages/sing-box || true

          echo
          echo "--- readlink ---"
          readlink -f package/feeds/packages/sing-box 2>/dev/null || true
          readlink -f package/feeds/openwrt-passwall-packages/sing-box 2>/dev/null || true

          echo
          echo "--- packages feed sing-box version ---"
          if [ -f package/feeds/packages/sing-box/Makefile ]; then
            grep -nE \
              '^PKG_NAME|^PKG_VERSION|^PKG_RELEASE|^PKG_SOURCE|^PKG_SOURCE_URL' \
              package/feeds/packages/sing-box/Makefile
          fi

          echo
          echo "--- PassWall sing-box version ---"
          grep -nE \
            '^PKG_NAME|^PKG_VERSION|^PKG_RELEASE|^PKG_SOURCE|^PKG_SOURCE_URL' \
            package/openwrt-passwall-packages/sing-box/Makefile

      # ================================================================
      # 9. Show feeds configuration
      # ================================================================
      - name: Show Feeds Configuration
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== FEEDS CONFIGURATION ==="
          echo "========================================"

          echo
          echo "--- feeds.conf ---"
          cat feeds.conf 2>/dev/null || true

          echo
          echo "--- feeds.conf.default ---"
          cat feeds.conf.default

          echo
          echo "--- feeds list ---"
          ./scripts/feeds list

      # ================================================================
      # 10. Generate package metadata
      # ================================================================
      - name: Generate Package Metadata
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

          echo
          echo "--- sing-box entries ---"

          grep -Rni "sing-box" \
            tmp/.packageinfo \
            tmp/.packagedeps \
            2>/dev/null | head -n 200 || true

      # ================================================================
      # 11. Enable sing-box
      # ================================================================
      - name: Enable sing-box
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== ENABLE SING-BOX ==="
          echo "========================================"

          ./scripts/config/set CONFIG_PACKAGE_sing-box y

          make defconfig

          echo
          echo "--- CONFIG ---"
          grep -n '^CONFIG_PACKAGE_sing-box' .config || true

      # ================================================================
      # 12. Verify OpenWrt package target
      # ================================================================
      - name: Verify sing-box Package Target
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== VERIFY SING-BOX TARGET ==="
          echo "========================================"

          echo
          echo "--- package/sing-box ---"
          make package/sing-box/compile V=s -n 2>&1 \
            | tail -n 120 || true

      # ================================================================
      # 13. Inspect actual selected Makefile
      # ================================================================
      - name: Inspect Selected sing-box Makefile
        run: |
          set -euo pipefail

          cd openwrt

          echo "========================================"
          echo "=== SELECTED SING-BOX MAKEFILE ==="
          echo "========================================"

          echo
          echo "--- package/feeds/packages/sing-box ---"

          if [ -f package/feeds/packages/sing-box/Makefile ]; then
            sed -n '1,140p' package/feeds/packages/sing-box/Makefile
          else
            echo "NOT FOUND"
          fi

          echo
          echo "--- package/feeds/openwrt-passwall-packages/sing-box ---"

          if [ -f package/feeds/openwrt-passwall-packages/sing-box/Makefile ]; then
            sed -n '1,140p' \
              package/feeds/openwrt-passwall-packages/sing-box/Makefile
          else
            echo "NOT FOUND"
          fi

      # ================================================================
      # 14. Final summary
      # ================================================================
      - name: Final Diagnostic Summary
        run: |
          set -euo pipefail

          cd openwrt

          echo
          echo "========================================"
          echo "=== FINAL DIAGNOSTIC SUMMARY ==="
          echo "========================================"

          echo
          echo "--- Ninja ---"
          command -v ninja
          ninja --version

          echo
          echo "--- sing-box config ---"
          grep -n '^CONFIG_PACKAGE_sing-box' .config || true

          echo
          echo "--- package target ---"
          grep -n "feeds/packages/sing-box" \
            tmp/.packagedeps 2>/dev/null || true

          echo
          echo "--- package metadata ---"
          grep -n "Source-Makefile:.*sing-box" \
            tmp/.packageinfo 2>/dev/null || true

          echo
          echo "========================================"
          echo "=== DIAGNOSTIC TEST COMPLETE ==="
          echo "========================================"
