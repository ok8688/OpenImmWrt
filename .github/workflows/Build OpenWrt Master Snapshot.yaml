# ==== VARIANT CONFIG START ====
name: Build OpenWrt Master Snapshot
env:
  IMMORTALWRT_VERSION: master
  INCLUDE_XRAY: "true"
  INCLUDE_ARGON_CONFIG: "false"
  CACHE_NS: openwrt-master
  RELEASE_TAG_PREFIX: openwrt-master
  RELEASE_TITLE: "OpenWrt Master Snapshot Experimental"
  RELEASE_HEADING: "🧪 OpenWrt Master Snapshot Experimental Build (SDC v1.4 Final)"
  BRANCH_LABEL: openwrt-master
# ==== VARIANT CONFIG END ====

on:
  workflow_dispatch:
#  schedule:
#    - cron: '26 14 * * 0,2,4,6' # UTC 14:26 = HKT 22:26 (每週日、二、四、六)

concurrency:
  group: immwrt-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # upload-artifact（失敗時上傳 pkg debug log）所需

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_COMPRESS: 1
      CCACHE_MAXSIZE: 8G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,file_macro

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Generate Metadata
        id: meta
        run: echo "date=$(date +%Y%m%d || echo unknown)" >> $GITHUB_OUTPUT

      - name: Inject SRE Core Utilities
        run: |
          cat << 'EOF' > /tmp/sre_utils.sh
          #!/bin/bash
          set -o pipefail
          retry() {
            touch /tmp/retry_history.log /tmp/retry_debug.log
            local max=5; local delay=2; local n=1
            local cmd_name="$(printf '%q ' "$@")"
            
            while true; do
              if "$@" >> /tmp/retry_debug.log 2>&1; then
                echo "✅ Success!"
                break
              else
                if [[ $n -lt $max ]]; then
                  echo "⚠️ [FAIL] Attempt $n: $cmd_name" >> /tmp/retry_history.log
                  echo "⚠️ Failed! Retrying in $delay seconds..."
                  ((n++)); delay=$((delay * 2 + RANDOM % 3)); sleep $delay
                else
                  echo "❌ FATAL: Failed after $max retries: $cmd_name"
                  cat /tmp/retry_history.log
                  echo "--- LAST 300 LINES OF ERROR LOG ---"
                  tail -n 300 /tmp/retry_debug.log
                  return 1
                fi
              fi
            done
          }
          EOF
          chmod +x /tmp/sre_utils.sh
          
      - name: Init SRE Environment & ABI Fingerprint
        run: |
          set -euo pipefail
          echo "▶️ [Step] Cleaning up Runner environment..."
          sudo docker system prune -af || true
          # SRE 防呆安全網：追加 || true，避免未來 Runner 映像檔變更引發崩潰
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/lib/node_modules /opt/hostedtoolcache /usr/local/share/powershell /usr/share/rust /opt/microsoft /usr/local/.ghcup /usr/share/miniconda /usr/local/share/boost /usr/local/share/chromium || true
          
          echo "▶️ [Step] Installing dependencies..."
          sudo apt-get update -qq && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget jq golang-go ccache
          
          echo "▶️ [Step] Deploying 4G Swap Armor (Deterministic)..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          echo "=== 🧬 Deep ABI Fingerprint ===" > toolchain.info
          echo "Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> toolchain.info
          echo "Kernel: $(uname -r)" >> toolchain.info
          echo "GCC: $(gcc --version | head -n1)" >> toolchain.info
          echo "Clang: $(clang --version | head -n1)" >> toolchain.info
          echo "Make: $(make --version | head -n1)" >> toolchain.info
          echo "Ccache: $(ccache --version | head -n1)" >> toolchain.info
          echo "ld: $(ld --version | head -n1)" >> toolchain.info
          echo "ldd: $(ldd --version | head -n1)" >> toolchain.info
          echo "libc6: $(dpkg-query -W -f='${Version}' libc6 2>/dev/null || echo unknown)" >> toolchain.info
          echo "Go: $(go version 2>/dev/null || echo 'unknown')" >> toolchain.info
          

      - name: Clone & Official PassWall Main Source (Latest Commit)
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          
          echo "▶️ [Step] Cloning OpenWrt ${IMMORTALWRT_VERSION} Source..."
          retry bash -c 'rm -rf openwrt && timeout 20m git clone -b "${IMMORTALWRT_VERSION}" --single-branch --depth 1 https://github.com/openwrt/openwrt.git openwrt'
          cd openwrt
          
          echo "▶️ [Step] Updating base feeds..."
          retry timeout 35m ./scripts/feeds update -a
          
          # ✅ 終極物理防護 - 徹底切斷舊版供應鏈，並嚴格拔除不要的插件
          ./scripts/feeds uninstall luci-app-passwall xray-core sing-box smartdns luci-app-smartdns luci-theme-argon luci-app-argon-config || true
          rm -rf feeds/luci/applications/luci-app-passwall feeds/packages/net/xray-core feeds/packages/net/sing-box feeds/packages/net/smartdns feeds/luci/applications/luci-app-smartdns feeds/luci/themes/luci-theme-argon feeds/luci/applications/luci-app-argon-config
          rm -rf package/feeds/luci/luci-app-passwall package/feeds/packages/xray-core package/feeds/packages/sing-box package/feeds/packages/smartdns package/feeds/luci/luci-app-smartdns package/feeds/luci/luci-theme-argon package/feeds/luci/luci-app-argon-config
          
          echo "▶️ [Step] Cloning Passwall ecosystem (Latest Upstream)..."
          retry bash -c 'timeout 20m git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages'
          retry bash -c 'timeout 20m git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall'

          echo "▶️ [Step] Cloning luci-app-smartdns from pymumu upstream (replaces feeds copy)..."
          retry bash -c 'timeout 20m git clone --depth=1 https://github.com/pymumu/luci-app-smartdns.git package/luci-app-smartdns'

          echo "▶️ [Step] Cloning luci-theme-argon from jerrykuku upstream (replaces feeds copy)..."
          retry bash -c 'timeout 20m git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon'
            



          # =====================================================
          # firewall4 fullcone patch override 已撤走（2026-11-16）
          # 上游今朝 09:55（2fe3065a "firewall4: refresh fullcone patches"）
          # 自己刷新咗 patch：hunk #1 嘅 disable_ipv6 context 已刪、
          # hunk #8 嘅 helper 已改為 false，現行 patch 對 master fw4
          # 3722eadc 原樣打得上，唔使再 sed。25.12 線用分支自帶舊
          # patch＋舊 fw4，一向原樣打得上。若上游日後 fw4 再漂移令
          # patch 打唔上，喺呢度按日期設閘加 fixup（見 2026-10-27、
          # 2026-11-15 兩次先例），唔好喺 patch 本體改。
          # =====================================================

          echo "▶️ [Step] Installing feeds..."
          # =====================================================
          # fullcone stack (official line only)
          # Official OpenWrt ships no fullcone support at all; the stack
          # has three parts, all fetched from ImmortalWrt upstream master
          # and staged before feeds install / defconfig:
          #   1. firewall4 patch -> firewall4 generates `fullcone` rules
          #   2. nftables patch  -> `nft` understands the `fullcone` expr
          #   3. fullconenat-nft -> kmod-nft-fullcone (kernel module,
          #      incl. its 2 patches: kernel-6.12 build fix + honour
          #      port range / flags)
          # First build verifies all three apply/build on official
          # master; the manifest audit (COMMON_REQUIRED_PACKAGES)
          # fail-louds if kmod-nft-fullcone is not installed.
          # =====================================================
          echo "[Step] Fetching fullcone stack from ImmortalWrt upstream..."
          mkdir -p package/network/config/firewall4/patches
          retry bash -c 'curl -fsSL -o package/network/config/firewall4/patches/001-firewall4-add-support-for-fullcone-nat.patch https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/network/config/firewall4/patches/001-firewall4-add-support-for-fullcone-nat.patch'
          [ -s package/network/config/firewall4/patches/001-firewall4-add-support-for-fullcone-nat.patch ] || { echo "ERROR: fullcone firewall4 patch download failed or empty"; exit 1; }
          grep -q '^From ' package/network/config/firewall4/patches/001-firewall4-add-support-for-fullcone-nat.patch || { echo "ERROR: fullcone firewall4 patch does not look like a patch"; exit 1; }
          mkdir -p package/network/utils/nftables/patches
          retry bash -c 'curl -fsSL -o package/network/utils/nftables/patches/002-nftables-add-fullcone-expression-support.patch https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/network/utils/nftables/patches/002-nftables-add-fullcone-expression-support.patch'
          [ -s package/network/utils/nftables/patches/002-nftables-add-fullcone-expression-support.patch ] || { echo "ERROR: fullcone nftables patch download failed or empty"; exit 1; }
          grep -q '^From ' package/network/utils/nftables/patches/002-nftables-add-fullcone-expression-support.patch || { echo "ERROR: fullcone nftables patch does not look like a patch"; exit 1; }
          mkdir -p package/network/utils/fullconenat-nft/patches
          retry bash -c 'curl -fsSL -o package/network/utils/fullconenat-nft/Makefile https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/network/utils/fullconenat-nft/Makefile'
          retry bash -c 'curl -fsSL -o package/network/utils/fullconenat-nft/patches/010-fix-build-with-kernel-6.12.patch https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/network/utils/fullconenat-nft/patches/010-fix-build-with-kernel-6.12.patch'
          retry bash -c 'curl -fsSL -o package/network/utils/fullconenat-nft/patches/011-honour-port-range-and-flags.patch https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/network/utils/fullconenat-nft/patches/011-honour-port-range-and-flags.patch'
          [ -s package/network/utils/fullconenat-nft/Makefile ] || { echo "ERROR: fullconenat-nft Makefile download failed or empty"; exit 1; }
          grep -q 'PKG_NAME:=fullconenat-nft' package/network/utils/fullconenat-nft/Makefile || { echo "ERROR: fullconenat-nft Makefile does not look right"; exit 1; }
          for _p in package/network/utils/fullconenat-nft/patches/*.patch; do [ -s "$_p" ] || { echo "ERROR: fullconenat-nft patch $_p download failed or empty"; exit 1; }; grep -q '^--- a/' "$_p" || { echo "ERROR: fullconenat-nft patch $_p does not look like a patch"; exit 1; }; done
          sha256sum package/network/config/firewall4/patches/001-firewall4-add-support-for-fullcone-nat.patch | awk '{print "Fullcone Patch SHA256: " $1}' > ../fullcone-patch.info
          sha256sum package/network/utils/nftables/patches/002-nftables-add-fullcone-expression-support.patch | awk '{print "nftables Fullcone Patch SHA256: " $1}' >> ../fullcone-patch.info
          sha256sum package/network/utils/fullconenat-nft/Makefile | awk '{print "fullconenat-nft Makefile SHA256: " $1}' >> ../fullcone-patch.info
          sha256sum package/network/utils/fullconenat-nft/patches/010-fix-build-with-kernel-6.12.patch | awk '{print "fullconenat-nft 010 Patch SHA256: " $1}' >> ../fullcone-patch.info
          sha256sum package/network/utils/fullconenat-nft/patches/011-honour-port-range-and-flags.patch | awk '{print "fullconenat-nft 011 Patch SHA256: " $1}' >> ../fullcone-patch.info
          echo "fullcone stack staged: firewall4 patch $(wc -l < package/network/config/firewall4/patches/001-firewall4-add-support-for-fullcone-nat.patch) lines, nftables patch $(wc -l < package/network/utils/nftables/patches/002-nftables-add-fullcone-expression-support.patch) lines, fullconenat-nft package + 2 patches"
          # =====================================================

          retry bash -c 'set -o pipefail; timeout 35m ./scripts/feeds install -a -f'

          # =====================================================
          # 🔒 Stable Drift Control v1.4 (Anti-Stale & Adaptive)
          # Definition is staged now and executed AFTER DL cache restore.
          # =====================================================
          cat > /tmp/sdc.sh <<'SDC_SCRIPT'
          # =====================================================
          # 🔒 Stable Drift Control v1.4 (Anti-Stale & Adaptive)
          # =====================================================
          set +e
          
          sync_hash () {
            local name="$1"
            local makefile="$2"
            
            if [ ! -f "$makefile" ]; then
              echo "⚠️ $name: Makefile missing, skip"
              return
            fi
            
            echo "🔒 [SDC v1.4] Adaptive source resolution: $name"
            
            # 1. POSIX ERE 萬用賦值 Regex 兼容修正 (:=, ?=, =) 並防止雙重定義
            if grep -Eq '^[[:space:]]*PKG_HASH[[:space:]]*(:=|\?=|=)' "$makefile"; then
              sed -i -E 's/^[[:space:]]*PKG_HASH[[:space:]]*(:=|\?=|=).*/PKG_HASH:=skip/' "$makefile"
            else
              printf '\nPKG_HASH:=skip\n' >> "$makefile"
            fi

            # PKG_MIRROR_HASH 保持原樣或僅清除，不自動盲目賦值
            if grep -Eq '^[[:space:]]*PKG_MIRROR_HASH[[:space:]]*(:=|\?=|=)' "$makefile"; then
              sed -i -E 's/^[[:space:]]*PKG_MIRROR_HASH[[:space:]]*(:=|\?=|=).*/PKG_MIRROR_HASH:=skip/' "$makefile"
            fi
            
            # 2. v7 (2026-10-09): 從 Makefile 直接解析預期檔名。
            #    不再依賴 make dumpinfo——SDC 在 defconfig 之前執行，
            #    dumpinfo 可能失效導致 pkg_source 為空，進而觸發 pattern 誤殺。
            local pkg_source="" pkg_name="" pkg_version=""
            pkg_name="$(grep -E '^[[:space:]]*PKG_NAME[[:space:]]*(:=|\\?=|=)' "$makefile" | head -n 1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*$//')"
            pkg_version="$(grep -E '^[[:space:]]*PKG_VERSION[[:space:]]*(:=|\\?=|=)' "$makefile" | head -n 1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*$//')"
            pkg_source="$(grep -E '^[[:space:]]*PKG_SOURCE[[:space:]]*(:=|\\?=|=)' "$makefile" | head -n 1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*$//')"
            # 展開 $(PKG_NAME) / $(PKG_VERSION)
            if [ -n "$pkg_name" ]; then
              pkg_source="$(printf '%s' "$pkg_source" | sed "s|\$(PKG_NAME)|$pkg_name|g")"
            fi
            if [ -n "$pkg_version" ]; then
              pkg_source="$(printf '%s' "$pkg_source" | sed "s|\$(PKG_VERSION)|$pkg_version|g")"
            fi
            # 清理 CR 與空白；若仍有未展開變數則視為未知
            pkg_source="$(printf '%s' "$pkg_source" | sed 's/\r$//' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')"
            case "$pkg_source" in
              *'$('*) pkg_source="" ;;
            esac
            
            if [ -n "$pkg_source" ]; then
              pkg_source="$(basename -- "$pkg_source")"
              echo "🧹 [SDC v1.4] Purging stale dl cache for exact source: $pkg_source"
              rm -f "dl/$pkg_source"
            else
              echo "⚠️ $name: 無法從 Makefile 解析 PKG_SOURCE，跳過精準清理"
            fi
            
            # 3. 觸發實際下載 (強制從上游抓取乾淨 Artifact，並保留錯誤可觀測性)
            if make "package/${name}/download" V=s >"/tmp/sdc-${name}-download.log" 2>&1; then
              echo "✅ $name: download stage completed"
            else
              echo "⚠️ $name: download stage failed; continuing with Adaptive Drift"
              tail -n 80 "/tmp/sdc-${name}-download.log" || true
            fi
            
            local FILE=""
            
            # 4. 精準定位 OpenWrt 實際下載 Artifact
            if [ -n "$pkg_source" ]; then
              if [ -f "dl/$pkg_source" ]; then
                FILE="dl/$pkg_source"
              fi
            fi
            
            # 5. v7 (2026-10-09): pattern 兜底已徹底移除。
            #    它曾在版本漂移時撿到舊版 tarball 並把錯誤 hash 寫入 Makefile。
            #    預期檔案缺失時保留 PKG_HASH:=skip，讓 build 階段重新下載不驗證。
            if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
              echo "⚠️ $name: expected artifact missing, keeping 'skip' (拒絕用舊版 tarball 冒充)"
            fi
            
            # 6. SHA256 Self-Healing
            if [ -n "$FILE" ] && [ -f "$FILE" ]; then
              local NEW_HASH=""
              NEW_HASH="$(sha256sum "$FILE" | awk '{print $1}')" || true
              if [ -n "$NEW_HASH" ]; then
                sed -i -E "s/^[[:space:]]*PKG_HASH[[:space:]]*(:=|\?=|=).*/PKG_HASH:=$NEW_HASH/" "$makefile"
                echo "✅ $name: Upstream aligned"
                echo "   Source : $FILE"
                echo "   SHA256 : $NEW_HASH"
              else
                echo "⚠️ $name: SHA256 calculation failed, keeping 'skip'"
              fi
            else
              echo "⚠️ $name: Artifact missing, keeping 'skip' to force build"
            fi
          }
          SDC_SCRIPT
          chmod +x /tmp/sdc.sh

          # =====================================================
          # 🚀 Surgical Strike: 源碼級物理抹除 xray-core 依賴 (交由 GUI 內建下載)
          # 僅在 INCLUDE_XRAY != "true" 時執行
          # =====================================================
          if [ "${INCLUDE_XRAY}" != "true" ]; then
            echo "▶️ [Step] Eradicating xray-core from PassWall dependencies..."
            sed -i 's/+PACKAGE_luci-app-passwall_INCLUDE_Xray:xray-core//g' package/openwrt-passwall/luci-app-passwall/Makefile || true
            sed -i '/config PACKAGE_luci-app-passwall_INCLUDE_Xray/,/config / s/default y/default n/g' package/openwrt-passwall/luci-app-passwall/Makefile || true
            rm -rf package/openwrt-passwall-packages/xray-core
            if grep -q '+PACKAGE_luci-app-passwall_INCLUDE_Xray:xray-core' package/openwrt-passwall/luci-app-passwall/Makefile; then
              echo "❌ xray-core dependency still present after eradication"
              exit 1
            fi
            echo "✅ xray-core physically eradicated from build tree."
          else
            echo "ℹ️ INCLUDE_XRAY=true, keeping xray-core in build tree."
          fi
          # =====================================================

          # 全域精準破壞前端選單殘留節點 
          find feeds package -path "*/usr/share/luci/menu.d/*.json" -type f | while read -r f; do
            jq 'del(."admin/system/mounts", ."admin/services/mounts", ."admin/system/plugins") // .' "$f" > "$f.tmp" && mv "$f.tmp" "$f" || echo "⚠️ Skipping invalid JSON: $f"
          done
          
          # 結構化 SBOM 生成
          {
            echo "=== 🧬 COMPONENT COMMIT ==="
            echo "OpenWrt Commit: $(git rev-parse HEAD)"
            echo "PassWall Commit: $(git -C package/openwrt-passwall rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "PassWall Packages Commit: $(git -C package/openwrt-passwall-packages rev-parse HEAD 2>/dev/null || echo unknown)"
            cat ../rust-package.info 2>/dev/null || true
          echo "Baseline Patchset: ubuntu26-openwrt-master-v1"
          echo "=== 🧬 FEEDS LIST ==="
            ./scripts/feeds list -f | sort
            echo "=== 🧬 REPOS STATUS ==="
            find package -maxdepth 2 -name .git -print0 | while IFS= read -r -d '' gitdir; do
              repo=$(dirname "$gitdir")
              echo "$(git -C "$repo" remote get-url origin 2>/dev/null):$(git -C "$repo" rev-parse HEAD)"
            done | sort
          } > ../feeds.snapshot.txt

      - name: Inject ImmWrt Backup Tool (ib v1.9)
        run: |
          set -e
          mkdir -p openwrt/package/base-files/files/usr/bin
          cat << 'IB_SCRIPT' > openwrt/package/base-files/files/usr/bin/ib
          #!/bin/sh

          VERSION="1.9"
          readonly VERSION

          BACKUP_DIR="${IBB_BACKUP_DIR:-/root}"
          readonly BACKUP_DIR

          BACKUP="$BACKUP_DIR/immwrt-backup-latest.tar.gz"
          readonly BACKUP

          WORK="/tmp/ib-work"
          readonly WORK

          SAFETY="/tmp/ib-safety"
          readonly SAFETY

          VERIFY_TEST="/tmp/ib-verify-test"
          readonly VERIFY_TEST


          # ============================================================
          # Backup Scope
          # ============================================================

          REQUIRED_FILES="
          /etc/config/ddns
          /etc/config/dhcp
          /etc/config/firewall
          /etc/config/luci
          /etc/config/network
          /etc/config/passwall
          /etc/config/passwall_server
          /etc/config/smartdns
          /etc/config/system
          /etc/crontabs/root
          "
          readonly REQUIRED_FILES

          OPTIONAL_FILES="
          /etc/config/argon
          /etc/smartdns/custom.conf
          /etc/passwall/rules/direct_host
          /etc/passwall/rules/direct_ip
          /etc/passwall/rules/proxy_host
          /etc/passwall/rules/proxy_ip
          "
          readonly OPTIONAL_FILES

          # Decoupled: Configuration backup does not mandate package installation on restore
          MIN_REQUIRED_PACKAGES=""
          readonly MIN_REQUIRED_PACKAGES


          # ============================================================
          # Core Utilities & Safety Boundaries
          # ============================================================

          fail()
          {
              printf "FAILED: %s\n" "$1" >&2
              exit "${2:-1}"
          }


          safe_rm()
          {
              case "$1" in
                  "$WORK"|"$SAFETY"|"$VERIFY_TEST")
                      rm -rf -- "$1"
                      ;;
                  *)
                      fail "safe_rm aborted: illegal path $1" 1
                      ;;
              esac
          }


          check_root()
          {
              [ "$(id -u)" = "0" ] || fail "root required" 1
          }


          #
          # Exact restore whitelist.
          #
          validate_path()
          {
              case "$1" in
                  /etc/config/ddns|\
                  /etc/config/dhcp|\
                  /etc/config/firewall|\
                  /etc/config/luci|\
                  /etc/config/network|\
                  /etc/config/passwall|\
                  /etc/config/passwall_server|\
                  /etc/config/smartdns|\
                  /etc/config/system|\
                  /etc/crontabs/root|\
                  /etc/config/argon|\
                  /etc/smartdns/custom.conf|\
                  /etc/passwall/rules/direct_host|\
                  /etc/passwall/rules/direct_ip|\
                  /etc/passwall/rules/proxy_host|\
                  /etc/passwall/rules/proxy_ip)
                      return 0
                      ;;
                  *)
                      return 1
                      ;;
              esac
          }


          usage()
          {
              printf \
          "ImmWrt Backup Tool v%s
          Usage:
            ib {b|backup}
            ib {r|restore}
            ib {v|verify}
            ib {i|info}
            ib {ver|version}
          \n" "$VERSION"

              exit 2
          }


          # ============================================================
          # Error Boundaries
          # ============================================================

          fail_backup()
          {
              rm -f -- "$BACKUP.tmp"
              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"
              fail "$1" "${2:-1}"
          }


          fail_verify()
          {
              safe_rm "$WORK"
              fail "$1" "${2:-1}"
          }


          fail_restore_preflight()
          {
              safe_rm "$WORK"
              safe_rm "$SAFETY"
              fail "$1" "${2:-1}"
          }


          # ============================================================
          # Signal Traps
          # ============================================================

          trap_backup()
          {
              printf "\n[!] Backup interrupted. Cleaning up...\n"

              rm -f -- "$BACKUP.tmp"

              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"

              exit 130
          }


          trap_restore()
          {
              printf "\n[!] Restore interrupted! Initiating emergency rollback...\n"

              if [ -f "$SAFETY/state.txt" ]; then

                  if restore_safety_back; then
                      printf "Rollback completed successfully.\n"

                      safe_rm "$SAFETY"
                      safe_rm "$WORK"
                  else
                      printf \
          "CRITICAL: Rollback failed!
          CRITICAL: Safety snapshot preserved at %s
          " "$SAFETY" >&2
                  fi

              else

                  printf \
          "INFO: Restore interrupted before configuration replacement.
          "

                  safe_rm "$SAFETY"
                  safe_rm "$WORK"
              fi

              exit 130
          }


          # ============================================================
          # Hardened Archive Validation
          # ============================================================

          verify_archive_members()
          {
              local archive="$1"
              local listing
              local line
              local type_char
              local member

              listing="$(tar -tvzf "$archive" 2>/dev/null)" || \
                  fail "Unable to inspect archive members: $archive" 5

              while IFS= read -r line; do

                  [ -n "$line" ] || continue

                  type_char="$(printf '%s' "$line" | cut -c1)"
                  member="$(printf '%s' "$line" | awk '{print $NF}')"

                  case "$type_char" in
                      -|d)
                          ;;
                      *)
                          fail \
          "Security violation: Unsafe archive entry type ($type_char): $member" \
                              5
                          ;;
                  esac

                  case "$member" in
                      files|files/*|manifest.txt|checksum.sha256|packages.txt|firmware.info)
                          ;;
                      *)
                          fail \
          "Security violation: Archive member outside whitelist: $member" \
                              5
                          ;;
                  esac

                  case "$member" in
                      /*|../*|*/../*|*/..)
                          fail \
          "Security violation: Archive traversal detected: $member" \
                              5
                          ;;
                  esac

              done <<ARCHIVE_LISTING
          $listing
          ARCHIVE_LISTING
          }


          # ============================================================
          # Archive ↔ Manifest Exact Verification
          # ============================================================

          verify_archive_exact()
          {
              local archive="$1"
              local listing
              local member
              local path

              listing="$(tar -tzf "$archive" 2>/dev/null)" || \
                  fail "Unable to enumerate archive members" 5

              while IFS= read -r member; do

                  [ -n "$member" ] || continue

                  case "$member" in

                      files/|files/*/)
                          # Ignore directory entries generated by tar
                          ;;

                      files/*)

                          path="/${member#files/}"

                          grep -Fqx "$path" "$WORK/manifest.parsed" || \
                              fail \
          "Security violation: Unmanifested file in archive: $member" \
                                  5
                          ;;

                      *)
                          # Already covered by verify_archive_members()
                          ;;

                  esac

              done <<ARCHIVE_LISTING
          $listing
          ARCHIVE_LISTING
          }


          # ============================================================
          # Package / Environment Support
          # ============================================================

          package_installed()
          {
              local pkg="$1"

              if command -v apk >/dev/null 2>&1; then
                  apk info -e "$pkg" >/dev/null 2>&1
                  return $?
              fi

              if command -v opkg >/dev/null 2>&1; then
                  opkg status "$pkg" 2>/dev/null |
                      grep -q '^Status: install'
                  return $?
              fi

              return 1
          }


          # ============================================================
          # Firmware Fingerprint
          # ============================================================

          create_firmware_info()
          {
              local rel="/etc/openwrt_release"

              {
                  printf "IBB-Version: %s\n" "$VERSION"

                  printf "Architecture: %s\n" \
                      "$(uname -m)"

                  printf "Distribution: %s\n" \
                      "$(grep DISTRIB_ID "$rel" 2>/dev/null |
                          cut -d= -f2 |
                          tr -d "'" ||
                          echo "Unknown")"

                  printf "Version: %s\n" \
                      "$(grep DISTRIB_RELEASE "$rel" 2>/dev/null |
                          cut -d= -f2 |
                          tr -d "'" ||
                          echo "Unknown")"

                  printf "Revision: %s\n" \
                      "$(grep DISTRIB_REVISION "$rel" 2>/dev/null |
                          cut -d= -f2 |
                          tr -d "'" ||
                          echo "Unknown")"

                  printf "Kernel: %s\n" \
                      "$(uname -r)"

                  printf "Date: %s\n" \
                      "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

              } > "$1"
          }


          verify_firmware_info()
          {
              local backup_arch

              [ -f "firmware.info" ] || return 0

              backup_arch="$(
                  grep '^Architecture:' firmware.info |
                  cut -d' ' -f2-
              )"

              [ "$backup_arch" = "$(uname -m)" ] || \
                  fail_restore_preflight \
          "Architecture mismatch (Backup: $backup_arch, System: $(uname -m))" \
                      8
          }


          # ============================================================
          # Package Compatibility
          # ============================================================

          verify_packages()
          {
              local pkg

              for pkg in $MIN_REQUIRED_PACKAGES; do

                  package_installed "$pkg" || \
                      fail_restore_preflight \
          "Missing required dependency: $pkg" \
                          8

              done

              [ -f "packages.txt" ] || return 0

              awk '
                  /\[REQUIRED\]/ {
                      m=1
                      next
                  }

                  /^\[/ {
                      m=0
                  }

                  m && NF {
                      print $1
                  }
              ' packages.txt |
              while IFS= read -r pkg; do

                  package_installed "$pkg" || \
                      printf \
          "  [WARN] Missing historical package: %s\n" \
                          "$pkg"

              done
          }


          # ============================================================
          # Manifest Parsing
          # ============================================================

          read_manifest()
          {
              awk '
                  /^[[:space:]]*#/ {
                      next
                  }

                  NF == 0 {
                      next
                  }

                  $1 ~ /^\// {
                      print $1
                  }
              ' manifest.txt > "$WORK/manifest.raw" || \
                  fail_restore_preflight "Manifest parse error" 5

              sort "$WORK/manifest.raw" |
                  uniq -d > "$WORK/dups"

              if [ -s "$WORK/dups" ]; then
                  fail_restore_preflight \
          "Manifest duplicate entries: $(cat "$WORK/dups")" \
                      5
              fi

              sort -u "$WORK/manifest.raw" > "$WORK/manifest.parsed"

              [ -s "$WORK/manifest.parsed" ] || \
                  fail_restore_preflight "Manifest empty" 5
          }


          # ============================================================
          # Manifest Security Verification
          # ============================================================

          verify_manifest()
          {
              local f

              while IFS= read -r f; do

                  validate_path "$f" || \
                      fail_restore_preflight \
          "Path outside restore whitelist: $f" \
                          5

                  [ -f "files$f" ] || \
                      fail_restore_preflight \
          "Missing archive file for manifest entry: $f" \
                          5

                  done < "$WORK/manifest.parsed"
          }


          # ============================================================
          # Safety Snapshot
          # ============================================================

          restore_safety()
          {
              local f

              safe_rm "$SAFETY"

              mkdir -p "$SAFETY/files" || \
                  fail_restore_preflight "Safety directory creation failed" 1

              : > "$SAFETY/state.txt" || \
                  fail_restore_preflight "Safety state creation failed" 1

              while IFS= read -r f; do

                  if [ -f "$f" ]; then

                      mkdir -p "$(dirname "$SAFETY/files$f")" || \
                          fail_restore_preflight \
          "Safety directory creation failed: $f" \
                              1

                      cp -p "$f" "$SAFETY/files$f" || \
                          fail_restore_preflight \
          "Safety snapshot failed: $f" \
                              1

                      printf "EXIST %s\n" "$f" \
                          >> "$SAFETY/state.txt"

                  elif [ -e "$f" ]; then

                      fail_restore_preflight \
          "INVALID STATE: $f is not a regular file" \
                          7

                  else

                      printf "MISSING %s\n" "$f" \
                          >> "$SAFETY/state.txt"

                  fi

              done < "$WORK/manifest.parsed"
          }


          # ============================================================
          # Emergency Rollback
          # ============================================================

          restore_safety_back()
          {
              local status=0
              local state
              local f
              local tmp

              [ -f "$SAFETY/state.txt" ] || return 1

              while IFS=' ' read -r state f; do

                  case "$state" in

                      EXIST)

                          if [ ! -f "$SAFETY/files$f" ]; then

                              printf \
          "CRITICAL: Safety snapshot missing for %s\n" \
                                  "$f" >&2

                              status=1
                              continue
                          fi

                          mkdir -p "$(dirname "$f")" || {

                              printf \
          "CRITICAL: Rollback directory creation failed for %s\n" \
                                  "$f" >&2

                              status=1
                              continue
                          }

                          tmp="${f}.ib-tmp"

                          rm -f "$tmp"

                          if ! cp -p "$SAFETY/files$f" "$tmp" ||
                               ! mv -f "$tmp" "$f"; then

                              printf \
          "CRITICAL: Rollback failed for %s\n" \
                                  "$f" >&2

                              rm -f "$tmp"

                              status=1
                          fi
                          ;;

                      MISSING)

                          if [ -e "$f" ] && ! rm -f "$f"; then

                              printf \
          "CRITICAL: Failed to remove restored file %s\n" \
                                  "$f" >&2

                              status=1
                          fi
                          ;;

                      *)

                          printf \
          "CRITICAL: Invalid safety state: %s %s\n" \
                              "$state" "$f" >&2

                          status=1
                          ;;

                  esac

              done < "$SAFETY/state.txt"

              [ "$status" -eq 0 ]
          }


          # ============================================================
          # Post-Restore Verification
          # ============================================================

          verify_restored()
          {
              local f
              local hash_src
              local hash_dst

              while IFS= read -r f; do

                  if [ ! -f "$f" ]; then

                      printf \
          "ERROR: Restored file missing: %s\n" \
                          "$f" >&2

                      return 1
                  fi

                  hash_src="$(
                      sha256sum "files$f" |
                      cut -d' ' -f1
                  )" || return 1

                  hash_dst="$(
                      sha256sum "$f" |
                      cut -d' ' -f1
                  )" || return 1

                  if [ "$hash_src" != "$hash_dst" ]; then

                      printf \
          "ERROR: Restored checksum mismatch: %s\n" \
                          "$f" >&2

                      return 1
                  fi

              done < "$WORK/manifest.parsed"

              return 0
          }


          # ============================================================
          # Target File Collection
          # ============================================================

          get_target_files()
          {
              local list=""
              local f

              for f in $REQUIRED_FILES; do

                  [ -f "$f" ] || \
                      fail "Missing REQUIRED file: $f" 3

                  list="$list $f"

              done

              for f in $OPTIONAL_FILES; do

                  if [ -f "$f" ]; then

                      list="$list $f"

                  else

                      printf \
          "INFO: Optional file missing, skipping: %s\n" \
                          "$f" >&2

                  fi

              done

              echo "$list"
          }


          # ============================================================
          # BACKUP
          # ============================================================

          backup()
          {
              trap trap_backup INT TERM HUP

              local target_files
              local count=0
              local f

              target_files="$(get_target_files)"

              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"

              rm -f -- "$BACKUP.tmp"

              mkdir -p "$WORK/files" || \
                  fail_backup "Workspace creation failed" 1

              for f in $target_files; do

                  mkdir -p "$(dirname "$WORK/files$f")" || \
                      fail_backup \
          "Directory creation failed: $f" \
                          1

                  cp -p "$f" "$WORK/files$f" || \
                      fail_backup \
          "Copy failed: $f" \
                          1

                  count=$((count + 1))

              done

              cd "$WORK" || \
                  fail_backup "Workspace cd failed" 1


              {
                  printf "# ImmWrt Backup Manifest\n"
                  printf "# Tool-Version: %s\n" "$VERSION"
                  printf "# Date: %s\n" \
                      "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

                  for f in $target_files; do
                      printf "%s\n" "$f"
                  done

              } > manifest.txt || \
                  fail_backup "Manifest creation failed" 1


              : > checksum.sha256 || \
                  fail_backup "Checksum file creation failed" 4

              for f in $target_files; do

                  sha256sum "files$f" >> checksum.sha256 || \
                      fail_backup \
          "Checksum calculation failed: $f" \
                          4

              done


              {
                  printf "[REQUIRED]\n"

                  for f in $MIN_REQUIRED_PACKAGES; do
                      printf "%s\n" "$f"
                  done

              } > packages.txt || \
                  fail_backup "Package metadata creation failed" 1


              create_firmware_info "firmware.info"


              tar -czf "$BACKUP.tmp" \
                  files \
                  manifest.txt \
                  checksum.sha256 \
                  packages.txt \
                  firmware.info || \
                  fail_backup "Tar compression failed" 1


              gzip -t "$BACKUP.tmp" || \
                  fail_backup \
          "Gzip integrity test failed" \
                      4

              tar -tzf "$BACKUP.tmp" >/dev/null || \
                  fail_backup \
          "Tar header integrity test failed" \
                      4


              mkdir -p "$VERIFY_TEST" || \
                  fail_backup \
          "Verification workspace creation failed" \
                      4

              tar -xzf "$BACKUP.tmp" -C "$VERIFY_TEST" || \
                  fail_backup \
          "Secondary extraction failed" \
                      4

              (
                  cd "$VERIFY_TEST" || exit 1

                  sha256sum -c checksum.sha256 \
                      >/dev/null 2>&1
              ) || {

                  safe_rm "$VERIFY_TEST"

                  fail_backup \
          "Secondary extraction checksum verification failed" \
                      4
              }

              safe_rm "$VERIFY_TEST"

              verify_archive_members "$BACKUP.tmp" || \
                  fail_backup \
          "Archive member security verification failed" \
                      5

              mv "$BACKUP.tmp" "$BACKUP" || \
                  fail_backup \
          "Atomic replacement of backup failed" \
                      1

              safe_rm "$WORK"

              trap - INT TERM HUP

              printf \
          "\nBackup completed successfully. (%d files)\n" \
                  "$count"
          }


          # ============================================================
          # RESTORE
          # ============================================================

          restore()
          {
              local count=0
              local f
              local tmp

              [ -f "$BACKUP" ] || \
                  fail \
          "Backup not found at $BACKUP" \
                      5

              gzip -t "$BACKUP" || \
                  fail_restore_preflight \
          "Archive gzip corrupted" \
                      5

              verify_archive_members "$BACKUP" || \
                  fail_restore_preflight \
          "Archive member security verification failed" \
                      5

              safe_rm "$WORK"

              mkdir -p "$WORK" || \
                  fail_restore_preflight \
          "Workspace creation failed" \
                      5

              tar -xzf "$BACKUP" -C "$WORK" || \
                  fail_restore_preflight \
          "Archive extraction failed" \
                      5

              cd "$WORK" || \
                  fail_restore_preflight \
          "Workspace cd failed" \
                      5

              [ -f "manifest.txt" ] || \
                  fail_restore_preflight \
          "Manifest missing" \
                      5

              [ -f "checksum.sha256" ] || \
                  fail_restore_preflight \
          "Checksum manifest missing" \
                      5

              read_manifest

              verify_manifest

              verify_archive_exact "$BACKUP" || \
                  fail_restore_preflight \
          "Archive exact verification failed" \
                      5

              sha256sum -c checksum.sha256 \
                  >/dev/null 2>&1 || \
                  fail_restore_preflight \
          "Archive checksum verification failed" \
                      5

              verify_firmware_info

              verify_packages

              restore_safety

              trap trap_restore INT TERM HUP

              while IFS= read -r f; do

                  mkdir -p "$(dirname "$f")" || {

                      if restore_safety_back; then

                          fail \
          "Directory creation failed for $f. Rollback successful." \
                              6

                      else

                          printf \
          "CRITICAL: Rollback failed!\n" >&2

                          printf \
          "CRITICAL: Safety snapshot preserved at %s\n" \
                              "$SAFETY" >&2

                          exit 6
                      fi
                  }

                  tmp="${f}.ib-tmp"

                  rm -f "$tmp"

                  if ! cp -p "files$f" "$tmp" ||
                       ! mv -f "$tmp" "$f"; then

                      rm -f "$tmp"

                      if restore_safety_back; then

                          fail \
          "Atomic replacement failed for $f. Rollback successful." \
                              6

                      else

                          printf \
          "CRITICAL: Atomic replacement and rollback failed!\n" \
                              >&2

                          printf \
          "CRITICAL: Safety snapshot preserved at %s\n" \
                              "$SAFETY" >&2

                          exit 6
                      fi
                  fi

                  count=$((count + 1))

              done < "$WORK/manifest.parsed"

              if ! verify_restored; then

                  if restore_safety_back; then

                      fail \
          "Post-restore verification failed. Rollback successful." \
                          6

                  else

                      printf \
          "CRITICAL: Post-restore verification AND rollback failed!\n" \
                          >&2

                      printf \
          "CRITICAL: Safety snapshot preserved at %s\n" \
                              "$SAFETY" >&2

                          exit 6
                  fi
              fi

              safe_rm "$SAFETY"
              safe_rm "$WORK"

              trap - INT TERM HUP

              printf \
          "Restore completed successfully. (%d files)\n" \
                  "$count"

              exit 0
          }


          # ============================================================
          # VERIFY
          # ============================================================

          verify_cmd()
          {
              [ -f "$BACKUP" ] || \
                  fail \
          "Backup not found at $BACKUP" \
                      5

              gzip -t "$BACKUP" || \
                  fail \
          "Archive gzip corrupted" \
                      5

              verify_archive_members "$BACKUP" || \
                  fail \
          "Archive member security verification failed" \
                      5

              tar -tzf "$BACKUP" >/dev/null || \
                  fail \
          "Archive tar headers corrupted" \
                      4

              safe_rm "$WORK"

              mkdir -p "$WORK" || \
                  fail_verify \
          "Verification workspace creation failed" \
                      5

              tar -xzf "$BACKUP" -C "$WORK" || \
                  fail_verify \
          "Archive extraction failed" \
                      5

              cd "$WORK" || \
                  fail_verify \
          "Workspace cd failed" \
                      5

              [ -f "manifest.txt" ] || \
                  fail_verify \
          "Manifest missing" \
                      5

              [ -f "checksum.sha256" ] || \
                  fail_verify \
          "Checksum manifest missing" \
                      5

              read_manifest

              verify_manifest

              verify_archive_exact "$BACKUP" || \
                  fail_verify \
          "Archive exact verification failed" \
                      5

              sha256sum -c checksum.sha256 \
                  >/dev/null 2>&1 || \
                  fail_verify \
          "Checksum verification failed" \
                      5

              verify_firmware_info

              verify_packages

              safe_rm "$WORK"

              printf \
          "VERIFY SUCCESS: Archive is intact, complete, and compatible.\n"

              exit 0
          }


          # ============================================================
          # INFO
          # ============================================================

          info_cmd()
          {
              [ -f "$BACKUP" ] || \
                  fail \
          "Backup not found at $BACKUP" \
                      5

              gzip -t "$BACKUP" || \
                  fail \
          "Archive gzip corrupted" \
                      5

              verify_archive_members "$BACKUP" || \
                  fail \
          "Archive member security verification failed" \
                      5

              safe_rm "$WORK"

              mkdir -p "$WORK" || \
                  fail_verify \
          "Info workspace creation failed" \
                      5

              tar -xzf "$BACKUP" \
                  -C "$WORK" \
                  firmware.info \
                  2>/dev/null

              if [ -f "$WORK/firmware.info" ]; then

                  cat "$WORK/firmware.info"

              else

                  printf \
          "Firmware Info: Legacy archive format (no firmware.info)\n"

              fi

              safe_rm "$WORK"

              exit 0
          }


          # ============================================================
          # CLI Dispatcher
          # ============================================================

          case "$1" in

              b|backup)

                  check_root
                  backup
                  ;;

              r|restore)

                  check_root
                  restore
                  ;;

              v|verify)

                  check_root
                  verify_cmd
                  ;;

              i|info)

                  info_cmd
                  ;;

              ver|version)

                  printf "ib v%s\n" "$VERSION"
                  exit 0
                  ;;

              *)

                  usage
                  ;;

          esac
          IB_SCRIPT
          chmod 755 openwrt/package/base-files/files/usr/bin/ib

      - name: Set Argon as Default Theme
        run: |
          set -euo pipefail
          echo "▶️ [Step] Setting Argon as the default LuCI theme on first boot..."
          mkdir -p openwrt/package/base-files/files/etc/uci-defaults
          cat > openwrt/package/base-files/files/etc/uci-defaults/99-argon-default-theme <<'EOF'
          #!/bin/sh
          # Template-injected: boot into Argon by default.
          uci set luci.main.mediaurlbase='/luci-static/argon'
          uci commit luci
          exit 0
          EOF
          chmod 755 openwrt/package/base-files/files/etc/uci-defaults/99-argon-default-theme

      - name: Set OpenWrt Defaults (Timezone/NTP/Packet Steering/Mirror)
        run: |
          set -euo pipefail
          echo "[Step] Injecting OpenWrt default settings (replaces default-settings-chn)..."
          mkdir -p openwrt/package/base-files/files/etc/uci-defaults
          cat > openwrt/package/base-files/files/etc/uci-defaults/98-openwrt-defaults <<'EOF'
          #!/bin/sh
          # Template-injected: OpenWrt master defaults (replaces ImmortalWrt
          # default-settings-chn). Values verified against
          # immortalwrt/immortalwrt master package/emortal/default-settings
          # (99-default-settings, 99-default-settings-chinese); zonename
          # adapted to kk's current Asia/Hong_Kong (HKT-8, same UTC+8, no DST).
          . /etc/openwrt_release

          uci -q get system.@imm_init[0] > "/dev/null" || uci -q add system imm_init > "/dev/null"

          if ! uci -q get system.@imm_init[0].system_chn > "/dev/null"; then
            uci set system.@system[0].timezone="HKT-8"
            uci set system.@system[0].zonename="Asia/Hong_Kong"
            uci delete system.ntp.server
            uci add_list system.ntp.server="ntp.tencent.com"
            uci add_list system.ntp.server="ntp1.aliyun.com"
            uci add_list system.ntp.server="ntp.ntsc.ac.cn"
            uci add_list system.ntp.server="cn.ntp.org.cn"
            uci set system.@imm_init[0].system_chn="1"
            uci commit system
          fi

          case "$DISTRIB_TARGET" in
          "x86"/*)
            if ! uci -q get system.@imm_init[0].packet_steering > "/dev/null"; then
              uci set network.globals="globals"
              uci set network.@globals[0].packet_steering="1"
              uci commit network
              uci set system.@imm_init[0].packet_steering="1"
              uci commit system
            fi
            ;;
          esac

          sed -i "/log-facility/d" "/etc/dnsmasq.conf"
          echo "log-facility=/dev/null" >> "/etc/dnsmasq.conf"

          # apk mirror: upstream vsean URL (https://mirrors.vsean.net/openwrt) is an
          # ImmortalWrt-only mirror (302 -> downloads.immortalwrt.org), so the sed
          # below is a no-op on official OpenWrt and the official
          # downloads.openwrt.org URLs are kept. Choose a verified official-OpenWrt
          # China mirror before first flash if needed.
          apk_mirror="$(uci -q get system.@imm_init[0].apk_mirror)"
          if [ -z "$apk_mirror" ]; then
            apk_mirror="https://mirrors.vsean.net/openwrt"
            uci set system.@imm_init[0].apk_mirror="$apk_mirror"
            uci commit system
          fi
          sed -i.bak "s,https://downloads.immortalwrt.org,$apk_mirror,g" "/etc/apk/repositories.d/distfeeds.list"

          exit 0
          EOF
          chmod 755 openwrt/package/base-files/files/etc/uci-defaults/98-openwrt-defaults

          
      - name: Drop ImmortalWrt Video Repo (404)
        run: |
          set -euo pipefail
          echo "▶️ [Step] Dropping ImmortalWrt video repo (never published, 404)..."
          mkdir -p openwrt/package/base-files/files/etc/uci-defaults
          cat > openwrt/package/base-files/files/etc/uci-defaults/98-drop-video-repo <<'EOF'
          #!/bin/sh
          # Template-injected: ImmortalWrt never publishes a video feed
          # (packages.adb 404 on every release since 23.05 and all
          # snapshots; official OpenWrt does publish it). Drop the video
          # repo so `apk update` exits 0 on first boot. No-op on official
          # OpenWrt: the guard only matches ImmortalWrt/vsean URLs.
          [ -f /etc/apk/repositories.d/distfeeds.list ] || exit 0
          if grep -q -e 'immortalwrt.org' -e 'mirrors.vsean.net' /etc/apk/repositories.d/distfeeds.list; then
            sed -i '/\/video\//d' /etc/apk/repositories.d/distfeeds.list
          fi
          exit 0
          EOF
          chmod 755 openwrt/package/base-files/files/etc/uci-defaults/98-drop-video-repo
          
      - name: Generate Cache Variables
        id: var
        run: |
          echo "dl_key=dl-${{ env.CACHE_NS }}-${{ hashFiles('feeds.snapshot.txt') }}" >> $GITHUB_OUTPUT
          echo "ccache_key=ccache-${{ env.CACHE_NS }}-${{ hashFiles('feeds.snapshot.txt') }}" >> $GITHUB_OUTPUT

      - name: Restore Cache (dl)
        uses: actions/cache/restore@v6
        with:
          path: |
            openwrt/dl
          key: ${{ steps.var.outputs.dl_key }}
          restore-keys: |
            dl-${{ env.CACHE_NS }}-
            
      - name: Restore Cache (ccache)
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ${{ steps.var.outputs.ccache_key }}
          restore-keys: |
            ccache-${{ env.CACHE_NS }}-
            
      - name: Stable Drift Control (SDC v1.4 Final)
        run: |
          set -euo pipefail
          cd openwrt
