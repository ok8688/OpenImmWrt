name: TEST - Sing-box Target Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:

      # ================================================================
      # 1. Checkout ImmortalWrt
      # ================================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: d2dc130d7f8341741df04eaaf5fd4c74dcc447d7
          fetch-depth: 1

      # ================================================================
      # 2. Clone PassWall-Packages
      # ================================================================
      - name: Clone PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/xiaorouji/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          cd package/openwrt-passwall-packages

          git fetch --depth=1 origin \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          git checkout --detach \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          echo
          echo "PassWall-Packages:"
          git rev-parse HEAD

      # ================================================================
      # 3. Verify source tree
      # ================================================================
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE TREE ==="
          echo "========================================"

          echo "--- PWD ---"
          pwd

          echo
          echo "--- IMMORTALWRT ---"
          git rev-parse HEAD

          echo
          echo "--- REQUIRED DIRECTORIES ---"

          for path in \
            Makefile \
            package \
            scripts \
            target \
            toolchain \
            tools
          do
            test -e "$path"
            echo "OK: $path"
          done

          echo
          echo "--- SCRIPT DIRECTORY ---"
          ls -la scripts

      # ================================================================
      # 4. Audit Sing-box package
      # ================================================================
      - name: Audit Sing-box package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX PACKAGE AUDIT ==="
          echo "========================================"

          SINGBOX_MAKEFILE="package/openwrt-passwall-packages/sing-box/Makefile"

          test -f "$SINGBOX_MAKEFILE"

          echo "--- COMMITS ---"

          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- SING-BOX DIRECTORY ---"

          ls -la \
            package/openwrt-passwall-packages/sing-box

          echo
          echo "--- SING-BOX MAKEFILE ---"

          sed -n '1,160p' "$SINGBOX_MAKEFILE"

      # ================================================================
      # 5. Generate package metadata
      # ================================================================
      - name: Generate package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

      # ================================================================
      # 6. Inspect Sing-box metadata
      # ================================================================
      - name: Inspect Sing-box metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT SING-BOX METADATA ==="
          echo "========================================"

          echo "--- PACKAGE INFO ---"

          grep -n -A30 -B5 \
            "Source-Makefile: package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo || true

          echo
          echo "--- PACKAGE DEPENDENCIES ---"

          grep -n \
            "sing-box" \
            tmp/.packagedeps \
            | head -n 30 || true

          echo
          echo "--- CONFIG ---"

          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config || true

      # ================================================================
      # 7. Build OpenWrt host Ninja
      #
      # Confirmed previous blocker:
      #
      # staging_dir/host/bin/ninja
      #
      # was missing.
      #
      # OpenWrt's own tools/ninja target is used.
      # ================================================================
      - name: Build OpenWrt host Ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST NINJA ==="
          echo "========================================"

          echo "--- SYSTEM NINJA ---"

          if command -v ninja >/dev/null 2>&1; then
            command -v ninja
            ninja --version
          else
            echo "System ninja: NOT FOUND"
          fi

          echo
          echo "--- OPENWRT STAGING NINJA BEFORE BUILD ---"

          if [ -x staging_dir/host/bin/ninja ]; then
            staging_dir/host/bin/ninja --version
          else
            echo "OpenWrt staging ninja: NOT FOUND"
          fi

          echo
          echo "--- BUILD OPENWRT NINJA ---"

          make tools/ninja/compile V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING NINJA ---"

          test -x staging_dir/host/bin/ninja

          staging_dir/host/bin/ninja --version

          echo
          echo "Ninja path:"
          readlink -f staging_dir/host/bin/ninja

      # ================================================================
      # 8. Build OpenWrt host Meson
      # ================================================================
      - name: Build OpenWrt host Meson
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST MESON ==="
          echo "========================================"

          make tools/meson/compile V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING MESON ---"

          test -f staging_dir/host/bin/meson.py
          test -x staging_dir/host/bin/meson.py

          staging_dir/host/bin/meson.py --version

          echo
          echo "Meson path:"
          readlink -f staging_dir/host/bin/meson.py

          echo
          echo "Meson file:"
          ls -l staging_dir/host/bin/meson.py

      # ================================================================
      # 9. Verify APK host Meson/Ninja
      #
      # This previously passed after OpenWrt Ninja was built.
      # ================================================================
      - name: Verify APK host Meson Ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY APK HOST MESON/NINJA ==="
          echo "========================================"

          echo "--- NINJA ---"

          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "--- MESON ---"

          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- APK HOST TARGET ---"

          make package/system/apk/host/compile V=s -j1

          echo
          echo "APK host compile: PASS"

      # ================================================================
      # 10. Audit OpenSSL host tool
      #
      # Current confirmed blocker:
      #
      # staging_dir/host/bin/openssl
      #
      # is missing.
      #
      # IMPORTANT:
      # Do not install/symlink Ubuntu OpenSSL.
      #
      # First determine where OpenWrt provides its own host OpenSSL.
      # ================================================================
      - name: Audit OpenWrt host OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== AUDIT OPENWRT HOST OPENSSL ==="
          echo "========================================"

          echo "--- SYSTEM OPENSSL ---"

          if command -v openssl >/dev/null 2>&1; then
            command -v openssl
            openssl version
          else
            echo "System OpenSSL: NOT FOUND"
          fi

          echo
          echo "--- OPENWRT STAGING OPENSSL ---"

          if [ -x staging_dir/host/bin/openssl ]; then
            echo "OpenWrt staging OpenSSL: FOUND"
            staging_dir/host/bin/openssl version
            readlink -f staging_dir/host/bin/openssl
          else
            echo "OpenWrt staging OpenSSL: NOT FOUND"
          fi

          echo
          echo "--- OPENSSL MAKEFILES ---"

          find tools package \
            -type f \
            \( -path '*/openssl/Makefile' \
            -o -path '*/openssl*/Makefile' \) \
            -print \
            | sort \
            | head -n 100

          echo
          echo "--- OPENSSL STAGING REFERENCES ---"

          grep -RniE \
            'STAGING_DIR_HOST.*openssl|staging_dir/host/bin/openssl|INSTALL.*openssl' \
            tools package include \
            2>/dev/null \
            | head -n 100 || true

          echo
          echo "--- OPENSSL HOST TARGET REFERENCES ---"

          grep -RniE \
            'openssl.*host|host.*openssl' \
            tools package include \
            2>/dev/null \
            | head -n 150 || true

      # ================================================================
      # 11. Locate OpenSSL host target
      #
      # This step does NOT assume that the target is
      # "tools/openssl/compile".
      #
      # It searches the OpenWrt Make infrastructure for an actual
      # OpenSSL host target before attempting to build anything.
      # ================================================================
      - name: Locate OpenSSL host target
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== LOCATE OPENSSL HOST TARGET ==="
          echo "========================================"

          echo "--- TOOLS DIRECTORY ---"

          find tools \
            -maxdepth 3 \
            -type f \
            -name Makefile \
            -print \
            | sort \
            | grep -Ei 'openssl|host' \
            | head -n 100 || true

          echo
          echo "--- PACKAGE MAKEFILE REFERENCES ---"

          grep -RniE \
            'openssl|OPENSSL' \
            tools/*/Makefile \
            package/*/Makefile \
            2>/dev/null \
            | head -n 200 || true

          echo
          echo "--- TARGET CANDIDATES ---"

          find tools package \
            -type f \
            -name Makefile \
            -print \
            | while read -r mf; do
                if grep -qiE \
                  'staging_dir/host/bin/openssl|STAGING_DIR_HOST.*openssl|openssl.*HOST_BUILD' \
                  "$mf" 2>/dev/null
                then
                  echo "$mf"
                fi
              done \
            | sort -u

      # ================================================================
      # 12. Verify actual OpenSSL host target
      #
      # We use OpenWrt's Make target only after discovering the relevant
      # source definition.
      #
      # No Ubuntu OpenSSL installation.
      # No symlink.
      # No Sing-box Makefile modification.
      # ================================================================
      - name: Build OpenWrt host OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST OPENSSL ==="
          echo "========================================"

          echo "--- BEFORE BUILD ---"

          if [ -x staging_dir/host/bin/openssl ]; then
            staging_dir/host/bin/openssl version
          else
            echo "OpenWrt staging OpenSSL: NOT FOUND"
          fi

          echo
          echo "--- SEARCH KNOWN OPENSSL TARGETS ---"

          OPENSSL_TARGET=""

          for target in \
            tools/openssl/compile \
            package/system/openssl/host/compile \
            package/libs/openssl/host/compile
          do
            if make -n "$target" >/dev/null 2>&1; then
              OPENSSL_TARGET="$target"
              echo "FOUND TARGET: $OPENSSL_TARGET"
              break
            fi
          done

          if [ -z "$OPENSSL_TARGET" ]; then
            echo
            echo "ERROR: No known OpenSSL host target was found."
            echo
            echo "The previous audit output above must be used to identify"
            echo "the actual OpenWrt host OpenSSL target."
            exit 1
          fi

          echo
          echo "--- BUILD TARGET ---"
          echo "$OPENSSL_TARGET"

          make "$OPENSSL_TARGET" V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING OPENSSL ---"

          test -x staging_dir/host/bin/openssl

          staging_dir/host/bin/openssl version

          echo
          echo "OpenSSL path:"
          readlink -f staging_dir/host/bin/openssl

      # ================================================================
      # 13. Re-test Sing-box after host OpenSSL
      #
      # This is the actual continuation test.
      # ================================================================
      - name: Compile Sing-box
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== REAL SING-BOX COMPILE TEST ==="
          echo "========================================"

          echo
          echo "--- VERIFY STAGING NINJA ---"

          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "--- VERIFY STAGING MESON ---"

          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- VERIFY STAGING OPENSSL ---"

          test -x staging_dir/host/bin/openssl
          staging_dir/host/bin/openssl version

          echo
          echo "--- SING-BOX MAKEFILE ---"

          SINGBOX_MAKEFILE="package/openwrt-passwall-packages/sing-box/Makefile"

          test -f "$SINGBOX_MAKEFILE"

          grep '^PKG_NAME:=' \
            "$SINGBOX_MAKEFILE"

          grep '^PKG_VERSION:=' \
            "$SINGBOX_MAKEFILE"

          grep '^PKG_RELEASE:=' \
            "$SINGBOX_MAKEFILE"

          echo
          echo "--- REAL TARGET ---"
          echo "package/sing-box/compile"

          echo
          echo "========================================"
          echo "=== START SING-BOX BUILD ==="
          echo "========================================"

          make package/sing-box/compile V=s -j1

          echo
          echo "========================================"
          echo "=== SING-BOX COMPILE: PASS ==="
          echo "========================================"

      # ================================================================
      # 14. Final audit
      # ================================================================
      - name: Final audit
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== FINAL AUDIT ==="
          echo "========================================"

          echo
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "Sing-box:"
          grep '^PKG_NAME:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_VERSION:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_RELEASE:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          echo
          echo "OpenWrt staging Ninja:"
          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "OpenWrt staging Meson:"
          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "OpenWrt staging OpenSSL:"
          test -x staging_dir/host/bin/openssl
          staging_dir/host/bin/openssl version

          echo
          echo "APK host:"
          test -f staging_dir/host/stamp/.apk_installed
          echo "PASS"

          echo
          echo "========================================"
          echo "RESULT: PASS"
          echo "========================================"
