name: TEST - GCC Toolchain libgcc_s Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:

      # ================================================================
      # 1. Checkout latest ImmortalWrt
      #
      # IMPORTANT:
      # Always use current master.
      # This is a pure SNAPSHOT diagnostic test.
      # ================================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          fetch-depth: 1

      # ================================================================
      # 2. Clone latest official PassWall-Packages
      #
      # IMPORTANT:
      # Always use current latest main.
      # PassWall is NOT modified by this TEST.
      # ================================================================
      - name: Clone latest official PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE LATEST PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            --depth=1 \
            --branch main \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          echo
          echo "--- IMMORTALWRT HEAD ---"
          git rev-parse HEAD

          echo
          echo "--- PASSWALL-PACKAGES HEAD ---"
          git -C package/openwrt-passwall-packages rev-parse HEAD

      # ================================================================
      # 3. Verify source tree
      # ================================================================
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE TREE ==="
          echo "========================================"

          pwd

          echo
          echo "--- IMMORTALWRT ---"
          git rev-parse HEAD

          echo
          echo "--- REQUIRED DIRECTORIES ---"

          for path in \
            Makefile \
            package \
            scripts \
            target \
            toolchain \
            tools
          do
            test -e "$path"
            echo "OK: $path"
          done

      # ================================================================
      # 4. Generate package metadata
      #
      # No source modification.
      # ================================================================
      - name: Generate package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== MAKE DEFCONFIG ==="
          echo "========================================"

          make defconfig

      # ================================================================
      # 5. Diagnose compiler/toolchain environment BEFORE build
      #
      # DIAGNOSTIC ONLY.
      # No repair.
      # ================================================================
      - name: Diagnose compiler environment before toolchain build
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== COMPILER ENVIRONMENT BEFORE BUILD ==="
          echo "========================================"

          echo
          echo "--- HOST GCC ---"

          command -v gcc || true
          gcc --version 2>/dev/null | head -n 3 || true

          echo
          echo "--- HOST G++ ---"

          command -v g++ || true
          g++ --version 2>/dev/null | head -n 3 || true

          echo
          echo "--- GCC MULTILIB ---"

          gcc -print-multi-lib 2>/dev/null || true

          echo
          echo "--- GCC SEARCH PATH ---"

          gcc -print-search-dirs 2>/dev/null || true

          echo
          echo "--- GCC LIBGCC DIRECTORY ---"

          gcc -print-libgcc-file-name 2>/dev/null || true

          echo
          echo "--- HOST LIBGCC_S ---"

          find /usr \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 200 || true

          echo
          echo "--- OPENWRT TOOLCHAIN CONFIG ---"

          grep -nE \
            'CONFIG_GCC_VERSION|CONFIG_USE_GLIBC|CONFIG_USE_MUSL|CONFIG_TARGET_ARCH|CONFIG_TARGET_OPTIMIZATION' \
            .config \
            2>/dev/null \
            | head -n 100 || true

      # ================================================================
      # 6. Inspect OpenWrt toolchain Makefile
      #
      # DIAGNOSTIC ONLY.
      # ================================================================
      - name: Inspect OpenWrt toolchain Makefile
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== INSPECT TOOLCHAIN MAKEFILE ==="
          echo "========================================"

          TOOLCHAIN_MAKEFILE="package/libs/toolchain/Makefile"

          test -f "$TOOLCHAIN_MAKEFILE"

          echo
          echo "--- TOOLCHAIN MAKEFILE HEAD ---"

          sed -n '1,180p' "$TOOLCHAIN_MAKEFILE"

          echo
          echo "--- LIBGCC REFERENCES ---"

          grep -n -A12 -B12 \
            'LIBGCC_SO\|libgcc_s.so' \
            "$TOOLCHAIN_MAKEFILE" \
            || true

          echo
          echo "--- GCC VERSION REFERENCES ---"

          grep -n \
            'GCC_VERSION' \
            "$TOOLCHAIN_MAKEFILE" \
            | head -n 100 \
            || true

      # ================================================================
      # 7. Inspect toolchain variables
      #
      # DIAGNOSTIC ONLY.
      # ================================================================
      - name: Inspect toolchain variables
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== TOOLCHAIN VARIABLES ==="
          echo "========================================"

          echo
          echo "--- TARGET ---"

          grep -nE \
            '^CONFIG_TARGET_|^CONFIG_ARCH_' \
            .config \
            | head -n 120 \
            || true

          echo
          echo "--- GCC ---"

          grep -nE \
            'CONFIG_GCC_VERSION|CONFIG_EXTRA_GCC_CONFIG_OPTIONS' \
            .config \
            || true

          echo
          echo "--- TOOLCHAIN DIRECTORIES ALREADY PRESENT ---"

          find staging_dir \
            -maxdepth 2 \
            -type d \
            -name 'toolchain-*' \
            -print \
            2>/dev/null \
            | sort \
            || true

      # ================================================================
      # 8. Toolchain state BEFORE native compile
      #
      # DIAGNOSTIC ONLY.
      # ================================================================
      - name: Toolchain state before native compile
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== TOOLCHAIN STATE BEFORE COMPILE ==="
          echo "========================================"

          echo
          echo "--- staging_dir ---"

          find staging_dir \
            -maxdepth 2 \
            -type d \
            -print \
            2>/dev/null \
            | sort \
            | head -n 300 \
            || true

          echo
          echo "--- BUILD_DIR TOOLCHAIN ---"

          find build_dir \
            -maxdepth 5 \
            -type d \
            \( \
              -name 'toolchain' \
              -o -name 'gcc-*' \
              -o -name '*gcc*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 300 \
            || true

          echo
          echo "--- EXISTING libgcc_s.so ---"

          find staging_dir build_dir \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            || true

      # ================================================================
      # 9. REAL OpenWrt native toolchain compile
      #
      # IMPORTANT:
      # This is the actual native OpenWrt operation.
      #
      # NO REPAIR.
      # NO SYMLINK.
      # NO COPY.
      # ================================================================
      - name: Build OpenWrt native toolchain
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "=== BUILD OPENWRT NATIVE TOOLCHAIN ==="
          echo "========================================"

          echo
          echo "--- START ---"

          make package/libs/toolchain/compile V=s -j1

          RC=$?

          echo
          echo "--- TOOLCHAIN COMPILE RETURN CODE ---"
          echo "$RC"

          echo
          echo "========================================"
          echo "=== TOOLCHAIN COMPILE FINISHED ==="
          echo "========================================"

          exit 0

      # ================================================================
      # 10. Locate every libgcc_s.so AFTER native toolchain compile
      #
      # THIS IS THE MOST IMPORTANT STEP.
      #
      # No repair.
      # ================================================================
      - name: Locate libgcc_s.so after toolchain compile
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== LOCATE LIBGCC_S.SO AFTER BUILD ==="
          echo "========================================"

          echo
          echo "--- ALL libgcc_s.so UNDER staging_dir ---"

          find staging_dir \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "--- ALL libgcc_s.so UNDER build_dir ---"

          find build_dir \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "--- ALL libgcc_s.so UNDER TOOLCHAIN TREE ---"

          find staging_dir \
            -type f \
            -name 'libgcc_s.so*' \
            -print \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "--- ALL GCC LIB DIRECTORIES ---"

          find staging_dir build_dir \
            -type d \
            \( \
              -path '*/lib/gcc/*' \
              -o -path '*/lib64/gcc/*' \
              -o -path '*/usr/lib/gcc/*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 \
            || true

      # ================================================================
      # 11. Determine actual TOOLCHAIN_DIR
      #
      # DIAGNOSTIC ONLY.
      # ================================================================
      - name: Determine actual TOOLCHAIN_DIR
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== DETERMINE TOOLCHAIN DIR ==="
          echo "========================================"

          echo
          echo "--- staging_dir TOOLCHAIN DIRECTORIES ---"

          find staging_dir \
            -maxdepth 2 \
            -type d \
            -name 'toolchain-*' \
            -print \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "--- DETAILED TOOLCHAIN CONTENTS ---"

          for dir in staging_dir/toolchain-*; do
            if [ -d "$dir" ]; then
              echo
              echo "########################################"
              echo "TOOLCHAIN_DIR: $dir"
              echo "########################################"

              echo
              echo "--- TOP LEVEL ---"
              find "$dir" \
                -maxdepth 2 \
                -print \
                2>/dev/null \
                | sort \
                | head -n 300 \
                || true

              echo
              echo "--- lib ---"

              if [ -d "$dir/lib" ]; then
                ls -la "$dir/lib" || true
              else
                echo "$dir/lib: NOT FOUND"
              fi

              echo
              echo "--- libgcc candidates ---"

              find "$dir" \
                -type f \
                -name 'libgcc*' \
                -print \
                2>/dev/null \
                | sort \
                || true
            fi
          done

      # ================================================================
      # 12. Inspect GCC installation result
      # ================================================================
      - name: Inspect GCC installation result
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== INSPECT GCC INSTALLATION RESULT ==="
          echo "========================================"

          echo
          echo "--- GCC BINARIES IN staging_dir ---"

          find staging_dir \
            -type f \
            \( \
              -name '*gcc' \
              -o -name '*g++' \
              -o -name '*gcc-*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 \
            || true

          echo
          echo "--- GCC DIRECTORIES IN staging_dir ---"

          find staging_dir \
            -type d \
            -iname '*gcc*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 \
            || true

          echo
          echo "--- GCC DIRECTORIES IN build_dir ---"

          find build_dir \
            -type d \
            -iname '*gcc*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 \
            || true

      # ================================================================
      # 13. Inspect toolchain stamps
      #
      # Critical:
      # Determine why .built exists even if libgcc_s.so is absent.
      # ================================================================
      - name: Inspect toolchain stamps
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== TOOLCHAIN STAMPS ==="
          echo "========================================"

          echo
          echo "--- ALL TOOLCHAIN STAMPS ---"

          find build_dir staging_dir \
            -type f \
            \( \
              -name '.*.prepared*' \
              -o -name '.*.configured*' \
              -o -name '.*.built*' \
              -o -name '.*installed*' \
              -o -name '.*compile*' \
            \) \
            -print \
            2>/dev/null \
            | grep -Ei \
              'toolchain|gcc|libgcc' \
            | sort \
            | head -n 1000 \
            || true

          echo
          echo "--- TOOLCHAIN BUILD DIRECTORY ---"

          find build_dir \
            -maxdepth 6 \
            -type f \
            -path '*/toolchain/.*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 \
            || true

      # ================================================================
      # 14. Inspect generated package directory
      # ================================================================
      - name: Inspect generated libgcc package state
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== LIBGCC PACKAGE STATE ==="
          echo "========================================"

          echo
          echo "--- PACKAGE OUTPUT DIRECTORY ---"

          find bin/targets \
            -type f \
            \( \
              -iname '*libgcc*' \
              -o -iname '*gcc*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 \
            || true

          echo
          echo "--- TOOLCHAIN IPKG DIRECTORY ---"

          find build_dir \
            -type d \
            -path '*/ipkg-*/*libgcc*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 300 \
            || true

          echo
          echo "--- LIBGCC PACKAGE FILES ---"

          find build_dir \
            -type f \
            -path '*/ipkg-*/*libgcc*/*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 \
            || true

      # ================================================================
      # 15. Inspect toolchain compile log evidence
      #
      # Search actual generated logs / command traces.
      # ================================================================
      - name: Search toolchain compile evidence
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== TOOLCHAIN COMPILE EVIDENCE ==="
          echo "========================================"

          echo
          echo "--- libgcc_s REFERENCES ---"

          grep -Rni \
            'libgcc_s.so' \
            build_dir \
            staging_dir \
            package/libs/toolchain \
            2>/dev/null \
            | head -n 500 \
            || true

          echo
          echo "--- GCC INSTALL REFERENCES ---"

          grep -RniE \
            'install.*libgcc|libgcc.*install|gcc.*install|GCC.*INSTALL' \
            build_dir \
            2>/dev/null \
            | head -n 500 \
            || true

          echo
          echo "--- GCC VERSION REFERENCES ---"

          grep -Rni \
            '14.4.0' \
            build_dir \
            2>/dev/null \
            | head -n 500 \
            || true

      # ================================================================
      # 16. Final complete filesystem audit
      # ================================================================
      - name: Final GCC toolchain filesystem audit
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== FINAL GCC TOOLCHAIN AUDIT ==="
          echo "========================================"

          echo
          echo "=== IMMORTALWRT COMMIT ==="
          git rev-parse HEAD

          echo
          echo "=== PASSWALL-PACKAGES COMMIT ==="
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "=== GCC CONFIGURATION ==="
          grep -n \
            'CONFIG_GCC_VERSION' \
            .config \
            || true

          echo
          echo "=== TOOLCHAIN DIRECTORIES ==="

          find staging_dir \
            -maxdepth 2 \
            -type d \
            -name 'toolchain-*' \
            -print \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "=== libgcc_s.so ==="

          find staging_dir build_dir \
            -type f \
            -name 'libgcc_s.so*' \
            -print \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "=== libgcc ==="

          find staging_dir build_dir \
            -type f \
            -name 'libgcc*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 1000 \
            || true

          echo
          echo "=== TOOLCHAIN STAMPS ==="

          find build_dir staging_dir \
            -type f \
            2>/dev/null \
            | grep -E \
              '/toolchain/.*\.(prepared|configured|built|installed)|/toolchain/\.' \
            | sort \
            | head -n 1000 \
            || true

          echo
          echo "========================================"
          echo "=== GCC TOOLCHAIN AUDIT COMPLETE ==="
          echo "========================================"

      # ================================================================
      # 17. Explicit conclusion
      #
      # This TEST intentionally does not repair anything.
      # ================================================================
      - name: Test conclusion
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== TEST CONCLUSION ==="
          echo "========================================"

          if find staging_dir build_dir \
              -type f \
              -name 'libgcc_s.so*' \
              -print \
              2>/dev/null \
              | grep -q .; then

            echo
            echo "RESULT:"
            echo "libgcc_s.so WAS FOUND somewhere in the build tree."

            echo
            echo "Next step:"
            echo "Determine why TOOLCHAIN_DIR/lib/libgcc_s.so.*"
            echo "does not match the actual generated location."

          else

            echo
            echo "RESULT:"
            echo "libgcc_s.so WAS NOT FOUND anywhere in staging_dir/build_dir."

            echo
            echo "Next step:"
            echo "Investigate GCC toolchain runtime library generation."

          fi

          echo
          echo "IMPORTANT:"
          echo "This TEST performed NO repair."
          echo "No symlink was created."
          echo "No libgcc_s.so was copied."
          echo "No OpenWrt source was modified."
          echo "No PassWall source was modified."
          echo "No sing-box source was modified."
          echo "No SNAPSHOT master workflow was modified."

          echo
          echo "========================================"
          echo "=== END ==="
          echo "========================================"
