name: TEST - Sing-box Target Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:

      # ================================================================
      # 1. Checkout ImmortalWrt
      # ================================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: d2dc130d7f8341741df04eaaf5fd4c74dcc447d7
          fetch-depth: 1

      # ================================================================
      # 2. Clone PassWall-Packages
      # ================================================================
      - name: Clone PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/xiaorouji/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          cd package/openwrt-passwall-packages

          git fetch --depth=1 origin \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          git checkout --detach \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          echo
          echo "PassWall-Packages:"
          git rev-parse HEAD

      # ================================================================
      # 3. Verify source tree
      # ================================================================
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE TREE ==="
          echo "========================================"

          echo "--- PWD ---"
          pwd

          echo
          echo "--- IMMORTALWRT ---"
          git rev-parse HEAD

          echo
          echo "--- REQUIRED DIRECTORIES ---"

          for path in \
            Makefile \
            package \
            scripts \
            target \
            toolchain \
            tools
          do
            test -e "$path"
            echo "OK: $path"
          done

          echo
          echo "--- SCRIPT DIRECTORY ---"
          ls -la scripts

      # ================================================================
      # 4. Audit Sing-box package
      # ================================================================
      - name: Audit Sing-box package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX PACKAGE AUDIT ==="
          echo "========================================"

          SINGBOX_MAKEFILE="package/openwrt-passwall-packages/sing-box/Makefile"

          test -f "$SINGBOX_MAKEFILE"

          echo "--- COMMITS ---"

          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- SING-BOX DIRECTORY ---"

          ls -la \
            package/openwrt-passwall-packages/sing-box

          echo
          echo "--- SING-BOX MAKEFILE ---"

          sed -n '1,160p' "$SINGBOX_MAKEFILE"

      # ================================================================
      # 5. Generate package metadata
      # ================================================================
      - name: Generate package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

      # ================================================================
      # 6. Inspect Sing-box metadata
      # ================================================================
      - name: Inspect Sing-box metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT SING-BOX METADATA ==="
          echo "========================================"

          echo "--- PACKAGE INFO ---"

          grep -n -A30 -B5 \
            "Source-Makefile: package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo || true

          echo
          echo "--- PACKAGE DEPENDENCIES ---"

          grep -n \
            "sing-box" \
            tmp/.packagedeps \
            | head -n 30 || true

          echo
          echo "--- CONFIG ---"

          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config || true

      # ================================================================
      # 7. Prepare OpenWrt host Ninja
      # ================================================================
      - name: Prepare OpenWrt host ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== PREPARE OPENWRT HOST NINJA ==="
          echo "========================================"

          echo "--- SYSTEM NINJA ---"

          if command -v ninja >/dev/null 2>&1; then
            command -v ninja
            ninja --version
          else
            echo "System ninja: NOT FOUND"
          fi

          echo
          echo "--- OPENWRT STAGING NINJA BEFORE BUILD ---"

          if [ -x staging_dir/host/bin/ninja ]; then
            staging_dir/host/bin/ninja --version
          else
            echo "OpenWrt staging ninja: NOT FOUND"
          fi

          echo
          echo "--- BUILD OPENWRT NINJA ---"

          make tools/ninja/compile V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING NINJA ---"

          test -x staging_dir/host/bin/ninja

          staging_dir/host/bin/ninja --version

          echo
          echo "Ninja path:"
          readlink -f staging_dir/host/bin/ninja

      # ================================================================
      # 8. Build OpenWrt host Meson
      # ================================================================
      - name: Build OpenWrt host Meson
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST MESON ==="
          echo "========================================"

          make tools/meson/compile V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING MESON ---"

          test -f staging_dir/host/bin/meson.py
          test -x staging_dir/host/bin/meson.py

          staging_dir/host/bin/meson.py --version

          echo
          echo "Meson path:"
          readlink -f staging_dir/host/bin/meson.py

          echo
          echo "Meson file:"
          ls -l staging_dir/host/bin/meson.py

      # ================================================================
      # 9. Verify APK host Meson/Ninja
      #
      # IMPORTANT:
      # Do NOT run:
      #
      #   make package/sing-box/compile
      #
      # because that invokes the complete package dependency graph.
      #
      # This step only verifies the APK host tool target.
      # ================================================================
      - name: Verify APK host Meson Ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY APK HOST MESON/NINJA ==="
          echo "========================================"

          echo "--- NINJA ---"

          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "--- MESON ---"

          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- APK HOST TARGET ---"

          make package/system/apk/host/compile V=s -j1

          echo
          echo "APK host compile: PASS"

      # ================================================================
      # 10. Inspect Make target mapping
      #
      # IMPORTANT:
      # This does NOT execute package/sing-box/compile.
      #
      # It only asks GNU Make for its internal database.
      # ================================================================
      - name: Verify Sing-box Make target mapping
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SING-BOX MAKE TARGET ==="
          echo "========================================"

          echo "--- EXPECTED REAL TARGET ---"
          echo "package/sing-box/compile"

          echo
          echo "--- MAKE DATABASE: SING-BOX ---"

          MAKE_DB="/tmp/openwrt-make-db.txt"

          make -pn > "$MAKE_DB" 2>/dev/null

          echo
          echo "--- TARGET ENTRIES ---"

          grep -n \
            '^package/sing-box/compile:' \
            "$MAKE_DB" \
            | head -n 20 || true

          echo
          echo "--- SOURCE PATH ENTRIES ---"

          grep -n \
            '^package/openwrt-passwall-packages/sing-box/compile:' \
            "$MAKE_DB" \
            | head -n 20 || true

          echo
          echo "--- VERIFY REAL TARGET ---"

          if grep -q \
            '^package/sing-box/compile:' \
            "$MAKE_DB"
          then
            echo "OK: package/sing-box/compile exists."
          else
            echo "ERROR: package/sing-box/compile does not exist."
            exit 1
          fi

          echo
          echo "--- VERIFY SOURCE PATH IS NOT TARGET ---"

          if grep -q \
            '^package/openwrt-passwall-packages/sing-box/compile:' \
            "$MAKE_DB"
          then
            echo "ERROR: source path incorrectly appears as a Make target."
            exit 1
          else
            echo "OK: package/openwrt-passwall-packages/sing-box/compile is NOT a Make target."
          fi

      # ================================================================
      # 11. Verify Sing-box package metadata
      # ================================================================
      - name: Verify Sing-box package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SING-BOX PACKAGE METADATA ==="
          echo "========================================"

          SINGBOX_MAKEFILE="package/openwrt-passwall-packages/sing-box/Makefile"

          echo "--- MAKEFILE ---"

          test -f "$SINGBOX_MAKEFILE"

          echo
          echo "--- PACKAGE VERSION ---"

          grep '^PKG_VERSION:=' \
            "$SINGBOX_MAKEFILE"

          echo
          echo "--- PACKAGE RELEASE ---"

          grep '^PKG_RELEASE:=' \
            "$SINGBOX_MAKEFILE" || true

          echo
          echo "--- SOURCE ---"

          grep '^PKG_SOURCE' \
            "$SINGBOX_MAKEFILE" || true

          echo
          echo "--- HOST BUILD SYSTEM REFERENCES ---"

          grep -nEi \
            'meson|ninja' \
            "$SINGBOX_MAKEFILE" \
            | head -n 50 || true

      # ================================================================
      # 12. Final audit
      # ================================================================
      - name: Final audit
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== AUDIT COMPLETE ==="
          echo "========================================"

          echo
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "Sing-box:"
          grep '^PKG_VERSION:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          echo
          echo "OpenWrt staging Ninja:"
          staging_dir/host/bin/ninja --version

          echo
          echo "OpenWrt staging Meson:"
          staging_dir/host/bin/meson.py --version

          echo
          echo "========================================"
          echo "RESULT: PASS"
          echo "========================================"
