name: TEST - libgcc_s.so Toolchain Diagnosis

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:

      # ================================================================
      # 1. Checkout latest ImmortalWrt
      # ================================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          fetch-depth: 1

      # ================================================================
      # 2. Clone latest official PassWall-Packages
      #
      # IMPORTANT:
      # This remains exactly the current SNAPSHOT source model.
      # ================================================================
      - name: Clone latest official PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE LATEST PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            --depth=1 \
            --branch main \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          echo
          echo "--- PASSWALL-PACKAGES HEAD ---"

          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- PASSWALL-PACKAGES LOG ---"

          git -C package/openwrt-passwall-packages \
            log -1 --oneline --decorate

      # ================================================================
      # 3. Verify source tree and commits
      # ================================================================
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE TREE ==="
          echo "========================================"

          echo "--- PWD ---"
          pwd

          echo
          echo "--- IMMORTALWRT COMMIT ---"
          git rev-parse HEAD

          echo
          echo "--- PASSWALL-PACKAGES COMMIT ---"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- REQUIRED DIRECTORIES ---"

          for path in \
            Makefile \
            package \
            scripts \
            target \
            toolchain \
            tools
          do
            test -e "$path"
            echo "OK: $path"
          done

      # ================================================================
      # 4. Generate package metadata
      # ================================================================
      - name: Generate package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

      # ================================================================
      # 5. Capture toolchain configuration
      #
      # DIAGNOSTIC ONLY.
      # No source modification.
      # ================================================================
      - name: Capture toolchain configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== TOOLCHAIN CONFIGURATION ==="
          echo "========================================"

          echo "--- TARGET ---"

          grep -E \
            'CONFIG_TARGET_|CONFIG_ARCH|CONFIG_CPU|CONFIG_LIBC|CONFIG_GCC_VERSION' \
            .config \
            | head -n 200 || true

          echo
          echo "--- TOOLCHAIN PACKAGE CONFIG ---"

          grep -n \
            '^CONFIG_PACKAGE_libgcc=' \
            .config || true

          echo
          echo "--- GCC VERSION ---"

          grep -n \
            '^CONFIG_GCC_VERSION=' \
            .config || true

          echo
          echo "--- TOOLCHAIN MAKEFILE REFERENCES ---"

          grep -nE \
            'TOOLCHAIN_DIR|libgcc_s\.so|CONFIG_GCC_VERSION' \
            package/libs/toolchain/Makefile \
            | head -n 200 || true

      # ================================================================
      # 6. Resolve expected TOOLCHAIN_DIR
      #
      # IMPORTANT:
      # This is pure diagnosis.
      # ================================================================
      - name: Resolve TOOLCHAIN_DIR
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== RESOLVE TOOLCHAIN_DIR ==="
          echo "========================================"

          echo "--- STAGING_DIR ---"

          if [ -d staging_dir ]; then
            ls -lad staging_dir
          else
            echo "staging_dir: NOT FOUND"
          fi

          echo
          echo "--- STAGING_DIR CONTENTS ---"

          if [ -d staging_dir ]; then
            find staging_dir \
              -maxdepth 2 \
              -mindepth 1 \
              -print \
              | sort \
              | head -n 500
          else
            echo "Nothing to inspect."
          fi

          echo
          echo "--- EXPECTED GCC TOOLCHAIN DIRECTORIES ---"

          find staging_dir \
            -maxdepth 2 \
            -type d \
            -name 'toolchain-*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 100

          echo
          echo "--- GCC 14.4.0 TOOLCHAIN DIRECTORIES ---"

          find staging_dir \
            -maxdepth 3 \
            -type d \
            -name '*gcc-14.4.0*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 100

      # ================================================================
      # 7. Inspect GCC compiler availability
      # ================================================================
      - name: Inspect GCC compiler state
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== GCC COMPILER STATE ==="
          echo "========================================"

          echo "--- SYSTEM GCC ---"

          if command -v gcc >/dev/null 2>&1; then
            command -v gcc
            gcc --version | head -n 5
          else
            echo "System gcc: NOT FOUND"
          fi

          echo
          echo "--- AARCH64 OPENWRT GCC ---"

          if command -v aarch64-openwrt-linux-musl-gcc >/dev/null 2>&1; then
            command -v aarch64-openwrt-linux-musl-gcc
            aarch64-openwrt-linux-musl-gcc --version | head -n 5
          else
            echo "aarch64-openwrt-linux-musl-gcc: NOT FOUND"
          fi

          echo
          echo "--- STAGING HOST BIN ---"

          if [ -d staging_dir/host/bin ]; then
            ls -la staging_dir/host/bin \
              | head -n 300
          else
            echo "staging_dir/host/bin: NOT FOUND"
          fi

      # ================================================================
      # 8. Locate libgcc_s.so BEFORE toolchain compile
      #
      # IMPORTANT:
      # Do not fail if the file does not exist.
      # ================================================================
      - name: Locate libgcc_s.so before toolchain compile
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== LIBGCC_S.SO BEFORE TOOLCHAIN BUILD ==="
          echo "========================================"

          echo "--- ALL libgcc_s.so FILES ---"

          find . \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500

          echo
          echo "--- ALL GCC LIB DIRECTORIES ---"

          find staging_dir \
            -type d \
            -path '*/lib/gcc/*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 300

          echo
          echo "--- TOOLCHAIN lib DIRECTORIES ---"

          find staging_dir \
            -type d \
            -path '*/toolchain-*/lib' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 300

      # ================================================================
      # 9. Inspect toolchain stamps BEFORE compile
      # ================================================================
      - name: Inspect toolchain stamps before compile
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== TOOLCHAIN STAMPS BEFORE COMPILE ==="
          echo "========================================"

          echo "--- TOOLCHAIN BUILD_DIR ---"

          find build_dir \
            -maxdepth 4 \
            -type f \
            -name '.*toolchain*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500

          echo
          echo "--- TOOLCHAIN STAGING STAMPS ---"

          find staging_dir \
            -type f \
            -iname '*toolchain*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500

      # ================================================================
      # 10. Run OpenWrt toolchain compile
      #
      # IMPORTANT:
      # This is NOT a repair.
      #
      # We are asking OpenWrt's own toolchain infrastructure to
      # construct the expected toolchain.
      #
      # Failure is intentionally captured so diagnosis continues.
      # ================================================================
      - name: Run OpenWrt toolchain compile
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "=== OPENWRT TOOLCHAIN COMPILE ==="
          echo "========================================"

          make package/libs/toolchain/compile V=s -j1

          RC=$?

          echo
          echo "========================================"
          echo "=== TOOLCHAIN COMPILE EXIT CODE: $RC ==="
          echo "========================================"

          exit 0

      # ================================================================
      # 11. Locate libgcc_s.so AFTER toolchain compile
      # ================================================================
      - name: Locate libgcc_s.so after toolchain compile
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== LIBGCC_S.SO AFTER TOOLCHAIN BUILD ==="
          echo "========================================"

          echo "--- ALL libgcc_s.so FILES ---"

          find . \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 1000

          echo
          echo "--- SYMLINKS NAMED libgcc_s.so* ---"

          find . \
            -type l \
            -name 'libgcc_s.so*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500

          echo
          echo "--- TOOLCHAIN DIRECTORIES ---"

          find staging_dir \
            -maxdepth 3 \
            -type d \
            -name 'toolchain-*' \
            -print \
            2>/dev/null \
            | sort

      # ================================================================
      # 12. Inspect exact expected TOOLCHAIN_DIR
      # ================================================================
      - name: Inspect exact TOOLCHAIN_DIR contents
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== EXACT TOOLCHAIN_DIR INSPECTION ==="
          echo "========================================"

          GCC_VERSION="14.4.0"

          EXPECTED_PREFIX="staging_dir/toolchain-aarch64_cortex-a53_gcc-${GCC_VERSION}_musl"

          echo "Expected TOOLCHAIN_DIR:"
          echo "$EXPECTED_PREFIX"

          echo
          echo "--- DIRECTORY ---"

          if [ -d "$EXPECTED_PREFIX" ]; then
            echo "FOUND"
            ls -lad "$EXPECTED_PREFIX"
          else
            echo "NOT FOUND"
          fi

          echo
          echo "--- lib/ ---"

          if [ -d "$EXPECTED_PREFIX/lib" ]; then
            ls -lah "$EXPECTED_PREFIX/lib"
          else
            echo "lib directory: NOT FOUND"
          fi

          echo
          echo "--- usr/lib/ ---"

          if [ -d "$EXPECTED_PREFIX/usr/lib" ]; then
            ls -lah "$EXPECTED_PREFIX/usr/lib"
          else
            echo "usr/lib directory: NOT FOUND"
          fi

          echo
          echo "--- gcc/ ---"

          if [ -d "$EXPECTED_PREFIX/lib/gcc" ]; then
            find "$EXPECTED_PREFIX/lib/gcc" \
              -maxdepth 5 \
              -print \
              | sort \
              | head -n 1000
          else
            echo "$EXPECTED_PREFIX/lib/gcc: NOT FOUND"
          fi

      # ================================================================
      # 13. Search entire staging_dir for GCC runtime
      # ================================================================
      - name: Search staging_dir for GCC runtime
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== SEARCH STAGING_DIR FOR GCC RUNTIME ==="
          echo "========================================"

          echo "--- libgcc_s.so ---"

          find staging_dir \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort

          echo
          echo "--- GCC LIBGCC FILES ---"

          find staging_dir \
            -type f \
            \( \
              -name 'libgcc.a' \
              -o -name 'libgcc_pic.a' \
              -o -name 'libgcc.map' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 1000

          echo
          echo "--- ALL GCC DIRECTORIES ---"

          find staging_dir \
            -type d \
            -path '*/lib/gcc/*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500

      # ================================================================
      # 14. Inspect toolchain build state
      # ================================================================
      - name: Inspect toolchain build state
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== TOOLCHAIN BUILD STATE ==="
          echo "========================================"

          echo "--- BUILD_DIR TOOLCHAIN ---"

          find build_dir/target-aarch64_cortex-a53_musl \
            -maxdepth 5 \
            -print \
            2>/dev/null \
            | grep '/toolchain' \
            | sort \
            | head -n 1000 || true

          echo
          echo "--- TOOLCHAIN STAMPS ---"

          find build_dir/target-aarch64_cortex-a53_musl/toolchain \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 || true

          echo
          echo "--- STAGING TOOLCHAIN STAMPS ---"

          find staging_dir \
            -type f \
            -name '*.installed' \
            -o -name '*.built' \
            -o -name '*.configured*' \
            2>/dev/null \
            | grep -i toolchain \
            | sort \
            | head -n 500 || true

      # ================================================================
      # 15. Inspect GCC compiler sysroot / runtime search paths
      # ================================================================
      - name: Inspect GCC runtime search paths
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== GCC RUNTIME SEARCH PATHS ==="
          echo "========================================"

          if command -v aarch64-openwrt-linux-musl-gcc >/dev/null 2>&1; then

            echo "--- GCC VERSION ---"
            aarch64-openwrt-linux-musl-gcc --version | head -n 5

            echo
            echo "--- GCC PRINT SYSROOT ---"
            aarch64-openwrt-linux-musl-gcc -print-sysroot

            echo
            echo "--- GCC PRINT SEARCH DIRS ---"
            aarch64-openwrt-linux-musl-gcc \
              -print-search-dirs \
              | head -n 100

            echo
            echo "--- GCC PRINT FILE NAME ---"
            aarch64-openwrt-linux-musl-gcc \
              -print-file-name=libgcc_s.so

            echo
            echo "--- GCC PRINT FILE NAME: libgcc.a ---"
            aarch64-openwrt-linux-musl-gcc \
              -print-file-name=libgcc.a

          else
            echo "aarch64-openwrt-linux-musl-gcc: NOT FOUND"
          fi

      # ================================================================
      # 16. Inspect final relevant Makefile section
      # ================================================================
      - name: Inspect libgcc Makefile logic
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== LIBGCC MAKEFILE LOGIC ==="
          echo "========================================"

          nl -ba package/libs/toolchain/Makefile \
            | sed -n '450,530p'

          echo
          echo "--- GCC CONFIG ---"

          nl -ba package/libs/toolchain/Makefile \
            | grep -n \
              'CONFIG_GCC_VERSION' \
            | head -n 20 || true

      # ================================================================
      # 17. Final diagnosis summary
      # ================================================================
      - name: Final diagnosis summary
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== FINAL LIBGCC_S.SO DIAGNOSIS ==="
          echo "========================================"

          echo
          echo "--- COMMITS ---"

          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- EXPECTED TOOLCHAIN ---"

          EXPECTED="staging_dir/toolchain-aarch64_cortex-a53_gcc-14.4.0_musl"

          echo "$EXPECTED"

          if [ -d "$EXPECTED" ]; then
            echo "TOOLCHAIN_DIR: FOUND"
          else
            echo "TOOLCHAIN_DIR: NOT FOUND"
          fi

          echo
          echo "--- EXPECTED libgcc_s.so ---"

          if compgen -G "$EXPECTED/lib/libgcc_s.so.*" > /dev/null 2>&1; then
            echo "libgcc_s.so: FOUND"
            ls -lah "$EXPECTED"/lib/libgcc_s.so.*
          else
            echo "libgcc_s.so: NOT FOUND"
          fi

          echo
          echo "--- ALL libgcc_s.so FOUND IN TREE ---"

          find . \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500

          echo
          echo "========================================"
          echo "=== DIAGNOSTIC TEST COMPLETE ==="
          echo "========================================"
