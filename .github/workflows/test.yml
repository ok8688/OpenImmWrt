name: TEST - GCC Toolchain Full Forensic Audit

on:
  workflow_dispatch:

jobs:
  gcc-toolchain-audit:
    runs-on: ubuntu-22.04

    steps:

      # ================================================================
      # 1. Checkout latest ImmortalWrt SNAPSHOT
      # ================================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          fetch-depth: 1

      # ================================================================
      # 2. Clone latest official PassWall-Packages
      #
      # PassWall is included only to reproduce the same source tree.
      # This TEST does NOT build or modify PassWall/sing-box.
      # ================================================================
      - name: Clone latest official PassWall-Packages
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== CLONE LATEST PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            --depth=1 \
            --branch main \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          echo
          echo "--- PASSWALL-PACKAGES COMMIT ---"
          git -C package/openwrt-passwall-packages rev-parse HEAD

      # ================================================================
      # 3. Generate configuration
      # ================================================================
      - name: Generate package metadata
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

      # ================================================================
      # 4. Ask OpenWrt Make itself for the REAL variables
      #
      # IMPORTANT:
      # Do NOT infer TOOLCHAIN_DIR manually.
      # ================================================================
      - name: Resolve actual OpenWrt toolchain variables
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== REAL OPENWRT TOOLCHAIN VARIABLES ==="
          echo "========================================"

          echo
          echo "--- TOOLCHAIN_DIR ---"
          make -s -f include/toplevel.mk print \
            V=0 2>/dev/null \
            | grep -E '^TOOLCHAIN_DIR[[:space:]]*=' \
            | head -n 20 || true

          echo
          echo "--- STAGING_DIR_TOOLCHAIN ---"
          make -s -f include/toplevel.mk print \
            V=0 2>/dev/null \
            | grep -E '^STAGING_DIR_TOOLCHAIN[[:space:]]*=' \
            | head -n 20 || true

          echo
          echo "--- GCC_VERSION ---"
          grep -n 'CONFIG_GCC_VERSION' .config || true

          echo
          echo "--- TARGET_ARCH ---"
          grep -nE \
            'CONFIG_ARCH=|CONFIG_TARGET_ARCH_PACKAGES=' \
            .config || true

          echo
          echo "--- TARGET_CROSS ---"
          make -s -f include/toplevel.mk print \
            V=0 2>/dev/null \
            | grep -E '^TARGET_CROSS[[:space:]]*=' \
            | head -n 20 || true

          echo
          echo "--- TOOLCHAIN DIRECTORIES ---"
          find staging_dir \
            -maxdepth 2 \
            -type d \
            -name 'toolchain-*' \
            -print \
            2>/dev/null \
            | sort || true

      # ================================================================
      # 5. Snapshot filesystem BEFORE toolchain build
      # ================================================================
      - name: Snapshot toolchain state before build
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== TOOLCHAIN STATE BEFORE BUILD ==="
          echo "========================================"

          echo
          echo "--- staging_dir ---"
          find staging_dir \
            -maxdepth 3 \
            -type d \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 || true

          echo
          echo "--- build_dir toolchain directories ---"
          find build_dir \
            -maxdepth 5 \
            -type d \
            -name '*toolchain*' \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- EXISTING GCC RUNTIME ---"
          find staging_dir build_dir \
            -type f \
            \( \
              -name 'libgcc.a' \
              -o -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
              -o -name 'libstdc++.so*' \
              -o -name 'libatomic.so*' \
            \) \
            -print \
            2>/dev/null \
            | sort || true

      # ================================================================
      # 6. Build GCC Toolchain
      #
      # PURE BUILD.
      # No repair.
      # ================================================================
      - name: Build GCC toolchain
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== BUILD GCC TOOLCHAIN ==="
          echo "========================================"

          echo
          echo "--- START ---"

          make toolchain/compile V=s -j1

          echo
          echo "--- TOOLCHAIN COMPILE RETURNED ---"

      # ================================================================
      # 7. Inspect GCC toolchain immediately after compilation
      # ================================================================
      - name: Inspect GCC toolchain after compile
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== GCC TOOLCHAIN AFTER COMPILE ==="
          echo "========================================"

          echo
          echo "--- STAGING TOOLCHAIN DIRECTORIES ---"

          find staging_dir \
            -maxdepth 3 \
            -type d \
            -name 'toolchain-*' \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- ALL GCC DIRECTORIES ---"

          find staging_dir build_dir \
            -type d \
            \( \
              -name 'gcc' \
              -o -name 'gcc-*' \
              -o -name '*toolchain*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 1000 || true

          echo
          echo "--- libgcc.a ---"

          find staging_dir build_dir \
            -type f \
            -name 'libgcc.a' \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- libgcc_s.so* ---"

          find staging_dir build_dir \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- OTHER GCC RUNTIME ---"

          find staging_dir build_dir \
            -type f \
            \( \
              -name 'libatomic.so*' \
              -o -name 'libstdc++.so*' \
              -o -name 'libgomp.so*' \
              -o -name 'libquadmath.so*' \
            \) \
            -print \
            2>/dev/null \
            | sort || true

      # ================================================================
      # 8. Inspect actual GCC compiler/runtime
      # ================================================================
      - name: Inspect GCC runtime generation
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== GCC RUNTIME GENERATION ==="
          echo "========================================"

          echo
          echo "--- GCC EXECUTABLES ---"

          find staging_dir build_dir \
            -type f \
            \( \
              -name '*-gcc' \
              -o -name '*-gcc-*' \
            \) \
            -perm -111 \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 || true

          echo
          echo "--- GCC VERSION FROM PATH ---"

          for gccbin in \
            aarch64-openwrt-linux-musl-gcc \
            aarch64-openwrt-linux-musl-gcc-14.4.0
          do
            if command -v "$gccbin" >/dev/null 2>&1; then
              echo "FOUND: $gccbin"
              "$gccbin" --version | head -n 3
              "$gccbin" -print-libgcc-file-name || true
              "$gccbin" -print-file-name=libgcc_s.so || true
              "$gccbin" -print-file-name=libgcc.a || true
            fi
          done

          echo
          echo "--- SEARCH GCC INSTALLATION ---"

          find staging_dir/toolchain-* \
            -type f \
            \( \
              -name 'libgcc.a' \
              -o -name 'libgcc_s.so*' \
            \) \
            -print \
            2>/dev/null \
            | sort || true

      # ================================================================
      # 9. Resolve TOOLCHAIN_DIR using OpenWrt's own make environment
      # ================================================================
      - name: Resolve TOOLCHAIN_DIR after compile
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== RESOLVE TOOLCHAIN_DIR AFTER BUILD ==="
          echo "========================================"

          echo
          echo "--- DIRECTORY CANDIDATES ---"

          find staging_dir \
            -maxdepth 2 \
            -type d \
            -name 'toolchain-*' \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- EXPECTED DIRECTORY ---"

          TOOLCHAIN_CANDIDATE="$(
            find staging_dir \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -name 'toolchain-*' \
              -print \
              2>/dev/null \
              | head -n 1
          )"

          if [ -n "$TOOLCHAIN_CANDIDATE" ]; then
            echo "TOOLCHAIN CANDIDATE:"
            echo "$TOOLCHAIN_CANDIDATE"

            echo
            echo "--- CONTENTS ---"
            find "$TOOLCHAIN_CANDIDATE" \
              -maxdepth 3 \
              -print \
              2>/dev/null \
              | sort \
              | head -n 1000
          else
            echo "NO TOOLCHAIN DIRECTORY FOUND"
          fi

      # ================================================================
      # 10. Inspect toolchain stamps
      # ================================================================
      - name: Inspect toolchain build and install stamps
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== TOOLCHAIN STAMPS ==="
          echo "========================================"

          echo
          echo "--- BUILD_DIR STAMPS ---"

          find build_dir \
            -type f \
            \( \
              -name '.prepared_*' \
              -o -name '.configured_*' \
              -o -name '.built' \
              -o -name '.built_check' \
              -o -name '.installed' \
              -o -name '.toolchain_installed' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 1000 || true

          echo
          echo "--- STAGING_DIR STAMPS ---"

          find staging_dir \
            -type f \
            \( \
              -name '.prepared_*' \
              -o -name '.configured_*' \
              -o -name '.built' \
              -o -name '.built_check' \
              -o -name '.installed' \
              -o -name '.toolchain_installed' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 1000 || true

      # ================================================================
      # 11. Inspect exact libgcc installation target
      # ================================================================
      - name: Inspect libgcc installation target
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== LIBGCC INSTALL TARGET ==="
          echo "========================================"

          echo
          echo "--- package/libs/toolchain/Makefile ---"

          nl -ba package/libs/toolchain/Makefile \
            | sed -n '470,530p'

          echo
          echo "--- CONFIGURATION ---"

          grep -nE \
            'CONFIG_GCC_VERSION|CONFIG_PACKAGE_libgcc|CONFIG_EXTERNAL_TOOLCHAIN' \
            .config || true

          echo
          echo "--- TOOLCHAIN LIB DIRECTORY ---"

          for dir in staging_dir/toolchain-*; do
            if [ -d "$dir" ]; then
              echo
              echo "DIRECTORY: $dir"

              echo "--- lib ---"
              ls -la "$dir/lib" 2>/dev/null || true

              echo "--- usr/lib ---"
              ls -la "$dir/usr/lib" 2>/dev/null || true

              echo "--- GCC lib ---"
              find "$dir/lib/gcc" \
                -maxdepth 5 \
                -type f \
                -print \
                2>/dev/null \
                | sort \
                | head -n 500 || true
            fi
          done

      # ================================================================
      # 12. Attempt ONLY libgcc package compile
      #
      # This is still not a repair.
      # It is the exact failing package target.
      # ================================================================
      - name: Test libgcc package installation
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== TEST LIBGCC PACKAGE INSTALLATION ==="
          echo "========================================"

          echo
          echo "--- BEFORE ---"

          find staging_dir/toolchain-* \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- RUN LIBGCC PACKAGE COMPILE ---"

          make package/libs/toolchain/compile V=s -j1

          LIBGCC_RC=$?

          echo
          echo "--- LIBGCC PACKAGE RETURN CODE ---"
          echo "$LIBGCC_RC"

          echo
          echo "--- AFTER ---"

          find staging_dir build_dir \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort || true

          exit "$LIBGCC_RC"

      # ================================================================
      # 13. Final forensic report
      # ================================================================
      - name: Final GCC toolchain forensic report
        if: always()
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== FINAL GCC TOOLCHAIN FORENSIC AUDIT ==="
          echo "========================================"

          echo
          echo "--- IMMORTALWRT COMMIT ---"
          git rev-parse HEAD || true

          echo
          echo "--- PASSWALL-PACKAGES COMMIT ---"
          git -C package/openwrt-passwall-packages rev-parse HEAD || true

          echo
          echo "--- GCC CONFIG ---"
          grep -n 'CONFIG_GCC_VERSION' .config || true

          echo
          echo "--- TOOLCHAIN DIRECTORIES ---"
          find staging_dir \
            -maxdepth 2 \
            -type d \
            -name 'toolchain-*' \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- libgcc.a ---"
          find staging_dir build_dir \
            -type f \
            -name 'libgcc.a' \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- libgcc_s.so* ---"
          find staging_dir build_dir \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- GCC RUNTIME LIBRARIES ---"
          find staging_dir build_dir \
            -type f \
            \( \
              -name 'libatomic.so*' \
              -o -name 'libstdc++.so*' \
              -o -name 'libgomp.so*' \
              -o -name 'libquadmath.so*' \
            \) \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- TOOLCHAIN STAMPS ---"
          find build_dir staging_dir \
            -type f \
            \( \
              -name '.prepared_*' \
              -o -name '.configured_*' \
              -o -name '.built' \
              -o -name '.built_check' \
              -o -name '.installed' \
              -o -name '.toolchain_installed' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 1000 || true

          echo
          echo "========================================"
          echo "=== END GCC TOOLCHAIN FORENSIC AUDIT ==="
          echo "========================================"
