name: TEST - Sing-box Target Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:

      # ================================================================
      # 1. Checkout ImmortalWrt
      #
      # IMPORTANT:
      # ImmortalWrt is intentionally FIXED.
      # This test is for the current SNAPSHOT build environment.
      # ================================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: d2dc130d7f8341741df04eaaf5fd4c74dcc447d7
          fetch-depth: 1

      # ================================================================
      # 2. Clone latest official PassWall-Packages
      #
      # IMPORTANT:
      # Always pull the CURRENT latest main commit.
      #
      # Official repository:
      # Openwrt-Passwall/openwrt-passwall-packages
      #
      # DO NOT pin an old PassWall-Packages commit here.
      # ================================================================
      - name: Clone latest official PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE LATEST PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            --depth=1 \
            --branch main \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          echo
          echo "--- PASSWALL-PACKAGES REMOTE ---"

          git -C package/openwrt-passwall-packages remote -v

          echo
          echo "--- PASSWALL-PACKAGES HEAD ---"

          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- PASSWALL-PACKAGES LOG ---"

          git -C package/openwrt-passwall-packages \
            log -1 --oneline --decorate

      # ================================================================
      # 3. Verify source tree
      # ================================================================
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE TREE ==="
          echo "========================================"

          echo "--- PWD ---"
          pwd

          echo
          echo "--- IMMORTALWRT ---"
          git rev-parse HEAD

          echo
          echo "--- REQUIRED DIRECTORIES ---"

          for path in \
            Makefile \
            package \
            scripts \
            target \
            toolchain \
            tools
          do
            test -e "$path"
            echo "OK: $path"
          done

          echo
          echo "--- SCRIPT DIRECTORY ---"
          ls -la scripts

      # ================================================================
      # 4. Audit Sing-box package
      # ================================================================
      - name: Audit Sing-box package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX PACKAGE AUDIT ==="
          echo "========================================"

          SINGBOX_MAKEFILE="package/openwrt-passwall-packages/sing-box/Makefile"

          test -f "$SINGBOX_MAKEFILE"

          echo "--- COMMITS ---"

          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "Latest PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- SING-BOX DIRECTORY ---"

          ls -la \
            package/openwrt-passwall-packages/sing-box

          echo
          echo "--- SING-BOX MAKEFILE ---"

          sed -n '1,180p' "$SINGBOX_MAKEFILE"

      # ================================================================
      # 5. Generate package metadata
      # ================================================================
      - name: Generate package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

      # ================================================================
      # 6. Inspect Sing-box metadata
      # ================================================================
      - name: Inspect Sing-box metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT SING-BOX METADATA ==="
          echo "========================================"

          echo "--- PACKAGE INFO ---"

          grep -n -A30 -B5 \
            "Source-Makefile: package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo || true

          echo
          echo "--- PACKAGE DEPENDENCIES ---"

          grep -n \
            "sing-box" \
            tmp/.packagedeps \
            | head -n 50 || true

          echo
          echo "--- CONFIG ---"

          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config || true

      # ================================================================
      # 7. Build OpenWrt host Ninja
      # ================================================================
      - name: Build OpenWrt host Ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST NINJA ==="
          echo "========================================"

          echo "--- SYSTEM NINJA ---"

          if command -v ninja >/dev/null 2>&1; then
            command -v ninja
            ninja --version
          else
            echo "System ninja: NOT FOUND"
          fi

          echo
          echo "--- OPENWRT STAGING NINJA BEFORE BUILD ---"

          if [ -x staging_dir/host/bin/ninja ]; then
            staging_dir/host/bin/ninja --version
          else
            echo "OpenWrt staging ninja: NOT FOUND"
          fi

          echo
          echo "--- BUILD OPENWRT NINJA ---"

          make tools/ninja/compile V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING NINJA ---"

          test -x staging_dir/host/bin/ninja

          staging_dir/host/bin/ninja --version

          echo
          echo "Ninja path:"
          readlink -f staging_dir/host/bin/ninja

      # ================================================================
      # 8. Build OpenWrt host Meson
      # ================================================================
      - name: Build OpenWrt host Meson
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST MESON ==="
          echo "========================================"

          make tools/meson/compile V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING MESON ---"

          test -f staging_dir/host/bin/meson.py
          test -x staging_dir/host/bin/meson.py

          staging_dir/host/bin/meson.py --version

          echo
          echo "Meson path:"
          readlink -f staging_dir/host/bin/meson.py

      # ================================================================
      # 9. Verify APK host
      #
      # Previously confirmed PASS after Ninja was supplied.
      # ================================================================
      - name: Verify APK host Meson Ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY APK HOST MESON/NINJA ==="
          echo "========================================"

          echo "--- NINJA ---"

          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "--- MESON ---"

          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- APK HOST TARGET ---"

          make package/system/apk/host/compile V=s -j1

          echo
          echo "APK host compile: PASS"

      # ================================================================
      # 10. Locate OpenSSL host dependency
      #
      # IMPORTANT:
      # We do NOT guess a target.
      # We only inspect the actual source tree.
      # ================================================================
      - name: Locate OpenSSL host dependency
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== LOCATE OPENSSL HOST DEPENDENCY ==="
          echo "========================================"

          echo "--- STAGING OPENSSL ---"

          if [ -x staging_dir/host/bin/openssl ]; then
            echo "FOUND:"
            readlink -f staging_dir/host/bin/openssl
            staging_dir/host/bin/openssl version
          else
            echo "staging_dir/host/bin/openssl: NOT FOUND"
          fi

          echo
          echo "--- PACKAGE MAKEFILE REFERENCES ---"

          grep -RniE \
            'STAGING_DIR_HOST.*openssl|BUILD_KEY_APK_SEC|BUILD_KEY_APK_PUB' \
            package \
            --exclude-dir=.git \
            | head -n 200 || true

          echo
          echo "--- INCLUDE REFERENCES ---"

          grep -RniE \
            'STAGING_DIR_HOST.*openssl|OPENSSL_DIR|libcrypto|libssl' \
            include \
            --exclude-dir=.git \
            | head -n 300 || true

          echo
          echo "--- TOOLS REFERENCES ---"

          grep -RniE \
            'STAGING_DIR_HOST.*openssl|OPENSSL_DIR|libcrypto|libssl' \
            tools \
            --exclude-dir=.git \
            | head -n 300 || true

          echo
          echo "--- OPENSSL DIRECTORIES ---"

          find tools package \
            -maxdepth 5 \
            -type d \
            \( \
              -iname '*openssl*' \
              -o -iname '*libssl*' \
              -o -iname '*libcrypto*' \
            \) \
            -print \
            | sort \
            | head -n 300

          echo
          echo "--- OPENSSL MAKEFILES ---"

          find tools package \
            -type f \
            -name Makefile \
            -print \
            | while read -r mf; do
                if grep -qiE \
                  'openssl|libcrypto|libssl' \
                  "$mf" 2>/dev/null
                then
                  echo "$mf"
                fi
              done \
            | sort \
            | head -n 300

      # ================================================================
      # 11. Diagnose Host OpenSSL Target
      #
      # IMPORTANT:
      # This step ONLY diagnoses the actual OpenWrt source tree.
      # It does NOT invent or build an OpenSSL target.
      # ================================================================
      - name: Diagnose Host OpenSSL Target
        shell: bash
        run: |
          set -euo pipefail
          cd .

          echo "========================================"
          echo "=== DIAGNOSE HOST OPENSSL TARGET ==="
          echo "========================================"

          echo "--- PACKAGE/SYSTEM/APK/MAKEFILE ---"
          sed -n '1,240p' package/system/apk/Makefile || true

          echo
          echo "--- ALL HOST OPENSSL REFERENCES ---"

          grep -RniE \
            'HostBuild|HOST_BUILD|openssl.*host|host.*openssl|STAGING_DIR_HOST.*openssl' \
            package include rules.mk 2>/dev/null || true

          echo
          echo "--- HOST OPENSSL TARGET CANDIDATES ---"

          find package include \
            -type f \
            -print 2>/dev/null |
          xargs grep -nE \
            'HostBuild.*openssl|PKG_NAME.*openssl|HOST_BUILD.*openssl' \
            2>/dev/null || true

          echo
          echo "--- OPENSSL IN PACKAGE MAKEFILES ---"

          grep -RniE \
            'PKG_NAME.*openssl|PKG_SOURCE.*openssl|Build/Host' \
            package 2>/dev/null |
          head -n 300 || true

          echo
          echo "--- CURRENT STAGING OPENSSL ---"

          ls -l staging_dir/host/bin/openssl 2>/dev/null || true

          echo
          echo "--- MAKE TARGET HELP ---"

          make help 2>/dev/null | grep -i openssl || true

          echo
          echo "========================================"
          echo "=== DIAGNOSIS COMPLETE ==="
          echo "========================================"

      # ================================================================
      # 12. Inspect APK signing key rule
      # ================================================================
      - name: Inspect APK signing key rule
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT APK SIGNING KEY RULE ==="
          echo "========================================"

          echo "--- package/Makefile ---"

          nl -ba package/Makefile \
            | sed -n '45,80p'

          echo
          echo "--- BUILD KEY REFERENCES ---"

          grep -Rni \
            'BUILD_KEY_APK_' \
            package include \
            --exclude-dir=.git \
            | head -n 100 || true

      # ================================================================
      # 13. Inspect host dependency infrastructure
      # ================================================================
      - name: Inspect host dependency infrastructure
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT HOST DEPENDENCY SYSTEM ==="
          echo "========================================"

          echo "--- HOST BUILD REFERENCES ---"

          grep -RniE \
            'HOST_BUILD|Build/Host|Host/Compile|STAGING_DIR_HOST' \
            include \
            --exclude-dir=.git \
            | head -n 400 || true

          echo
          echo "--- HOST TOOL INSTALL REFERENCES ---"

          grep -RniE \
            'INSTALL_BIN.*STAGING_DIR_HOST|STAGING_DIR_HOST.*/bin/' \
            include tools package \
            --exclude-dir=.git \
            | head -n 500 || true

      # ================================================================
      # 14. State report before real build
      # ================================================================
      - name: State report
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CURRENT BUILD STATE ==="
          echo "========================================"

          echo
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "Sing-box:"
          grep '^PKG_NAME:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_VERSION:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_RELEASE:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          echo
          echo "Ninja:"
          staging_dir/host/bin/ninja --version

          echo
          echo "Meson:"
          staging_dir/host/bin/meson.py --version

          echo
          echo "OpenSSL:"

          if [ -x staging_dir/host/bin/openssl ]; then
            staging_dir/host/bin/openssl version
          else
            echo "NOT FOUND"
          fi

      # ================================================================
      # 15. REAL SING-BOX COMPILE TEST
      # ================================================================
      - name: Real Sing-box compile test
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== REAL SING-BOX COMPILE TEST ==="
          echo "========================================"

          echo
          echo "--- VERIFY STAGING NINJA ---"

          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "--- VERIFY STAGING MESON ---"

          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- VERIFY SING-BOX MAKEFILE ---"

          SINGBOX_MAKEFILE="package/openwrt-passwall-packages/sing-box/Makefile"

          test -f "$SINGBOX_MAKEFILE"

          grep '^PKG_NAME:=' \
            "$SINGBOX_MAKEFILE"

          grep '^PKG_VERSION:=' \
            "$SINGBOX_MAKEFILE"

          grep '^PKG_RELEASE:=' \
            "$SINGBOX_MAKEFILE"

          echo
          echo "--- REAL TARGET ---"
          echo "package/sing-box/compile"

          echo
          echo "========================================"
          echo "=== START SING-BOX BUILD ==="
          echo "========================================"

          make package/sing-box/compile V=s -j1

          echo
          echo "========================================"
          echo "=== SING-BOX COMPILE: PASS ==="
          echo "========================================"

      # ================================================================
      # 16. Final audit
      # ================================================================
      - name: Final audit
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== FINAL AUDIT ==="
          echo "========================================"

          echo
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "Sing-box:"
          grep '^PKG_NAME:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_VERSION:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_RELEASE:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          echo
          echo "OpenWrt staging Ninja:"
          staging_dir/host/bin/ninja --version

          echo
          echo "OpenWrt staging Meson:"
          staging_dir/host/bin/meson.py --version

          echo
          echo "OpenWrt staging OpenSSL:"

          if [ -x staging_dir/host/bin/openssl ]; then
            staging_dir/host/bin/openssl version
          else
            echo "NOT FOUND"
          fi

          echo
          echo "========================================"
          echo "RESULT: PASS"
          echo "========================================"
