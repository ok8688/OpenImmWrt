name: TEST - GCC Toolchain Forensic Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:

      # ================================================================
      # 1. Checkout ImmortalWrt
      #
      # IMPORTANT:
      # ImmortalWrt always uses the latest master commit.
      # This test is for the current SNAPSHOT build environment.
      # ================================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          fetch-depth: 1

      # ================================================================
      # 2. Clone latest official PassWall-Packages
      #
      # IMPORTANT:
      # Always pull the CURRENT latest main commit.
      #
      # This repository is only needed to reproduce the same
      # dependency environment.
      #
      # NO PassWall source will be modified.
      # ================================================================
      - name: Clone latest official PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE LATEST PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            --depth=1 \
            --branch main \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          echo
          echo "--- PASSWALL-PACKAGES HEAD ---"

          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- PASSWALL-PACKAGES LOG ---"

          git -C package/openwrt-passwall-packages \
            log -1 --oneline --decorate

      # ================================================================
      # 3. Verify source tree and commits
      # ================================================================
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE TREE ==="
          echo "========================================"

          echo
          echo "--- IMMORTALWRT COMMIT ---"
          git rev-parse HEAD

          echo
          echo "--- PASSWALL-PACKAGES COMMIT ---"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- REQUIRED DIRECTORIES ---"

          for path in \
            Makefile \
            package \
            scripts \
            target \
            toolchain \
            tools
          do
            test -e "$path"
            echo "OK: $path"
          done

      # ================================================================
      # 4. Generate package metadata
      #
      # This is the normal metadata generation only.
      # No source modification.
      # ================================================================
      - name: Generate package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

      # ================================================================
      # 5. GCC configuration audit
      # ================================================================
      - name: Audit GCC configuration
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== GCC CONFIGURATION AUDIT ==="
          echo "========================================"

          echo
          echo "--- GCC VERSION ---"

          grep -n \
            'CONFIG_GCC_VERSION' \
            .config || true

          echo
          echo "--- TARGET ARCH ---"

          grep -nE \
            '^CONFIG_ARCH|^CONFIG_TARGET|^CONFIG_CPU' \
            .config \
            | head -n 200 || true

          echo
          echo "--- LIBGCC PACKAGE ---"

          grep -n \
            '^CONFIG_PACKAGE_libgcc=' \
            .config || true

          echo
          echo "--- TOOLCHAIN CONFIGURATION ---"

          grep -nE \
            'CONFIG_(GCC|LIBC|EXTERNAL_TOOLCHAIN)' \
            .config \
            | head -n 200 || true

      # ================================================================
      # 6. Locate TOOLCHAIN_DIR exactly
      #
      # IMPORTANT:
      # Do not guess the path.
      # Inspect the actual Makefile expansion.
      # ================================================================
      - name: Locate TOOLCHAIN_DIR
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== LOCATE TOOLCHAIN_DIR ==="
          echo "========================================"

          echo
          echo "--- TOOLCHAIN_DIR REFERENCES ---"

          grep -Rni \
            'TOOLCHAIN_DIR' \
            include \
            toolchain \
            package \
            Makefile \
            --exclude-dir=.git \
            2>/dev/null \
            | head -n 500 || true

          echo
          echo "--- TARGET TOOLCHAIN DIRECTORIES ---"

          find staging_dir \
            -maxdepth 2 \
            -type d \
            -name 'toolchain-*' \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- ALL TOOLCHAIN-LIKE DIRECTORIES ---"

          find staging_dir build_dir \
            -maxdepth 4 \
            -type d \
            \( \
              -name 'toolchain-*' \
              -o -name '*gcc*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 || true

      # ================================================================
      # 7. Locate GCC binaries
      # ================================================================
      - name: Locate GCC binaries
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== LOCATE GCC BINARIES ==="
          echo "========================================"

          echo
          echo "--- GCC BINARIES IN STAGING ---"

          find staging_dir \
            -type f \
            \( \
              -name '*-gcc' \
              -o -name '*-g++' \
              -o -name '*-ld' \
              -o -name '*-ar' \
              -o -name '*-ranlib' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 || true

          echo
          echo "--- GCC BINARIES IN BUILD_DIR ---"

          find build_dir \
            -type f \
            \( \
              -name '*-gcc' \
              -o -name '*-g++' \
              -o -name '*-ld' \
              -o -name '*-ar' \
              -o -name '*-ranlib' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 || true

      # ================================================================
      # 8. GCC self-report
      #
      # This is critical.
      #
      # We ask GCC itself where libgcc is supposed to come from.
      # ================================================================
      - name: GCC self report
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== GCC SELF REPORT ==="
          echo "========================================"

          GCC=""

          for candidate in \
            staging_dir/toolchain-*/bin/*-gcc \
            staging_dir/toolchain-*/bin/gcc \
            build_dir/toolchain-*/gcc/*/bin/*-gcc
          do
            if [ -x "$candidate" ]; then
              GCC="$candidate"
              break
            fi
          done

          if [ -z "$GCC" ]; then
            echo "GCC binary: NOT FOUND"
            exit 0
          fi

          echo
          echo "--- GCC BINARY ---"
          echo "$GCC"

          echo
          echo "--- GCC REAL PATH ---"
          readlink -f "$GCC" || true

          echo
          echo "--- GCC VERSION ---"
          "$GCC" --version || true

          echo
          echo "--- GCC -print-search-dirs ---"
          "$GCC" -print-search-dirs || true

          echo
          echo "--- GCC -print-libgcc-file-name ---"
          "$GCC" -print-libgcc-file-name || true

          echo
          echo "--- GCC -print-file-name=libgcc.a ---"
          "$GCC" -print-file-name=libgcc.a || true

          echo
          echo "--- GCC -print-file-name=libgcc_s.so ---"
          "$GCC" -print-file-name=libgcc_s.so || true

          echo
          echo "--- GCC -print-file-name=libgcc_s.so.1 ---"
          "$GCC" -print-file-name=libgcc_s.so.1 || true

      # ================================================================
      # 9. Search all libgcc artifacts
      #
      # IMPORTANT:
      # We search BOTH staging_dir and build_dir.
      # ================================================================
      - name: Search libgcc artifacts
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== SEARCH LIBGCC ARTIFACTS ==="
          echo "========================================"

          echo
          echo "--- libgcc_s.so* ---"

          find staging_dir build_dir \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- libgcc.a ---"

          find staging_dir build_dir \
            -type f \
            -name 'libgcc.a' \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- libgcc_pic.a ---"

          find staging_dir build_dir \
            -type f \
            -name 'libgcc_pic.a' \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- libgcc.map ---"

          find staging_dir build_dir \
            -type f \
            -name 'libgcc.map' \
            -print \
            2>/dev/null \
            | sort || true

      # ================================================================
      # 10. Inspect GCC directory structure
      # ================================================================
      - name: Inspect GCC directory structure
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== GCC DIRECTORY STRUCTURE ==="
          echo "========================================"

          echo
          echo "--- staging_dir/toolchain-* ---"

          find staging_dir \
            -maxdepth 5 \
            -type d \
            -path '*toolchain-*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 || true

          echo
          echo "--- GCC LIB DIRECTORIES ---"

          find staging_dir build_dir \
            -type d \
            \( \
              -path '*/lib/gcc' \
              -o -path '*/lib/gcc/*' \
              -o -path '*/lib/gcc/*/*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 || true

          echo
          echo "--- TOOLCHAIN lib DIRECTORIES ---"

          find staging_dir \
            -type d \
            -path '*/toolchain-*/lib' \
            -print \
            2>/dev/null \
            | sort || true

      # ================================================================
      # 11. Inspect GCC toolchain build state
      # ================================================================
      - name: Inspect GCC toolchain build state
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== GCC TOOLCHAIN BUILD STATE ==="
          echo "========================================"

          echo
          echo "--- BUILD_DIR TOOLCHAIN DIRECTORIES ---"

          find build_dir \
            -maxdepth 3 \
            -type d \
            -name 'toolchain-*' \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- TOOLCHAIN STAMPS ---"

          find build_dir staging_dir \
            -type f \
            \( \
              -name '.prepared_*' \
              -o -name '.configured_*' \
              -o -name '.built' \
              -o -name '.built_check' \
              -o -name '.installed' \
              -o -name '.toolchain_installed' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 1000 || true

          echo
          echo "--- TOOLCHAIN INSTALL STAMPS ---"

          find staging_dir \
            -type f \
            -name '*.installed' \
            -o -name '.toolchain_installed' \
            2>/dev/null \
            | sort \
            | head -n 500 || true

      # ================================================================
      # 12. Inspect GCC package source
      #
      # Diagnostic only.
      # ================================================================
      - name: Inspect GCC package source
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== INSPECT GCC PACKAGE SOURCE ==="
          echo "========================================"

          echo
          echo "--- GCC MAKEFILES ---"

          find toolchain \
            -type f \
            -name Makefile \
            -print \
            2>/dev/null \
            | sort \
            | head -n 300 || true

          echo
          echo "--- GCC REFERENCES ---"

          grep -RniE \
            'libgcc_s|libgcc_pic|libgcc\.a|TOOLCHAIN_DIR|STAGING_DIR_TOOLCHAIN|gcc-runtime|gcc.*install' \
            toolchain \
            --exclude-dir=.git \
            2>/dev/null \
            | head -n 1000 || true

      # ================================================================
      # 13. Inspect toolchain installation logic
      # ================================================================
      - name: Inspect toolchain installation logic
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== INSPECT TOOLCHAIN INSTALL LOGIC ==="
          echo "========================================"

          echo
          echo "--- TOOLCHAIN INSTALL REFERENCES ---"

          grep -RniE \
            'STAGING_DIR_TOOLCHAIN|TOOLCHAIN_DIR|toolchain.*install|install.*toolchain|libgcc_s' \
            include \
            toolchain \
            package/libs/toolchain \
            --exclude-dir=.git \
            2>/dev/null \
            | head -n 1500 || true

          echo
          echo "--- GCC INSTALL COMMAND REFERENCES ---"

          grep -RniE \
            'install.*libgcc|cp.*libgcc|libgcc.*cp|libgcc.*install' \
            toolchain \
            --exclude-dir=.git \
            2>/dev/null \
            | head -n 1000 || true

      # ================================================================
      # 14. Inspect package/libs/toolchain Makefile
      # ================================================================
      - name: Inspect libgcc package Makefile
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== INSPECT LIBGCC PACKAGE MAKEFILE ==="
          echo "========================================"

          echo
          echo "--- package/libs/toolchain/Makefile ---"

          if [ -f package/libs/toolchain/Makefile ]; then

            nl -ba package/libs/toolchain/Makefile \
              | sed -n '1,900p'

          else

            echo "package/libs/toolchain/Makefile: NOT FOUND"

          fi

      # ================================================================
      # 15. Exact TOOLCHAIN_DIR runtime expansion
      #
      # Ask make to expose the actual values used by the build.
      # ================================================================
      - name: Dump Make variable toolchain paths
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== MAKE VARIABLE TOOLCHAIN PATHS ==="
          echo "========================================"

          echo
          echo "--- TOOLCHAIN_DIR ---"

          make -pn 2>/dev/null \
            | grep -E \
              '^TOOLCHAIN_DIR[[:space:]]*=' \
            | head -n 20 || true

          echo
          echo "--- STAGING_DIR_TOOLCHAIN ---"

          make -pn 2>/dev/null \
            | grep -E \
              '^STAGING_DIR_TOOLCHAIN[[:space:]]*=' \
            | head -n 20 || true

          echo
          echo "--- GCC_VERSION ---"

          make -pn 2>/dev/null \
            | grep -E \
              '^GCC_VERSION[[:space:]]*=' \
            | head -n 20 || true

          echo
          echo "--- TARGET_ARCH ---"

          make -pn 2>/dev/null \
            | grep -E \
              '^ARCH[[:space:]]*=' \
            | head -n 20 || true

      # ================================================================
      # 16. Inspect toolchain directory contents
      # ================================================================
      - name: Inspect actual TOOLCHAIN_DIR contents
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== ACTUAL TOOLCHAIN CONTENTS ==="
          echo "========================================"

          TOOLCHAIN_DIR=""

          TOOLCHAIN_DIR="$(make -pn 2>/dev/null \
            | sed -n 's/^TOOLCHAIN_DIR[[:space:]]*=[[:space:]]*//p' \
            | head -n 1 || true)"

          echo
          echo "TOOLCHAIN_DIR:"
          echo "${TOOLCHAIN_DIR:-NOT RESOLVED}"

          if [ -n "$TOOLCHAIN_DIR" ] && [ -d "$TOOLCHAIN_DIR" ]; then

            echo
            echo "--- TOOLCHAIN_DIR ROOT ---"
            ls -la "$TOOLCHAIN_DIR" || true

            echo
            echo "--- TOOLCHAIN_DIR/lib ---"

            if [ -d "$TOOLCHAIN_DIR/lib" ]; then
              ls -la "$TOOLCHAIN_DIR/lib" || true
            else
              echo "$TOOLCHAIN_DIR/lib: NOT FOUND"
            fi

            echo
            echo "--- TOOLCHAIN_DIR/lib/gcc ---"

            if [ -d "$TOOLCHAIN_DIR/lib/gcc" ]; then
              find "$TOOLCHAIN_DIR/lib/gcc" \
                -maxdepth 4 \
                -print \
                | sort \
                | head -n 1000
            else
              echo "$TOOLCHAIN_DIR/lib/gcc: NOT FOUND"
            fi

          else

            echo
            echo "TOOLCHAIN_DIR does not resolve to an existing directory."

          fi

      # ================================================================
      # 17. Check GCC runtime generation through GCC itself
      # ================================================================
      - name: Check GCC runtime generation
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== CHECK GCC RUNTIME GENERATION ==="
          echo "========================================"

          GCC=""

          for candidate in \
            staging_dir/toolchain-*/bin/*-gcc \
            staging_dir/toolchain-*/bin/gcc
          do
            if [ -x "$candidate" ]; then
              GCC="$candidate"
              break
            fi
          done

          if [ -z "$GCC" ]; then
            echo "GCC binary unavailable."
            exit 0
          fi

          echo
          echo "--- GCC ---"
          echo "$GCC"

          echo
          echo "--- GCC LIBGCC FILE ---"

          LIBGCC_FILE="$("$GCC" -print-libgcc-file-name 2>/dev/null || true)"

          echo "$LIBGCC_FILE"

          if [ -n "$LIBGCC_FILE" ] && [ -e "$LIBGCC_FILE" ]; then
            echo "libgcc runtime/static artifact: FOUND"
            ls -l "$LIBGCC_FILE"
          else
            echo "libgcc artifact reported by GCC: NOT FOUND"
          fi

          echo
          echo "--- GCC LIBGCC SEARCH ---"

          "$GCC" -print-search-dirs 2>/dev/null || true

      # ================================================================
      # 18. Final forensic classification
      #
      # IMPORTANT:
      # This step performs NO repair.
      # ================================================================
      - name: Final GCC toolchain conclusion
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "=== FINAL GCC TOOLCHAIN CONCLUSION ==="
          echo "========================================"

          echo
          echo "--- IMMORTALWRT COMMIT ---"
          git rev-parse HEAD

          echo
          echo "--- PASSWALL-PACKAGES COMMIT ---"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- GCC VERSION ---"
          grep -n \
            'CONFIG_GCC_VERSION' \
            .config || true

          echo
          echo "--- TOOLCHAIN DIRECTORIES ---"

          find staging_dir build_dir \
            -maxdepth 4 \
            -type d \
            -name 'toolchain-*' \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "--- libgcc_s.so* COUNT ---"

          LIBGCC_SO_COUNT="$(
            find staging_dir build_dir \
              -type f \
              \( \
                -name 'libgcc_s.so' \
                -o -name 'libgcc_s.so.*' \
              \) \
              -print \
              2>/dev/null \
              | wc -l
          )"

          echo "$LIBGCC_SO_COUNT"

          echo
          echo "--- libgcc.a COUNT ---"

          LIBGCC_A_COUNT="$(
            find staging_dir build_dir \
              -type f \
              -name 'libgcc.a' \
              -print \
              2>/dev/null \
              | wc -l
          )"

          echo "$LIBGCC_A_COUNT"

          echo
          echo "--- TOOLCHAIN STAMPS ---"

          find build_dir staging_dir \
            -type f \
            \( \
              -name '.prepared_*' \
              -o -name '.configured_*' \
              -o -name '.built' \
              -o -name '.built_check' \
              -o -name '.installed' \
              -o -name '.toolchain_installed' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 || true

          echo
          echo "========================================"
          echo "=== FORENSIC INTERPRETATION ==="
          echo "========================================"

          if [ "$LIBGCC_SO_COUNT" -gt 0 ]; then

            echo
            echo "RESULT:"
            echo "libgcc_s.so EXISTS somewhere in the build tree."

            echo
            echo "NEXT QUESTION:"
            echo "Determine whether it is outside TOOLCHAIN_DIR/lib."

          elif [ "$LIBGCC_A_COUNT" -gt 0 ]; then

            echo
            echo "RESULT:"
            echo "libgcc.a EXISTS, but libgcc_s.so does NOT."

            echo
            echo "NEXT QUESTION:"
            echo "Investigate GCC runtime shared-library generation/install."

          else

            echo
            echo "RESULT:"
            echo "Neither libgcc.a nor libgcc_s.so was found."

            echo
            echo "NEXT QUESTION:"
            echo "Investigate GCC toolchain build/generation itself."

          fi

          echo
          echo "IMPORTANT:"
          echo "This TEST performed NO repair."
          echo "No symlink was created."
          echo "No libgcc_s.so was copied."
          echo "No OpenWrt source was modified."
          echo "No PassWall source was modified."
          echo "No sing-box source was modified."
          echo "No SNAPSHOT workflow was modified."

          echo
          echo "========================================"
          echo "=== GCC TOOLCHAIN FORENSIC AUDIT END ==="
          echo "========================================"
