name: TEST - Sing-box Target Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:

      # ================================================================
      # 1. Checkout ImmortalWrt
      # ================================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: d2dc130d7f8341741df04eaaf5fd4c74dcc447d7
          fetch-depth: 1

      # ================================================================
      # 2. Clone PassWall-Packages
      # ================================================================
      - name: Clone PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/xiaorouji/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          cd package/openwrt-passwall-packages

          git fetch --depth=1 origin \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          git checkout --detach \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          echo
          echo "PassWall-Packages:"
          git rev-parse HEAD

      # ================================================================
      # 3. Verify source tree
      # ================================================================
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE TREE ==="
          echo "========================================"

          echo "--- PWD ---"
          pwd

          echo
          echo "--- IMMORTALWRT ---"
          git rev-parse HEAD

          echo
          echo "--- REQUIRED DIRECTORIES ---"

          for path in \
            Makefile \
            package \
            scripts \
            target \
            toolchain \
            tools
          do
            test -e "$path"
            echo "OK: $path"
          done

          echo
          echo "--- SCRIPT DIRECTORY ---"
          ls -la scripts

      # ================================================================
      # 4. Audit Sing-box package
      # ================================================================
      - name: Audit Sing-box package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX PACKAGE AUDIT ==="
          echo "========================================"

          SINGBOX_MAKEFILE="package/openwrt-passwall-packages/sing-box/Makefile"

          test -f "$SINGBOX_MAKEFILE"

          echo "--- COMMITS ---"

          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- SING-BOX DIRECTORY ---"

          ls -la \
            package/openwrt-passwall-packages/sing-box

          echo
          echo "--- SING-BOX MAKEFILE ---"

          sed -n '1,160p' "$SINGBOX_MAKEFILE"

      # ================================================================
      # 5. Generate package metadata
      # ================================================================
      - name: Generate package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

      # ================================================================
      # 6. Inspect Sing-box metadata
      # ================================================================
      - name: Inspect Sing-box metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT SING-BOX METADATA ==="
          echo "========================================"

          echo "--- PACKAGE INFO ---"

          grep -n -A30 -B5 \
            "Source-Makefile: package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo || true

          echo
          echo "--- PACKAGE DEPENDENCIES ---"

          grep -n \
            "sing-box" \
            tmp/.packagedeps \
            | head -n 30 || true

          echo
          echo "--- CONFIG ---"

          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config || true

      # ================================================================
      # 7. Build OpenWrt host Ninja
      #
      # Previous confirmed blocker:
      #
      # staging_dir/host/bin/ninja
      #
      # was missing.
      #
      # This OpenWrt-native host tool target fixed that blocker.
      # ================================================================
      - name: Build OpenWrt host Ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST NINJA ==="
          echo "========================================"

          echo "--- SYSTEM NINJA ---"

          if command -v ninja >/dev/null 2>&1; then
            command -v ninja
            ninja --version
          else
            echo "System ninja: NOT FOUND"
          fi

          echo
          echo "--- OPENWRT STAGING NINJA BEFORE BUILD ---"

          if [ -x staging_dir/host/bin/ninja ]; then
            staging_dir/host/bin/ninja --version
          else
            echo "OpenWrt staging ninja: NOT FOUND"
          fi

          echo
          echo "--- BUILD OPENWRT NINJA ---"

          make tools/ninja/compile V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING NINJA ---"

          test -x staging_dir/host/bin/ninja

          staging_dir/host/bin/ninja --version

          echo
          echo "Ninja path:"
          readlink -f staging_dir/host/bin/ninja

      # ================================================================
      # 8. Build OpenWrt host Meson
      # ================================================================
      - name: Build OpenWrt host Meson
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST MESON ==="
          echo "========================================"

          make tools/meson/compile V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING MESON ---"

          test -f staging_dir/host/bin/meson.py
          test -x staging_dir/host/bin/meson.py

          staging_dir/host/bin/meson.py --version

          echo
          echo "Meson path:"
          readlink -f staging_dir/host/bin/meson.py

          echo
          echo "Meson file:"
          ls -l staging_dir/host/bin/meson.py

      # ================================================================
      # 9. Verify APK host Meson/Ninja
      #
      # This was previously confirmed PASS after Ninja was built.
      # ================================================================
      - name: Verify APK host Meson Ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY APK HOST MESON/NINJA ==="
          echo "========================================"

          echo "--- NINJA ---"

          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "--- MESON ---"

          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- APK HOST TARGET ---"

          make package/system/apk/host/compile V=s -j1

          echo
          echo "APK host compile: PASS"

      # ================================================================
      # 10. Deep audit OpenWrt host OpenSSL
      #
      # Current confirmed blocker:
      #
      # staging_dir/host/bin/openssl
      #
      # is missing.
      #
      # IMPORTANT:
      #
      # DO NOT:
      #   - install Ubuntu OpenSSL
      #   - create a symlink
      #   - modify Sing-box Makefile
      #   - modify package dependencies
      #   - guess an OpenSSL compile target
      #
      # This step ONLY determines how this ImmortalWrt tree expects
      # staging_dir/host/bin/openssl to be provided.
      # ================================================================
      - name: Deep audit OpenWrt host OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== DEEP AUDIT OPENWRT HOST OPENSSL ==="
          echo "========================================"

          echo
          echo "--- SYSTEM OPENSSL ---"

          if command -v openssl >/dev/null 2>&1; then
            command -v openssl
            openssl version
          else
            echo "System OpenSSL: NOT FOUND"
          fi

          echo
          echo "--- OPENWRT STAGING BIN DIRECTORY ---"

          if [ -d staging_dir/host/bin ]; then
            ls -la staging_dir/host/bin | head -n 200
          else
            echo "staging_dir/host/bin: NOT FOUND"
          fi

          echo
          echo "--- OPENWRT STAGING LIB DIRECTORY ---"

          if [ -d staging_dir/host/lib ]; then
            ls -la staging_dir/host/lib | head -n 200
          else
            echo "staging_dir/host/lib: NOT FOUND"
          fi

          echo
          echo "--- STAGING OPENSSL FILES ---"

          find staging_dir/host \
            -maxdepth 5 \
            -type f \
            \( \
              -name 'openssl' \
              -o -name 'libssl*' \
              -o -name 'libcrypto*' \
            \) \
            -print \
            | sort \
            | head -n 300 || true

          echo
          echo "--- STAGING OPENSSL SYMLINKS ---"

          find staging_dir/host \
            -maxdepth 5 \
            -type l \
            \( \
              -name 'openssl' \
              -o -name 'libssl*' \
              -o -name 'libcrypto*' \
            \) \
            -print \
            -exec ls -l {} \; \
            | head -n 200 || true

          echo
          echo "--- BUILD_KEY_APK_SEC ---"

          grep -Rni \
            'BUILD_KEY_APK_SEC' \
            include package \
            --exclude-dir=.git \
            | head -n 100 || true

          echo
          echo "--- STAGING OPENSSL REFERENCES ---"

          grep -RniE \
            'STAGING_DIR_HOST.*/bin/openssl|STAGING_DIR_HOST.*openssl|OPENSSL_DIR' \
            include tools package \
            --exclude-dir=.git \
            | head -n 300 || true

          echo
          echo "--- OPENSSL HOST REFERENCES ---"

          grep -RniE \
            'openssl.*host|host.*openssl|openssl.*staging|staging.*openssl' \
            include tools package \
            --exclude-dir=.git \
            | head -n 400 || true

          echo
          echo "--- OPENSSL MAKEFILES ---"

          find tools package \
            -type f \
            -name Makefile \
            -print \
            | sort \
            | while read -r mf; do
                if grep -qiE \
                  'openssl|libcrypto|libssl' \
                  "$mf" 2>/dev/null
                then
                  echo "$mf"
                fi
              done \
            | head -n 300

          echo
          echo "--- HOST STAGING STAMPS ---"

          if [ -d staging_dir/host/stamp ]; then
            find staging_dir/host/stamp \
              -maxdepth 1 \
              -type f \
              -print \
              | sort \
              | head -n 300
          else
            echo "staging_dir/host/stamp: NOT FOUND"
          fi

          echo
          echo "--- OPENSSL RELATED STAMPS ---"

          find staging_dir/host/stamp \
            -maxdepth 1 \
            -type f \
            \( \
              -iname '*ssl*' \
              -o -iname '*crypto*' \
              -o -iname '*openssl*' \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "--- BUILD DIRECTORY OPENSSL ---"

          find build_dir/host build_dir/hostpkg \
            -maxdepth 5 \
            \( \
              -iname '*openssl*' \
              -o -iname '*libcrypto*' \
              -o -iname '*libssl*' \
            \) \
            -print \
            2>/dev/null \
            | head -n 300 || true

          echo
          echo "--- OPENSSL PACKAGE DIRECTORIES ---"

          find package \
            -maxdepth 4 \
            -type d \
            \( \
              -iname '*openssl*' \
              -o -iname '*ssl*' \
            \) \
            -print \
            | sort \
            | head -n 300 || true

          echo
          echo "========================================"
          echo "=== END OPENSSL DEEP AUDIT ==="
          echo "========================================"

      # ================================================================
      # 11. Inspect package/Makefile APK key generation
      #
      # This isolates the exact rule that caused the previous failure.
      # ================================================================
      - name: Inspect APK signing key rule
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT APK SIGNING KEY RULE ==="
          echo "========================================"

          echo "--- package/Makefile: APK KEY RULE ---"

          nl -ba package/Makefile \
            | sed -n '45,80p'

          echo
          echo "--- ALL OPENSSL INVOCATIONS IN PACKAGE MAKEFILE ---"

          grep -n \
            -C 5 \
            'STAGING_DIR_HOST.*openssl' \
            package/Makefile \
            || true

          echo
          echo "--- BUILD KEY VARIABLES ---"

          grep -Rni \
            'BUILD_KEY_APK_' \
            package include \
            --exclude-dir=.git \
            | head -n 100 || true

      # ================================================================
      # 12. Inspect OpenWrt host dependency infrastructure
      #
      # We do not assume an OpenSSL target.
      # We inspect how host tools are normally registered and staged.
      # ================================================================
      - name: Inspect OpenWrt host dependency infrastructure
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT HOST DEPENDENCY SYSTEM ==="
          echo "========================================"

          echo "--- HOST_BUILD references ---"

          grep -RniE \
            'HOST_BUILD|Build/Host|Host/Compile|STAGING_DIR_HOST' \
            include \
            --exclude-dir=.git \
            | head -n 400 || true

          echo
          echo "--- HOST TOOL INSTALL REFERENCES ---"

          grep -RniE \
            'STAGING_DIR_HOST.*bin/|INSTALL_BIN.*STAGING_DIR_HOST|install.*STAGING_DIR_HOST' \
            include tools package \
            --exclude-dir=.git \
            | head -n 500 || true

          echo
          echo "--- OPENSSL REFERENCES OUTSIDE PACKAGE DIRECTORIES ---"

          grep -RniE \
            'openssl|libcrypto|libssl' \
            include tools \
            --exclude-dir=.git \
            | head -n 500 || true

      # ================================================================
      # 13. Final OpenSSL state report
      #
      # This step does not attempt to repair anything.
      # It records the exact state before the real Sing-box test.
      # ================================================================
      - name: Final OpenSSL state report
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== FINAL OPENSSL STATE ==="
          echo "========================================"

          echo
          echo "--- staging_dir/host/bin/openssl ---"

          if [ -x staging_dir/host/bin/openssl ]; then
            echo "FOUND"
            readlink -f staging_dir/host/bin/openssl
            staging_dir/host/bin/openssl version
          else
            echo "NOT FOUND"
          fi

          echo
          echo "--- staging_dir/host/lib/libcrypto ---"

          find staging_dir/host/lib \
            -maxdepth 1 \
            \( \
              -name 'libcrypto*' \
              -o -name 'libssl*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 100 || true

          echo
          echo "--- staging_dir/host/bin ---"

          ls -la staging_dir/host/bin \
            | head -n 200

      # ================================================================
      # 14. REAL SING-BOX COMPILE TEST
      #
      # We intentionally do not repair OpenSSL here.
      #
      # The purpose of this run is to expose the exact current blocker
      # after Ninja + Meson + APK host have been prepared.
      # ================================================================
      - name: Compile Sing-box
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== REAL SING-BOX COMPILE TEST ==="
          echo "========================================"

          echo
          echo "--- VERIFY STAGING NINJA ---"

          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "--- VERIFY STAGING MESON ---"

          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- VERIFY STAGING OPENSSL ---"

          if [ -x staging_dir/host/bin/openssl ]; then
            echo "OpenWrt staging OpenSSL: FOUND"
            staging_dir/host/bin/openssl version
          else
            echo "OpenWrt staging OpenSSL: NOT FOUND"
            echo
            echo "WARNING:"
            echo "The Sing-box target is expected to fail at the APK"
            echo "signing-key generation stage if OpenSSL is required."
          fi

          echo
          echo "--- SING-BOX MAKEFILE ---"

          SINGBOX_MAKEFILE="package/openwrt-passwall-packages/sing-box/Makefile"

          test -f "$SINGBOX_MAKEFILE"

          grep '^PKG_NAME:=' \
            "$SINGBOX_MAKEFILE"

          grep '^PKG_VERSION:=' \
            "$SINGBOX_MAKEFILE"

          grep '^PKG_RELEASE:=' \
            "$SINGBOX_MAKEFILE"

          echo
          echo "--- REAL TARGET ---"
          echo "package/sing-box/compile"

          echo
          echo "========================================"
          echo "=== START SING-BOX BUILD ==="
          echo "========================================"

          make package/sing-box/compile V=s -j1

          echo
          echo "========================================"
          echo "=== SING-BOX COMPILE: PASS ==="
          echo "========================================"

      # ================================================================
      # 15. Final audit
      # ================================================================
      - name: Final audit
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== FINAL AUDIT ==="
          echo "========================================"

          echo
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "Sing-box:"
          grep '^PKG_NAME:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_VERSION:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_RELEASE:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          echo
          echo "OpenWrt staging Ninja:"
          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "OpenWrt staging Meson:"
          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "OpenWrt staging OpenSSL:"

          if [ -x staging_dir/host/bin/openssl ]; then
            staging_dir/host/bin/openssl version
          else
            echo "NOT FOUND"
          fi

          echo
          echo "========================================"
          echo "RESULT: PASS"
          echo "========================================"
