name: TEST - Sing-box Target Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:

      # ================================================================
      # 1. Checkout ImmortalWrt
      # ================================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: d2dc130d7f8341741df04ea04f5fd4c74dcc447d7
          fetch-depth: 1

      # ================================================================
      # 2. Clone PassWall-Packages
      # ================================================================
      - name: Clone PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            https://github.com/xiaorouji/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          cd package/openwrt-passwall-packages

          git checkout a8302d598ca54cda22f7fe76fa553b3df034f8ae

          echo
          echo "PassWall-Packages:"
          git rev-parse HEAD

      # ================================================================
      # 3. Verify source tree
      # ================================================================
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE TREE ==="
          echo "========================================"

          echo "--- PWD ---"
          pwd

          echo "--- IMMORTALWRT ---"
          git rev-parse HEAD

          echo "--- REQUIRED DIRECTORIES ---"

          for path in \
            Makefile \
            package \
            scripts \
            target \
            toolchain \
            tools
          do
            test -e "$path"
            echo "OK: $path"
          done

          echo
          echo "--- SCRIPT DIRECTORY ---"
          ls -la scripts

      # ================================================================
      # 4. Audit Sing-box package
      # ================================================================
      - name: Audit Sing-box package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX PACKAGE AUDIT ==="
          echo "========================================"

          test -f \
            package/openwrt-passwall-packages/sing-box/Makefile

          echo "--- COMMITS ---"

          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- SING-BOX DIRECTORY ---"

          ls -la \
            package/openwrt-passwall-packages/sing-box

          echo
          echo "--- MAKEFILE ---"

          sed -n '1,140p' \
            package/openwrt-passwall-packages/sing-box/Makefile

      # ================================================================
      # 5. Generate package metadata
      # ================================================================
      - name: Generate package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

      # ================================================================
      # 6. Inspect Sing-box metadata
      # ================================================================
      - name: Inspect Sing-box metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT SING-BOX METADATA ==="
          echo "========================================"

          echo "--- PACKAGE INFO ---"

          grep -n -A30 -B5 \
            "Source-Makefile: package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo || true

          echo
          echo "--- PACKAGE DEPENDENCIES ---"

          grep -n \
            "openwrt-passwall-packages/sing-box" \
            tmp/.packagedeps || true

          echo
          echo "--- CONFIG ---"

          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config || true

      # ================================================================
      # 7. Prepare OpenWrt host Ninja
      # ================================================================
      - name: Prepare OpenWrt host ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== PREPARE OPENWRT HOST NINJA ==="
          echo "========================================"

          echo "--- SYSTEM NINJA ---"

          if command -v ninja >/dev/null 2>&1; then
            command -v ninja
            ninja --version
          else
            echo "System ninja: NOT FOUND"
          fi

          echo
          echo "--- BEFORE BUILD ---"

          if [ -x staging_dir/host/bin/ninja ]; then
            staging_dir/host/bin/ninja --version
          else
            echo "OpenWrt staging ninja: NOT FOUND"
          fi

          echo
          echo "--- BUILD OPENWRT NINJA ---"

          make tools/ninja/compile V=s -j1

          echo
          echo "--- AFTER BUILD ---"

          test -x staging_dir/host/bin/ninja

          echo "OpenWrt staging ninja:"
          staging_dir/host/bin/ninja --version

          echo
          echo "Ninja path:"
          readlink -f staging_dir/host/bin/ninja

      # ================================================================
      # 8. Build OpenWrt host Meson
      # ================================================================
      - name: Build OpenWrt host Meson
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST MESON ==="
          echo "========================================"

          make tools/meson/compile V=s -j1

          echo
          echo "--- AFTER BUILD ---"

          test -f staging_dir/host/bin/meson.py
          test -x staging_dir/host/bin/meson.py

          echo "OpenWrt staging Meson:"
          staging_dir/host/bin/meson.py --version

          echo
          echo "Meson path:"
          readlink -f staging_dir/host/bin/meson.py

          echo
          echo "Meson file:"
          ls -l staging_dir/host/bin/meson.py

      # ================================================================
      # 9. Verify APK host Meson/Ninja build
      #
      # IMPORTANT:
      # This verifies the APK host toolchain only.
      #
      # It does NOT invoke package/sing-box/compile.
      # Therefore unrelated target/kernel dependencies such as
      # gpio-button-hotplug cannot derail this audit.
      # ================================================================
      - name: Verify APK host Meson/Ninja build
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY APK HOST MESON/NINJA ==="
          echo "========================================"

          echo "--- NINJA ---"
          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "--- MESON ---"
          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- APK HOST TARGET DRY-RUN ---"

          make package/system/apk/host/compile V=s -n \
            2>&1 | tail -n 200

          echo
          echo "APK host target dry-run completed."

      # ================================================================
      # 10. Verify actual OpenWrt Make target mapping
      #
      # IMPORTANT:
      # Do NOT build package/sing-box/compile here.
      #
      # We only inspect the Make target database.
      # ================================================================
      - name: Verify Sing-box Make target mapping
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SING-BOX MAKE TARGET ==="
          echo "========================================"

          echo "--- EXPECTED TARGET ---"
          echo "package/sing-box/compile"

          echo
          echo "--- PACKAGE MAKEFILE ---"

          grep -n \
            'package/openwrt-passwall-packages/sing-box/Makefile' \
            package/openwrt-passwall-packages/sing-box/Makefile || true

          echo
          echo "--- OPENWRT TARGET RESOLUTION ---"

          make -pn 2>/dev/null \
            | grep -E \
              '(^package/sing-box/compile:|package/sing-box/compile)' \
            | head -n 20 || true

          echo
          echo "--- SOURCE PATH TARGET CHECK ---"

          if make -pn 2>/dev/null \
            | grep -q '^package/openwrt-passwall-packages/sing-box/compile:'
          then
            echo "ERROR: source directory incorrectly appears as a Make target."
            exit 1
          fi

          echo "OK: source directory is NOT a Make target."

          echo
          echo "--- REAL TARGET CHECK ---"

          if make -pn 2>/dev/null \
            | grep -q '^package/sing-box/compile:'
          then
            echo "OK: package/sing-box/compile exists."
          else
            echo "ERROR: package/sing-box/compile was not found."
            exit 1
          fi

      # ================================================================
      # 11. Verify package metadata references
      # ================================================================
      - name: Verify package metadata references
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY PACKAGE METADATA REFERENCES ==="
          echo "========================================"

          echo "--- Source-Makefile ---"

          grep -n \
            "Source-Makefile: package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo

          echo
          echo "--- Package dependencies ---"

          grep -n \
            "sing-box" \
            tmp/.packagedeps \
            | head -n 20 || true

          echo
          echo "--- Config ---"

          if grep -q '^CONFIG_PACKAGE_sing-box=' .config; then
            grep '^CONFIG_PACKAGE_sing-box=' .config
          else
            echo "CONFIG_PACKAGE_sing-box is not explicitly selected."
          fi

      # ================================================================
      # 12. Final audit
      # ================================================================
      - name: Final audit
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== AUDIT COMPLETE ==="
          echo "========================================"

          echo
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "Sing-box:"
          grep '^PKG_VERSION:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          echo
          echo "OpenWrt staging ninja:"
          staging_dir/host/bin/ninja --version

          echo
          echo "OpenWrt staging Meson:"
          staging_dir/host/bin/meson.py --version

          echo
          echo "RESULT: PASS"
