```yaml
name: TEST - Sing-box Target Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:
      # ================================================================
      # 1. Checkout ImmortalWrt
      # ================================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: d2dc130d7f8341741df04eaaf5fd4c74dcc447d7
          fetch-depth: 1

      # ================================================================
      # 2. Clone PassWall-Packages
      # ================================================================
      - name: Clone PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            https://github.com/xiaorouji/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          cd package/openwrt-passwall-packages

          git checkout a8302d598ca54cda22f7fe76fa553b3df034f8ae

          echo
          echo "PassWall-Packages:"
          git rev-parse HEAD

      # ================================================================
      # 3. Verify source tree
      # ================================================================
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE TREE ==="
          echo "========================================"

          echo "--- PWD ---"
          pwd

          echo "--- IMMORTALWRT ---"
          git rev-parse HEAD

          echo "--- REQUIRED DIRECTORIES ---"
          for path in \
            Makefile \
            package \
            scripts \
            target \
            toolchain \
            tools
          do
            test -e "$path"
            echo "OK: $path"
          done

          echo "--- SCRIPT DIRECTORY ---"
          ls -la scripts

      # ================================================================
      # 4. Audit Sing-box package
      # ================================================================
      - name: Audit Sing-box package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX PACKAGE AUDIT ==="
          echo "========================================"

          test -f \
            package/openwrt-passwall-packages/sing-box/Makefile

          echo "--- COMMITS ---"

          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo "--- SING-BOX DIRECTORY ---"
          ls -la \
            package/openwrt-passwall-packages/sing-box

          echo "--- MAKEFILE ---"
          sed -n '1,140p' \
            package/openwrt-passwall-packages/sing-box/Makefile

      # ================================================================
      # 5. Generate package metadata
      # ================================================================
      - name: Generate package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

      # ================================================================
      # 6. Inspect Sing-box metadata
      # ================================================================
      - name: Inspect Sing-box metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT SING-BOX METADATA ==="
          echo "========================================"

          echo "--- package info ---"

          grep -n -A30 -B5 \
            "Source-Makefile: package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo || true

          echo
          echo "--- package dependencies ---"

          grep -n \
            "openwrt-passwall-packages/sing-box" \
            tmp/.packagedeps || true

          echo
          echo "--- CONFIG ---"

          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config || true

      # ================================================================
      # 7. Prepare OpenWrt host tool: ninja
      #
      # IMPORTANT:
      # package/system/apk host-compile uses:
      #
      #   $(STAGING_DIR_HOST)/bin/ninja
      #
      # Ubuntu's /usr/local/bin/ninja is NOT sufficient.
      #
      # Build the OpenWrt-native ninja into:
      #
      #   staging_dir/host/bin/ninja
      # ================================================================
      - name: Prepare OpenWrt host ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== PREPARE OPENWRT HOST NINJA ==="
          echo "========================================"

          echo "--- SYSTEM NINJA ---"

          if command -v ninja >/dev/null 2>&1; then
            command -v ninja
            ninja --version
          else
            echo "System ninja: NOT FOUND"
          fi

          echo
          echo "--- BEFORE BUILD ---"

          if [ -x staging_dir/host/bin/ninja ]; then
            staging_dir/host/bin/ninja --version
          else
            echo "OpenWrt staging ninja: NOT FOUND"
          fi

          echo
          echo "--- BUILD OPENWRT NINJA ---"

          make tools/ninja/compile V=s -j1

          echo
          echo "--- AFTER BUILD ---"

          test -x staging_dir/host/bin/ninja

          echo "OpenWrt staging ninja:"
          staging_dir/host/bin/ninja --version

          echo
          echo "Ninja path:"
          readlink -f staging_dir/host/bin/ninja

      # ================================================================
      # 8. Build OpenWrt host Meson
      # ================================================================
      - name: Build OpenWrt host Meson
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST MESON ==="
          echo "========================================"

          make tools/meson/compile V=s -j1

          echo "--- AFTER BUILD ---"

          test -f staging_dir/host/bin/meson.py
          test -x staging_dir/host/bin/meson.py

          echo "OpenWrt staging Meson:"
          staging_dir/host/bin/meson.py --version

          echo "Meson path:"
          readlink -f staging_dir/host/bin/meson.py

          echo "Meson file:"
          ls -l staging_dir/host/bin/meson.py

      # ================================================================
      # 9. Verify APK host Meson/Ninja build
      #
      # This is the critical diagnostic step.
      #
      # Previous failure:
      #
      # ninja: fatal: chdir to
      # build_dir/hostpkg/apk-3.0.5/openwrt-build
      # No such file or directory
      #
      # Therefore APK host-compile must pass before testing sing-box.
      # ================================================================
      - name: Verify APK host Meson/Ninja build
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY APK HOST MESON/NINJA ==="
          echo "========================================"

          echo "--- HOST TOOLS ---"

          test -x staging_dir/host/bin/ninja
          test -x staging_dir/host/bin/meson.py

          echo "Ninja:"
          staging_dir/host/bin/ninja --version

          echo "Meson:"
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- BUILD APK HOST ---"

          make package/system/apk/host/compile V=s -j1

          echo
          echo "--- APK HOST BUILD PASSED ---"

      # ================================================================
      # 10. Verify real Make target
      # ================================================================
      - name: Verify Make target
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY MAKE TARGET ==="
          echo "========================================"

          echo "--- REAL TARGET: package/sing-box/compile ---"

          make package/sing-box/compile V=s -n \
            2>&1 | tail -n 200

      # ================================================================
      # 11. Verify source path is NOT a Make target
      # ================================================================
      - name: Verify source path is not a target
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE PATH TARGET ==="
          echo "========================================"

          set +e

          make \
            package/openwrt-passwall-packages/sing-box/compile \
            V=s -n \
            > /tmp/direct-target.log 2>&1

          rc=$?

          cat /tmp/direct-target.log

          echo
          echo "RETURN_CODE=$rc"

          if grep -q "No rule to make target" /tmp/direct-target.log; then
            echo "EXPECTED: source directory is NOT the Make target."
            exit 0
          fi

          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED: source path is a Make target."
            exit 1
          fi

          echo "Unexpected error."
          exit "$rc"

      # ================================================================
      # 12. Final audit
      # ================================================================
      - name: Final audit
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== AUDIT COMPLETE ==="
          echo "========================================"

          echo
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "Sing-box:"
          grep '^PKG_VERSION:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          echo
          echo "OpenWrt staging ninja:"
          staging_dir/host/bin/ninja --version

          echo
          echo "OpenWrt staging Meson:"
          staging_dir/host/bin/meson.py --version

          echo
          echo "RESULT: PASS"
```
