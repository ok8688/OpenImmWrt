name: TEST - Sing-box Target Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:

      # ================================================================
      # 1. Checkout ImmortalWrt
      # ================================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: d2dc130d7f8341741df04eaaf5fd4c74dcc447d7
          fetch-depth: 1

      # ================================================================
      # 2. Clone PassWall-Packages
      # ================================================================
      - name: Clone PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/xiaorouji/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          cd package/openwrt-passwall-packages

          git fetch --depth=1 origin \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          git checkout --detach \
            a8302d598ca54cda22f7fe76fa553b3df034f8ae

          echo
          echo "PassWall-Packages:"
          git rev-parse HEAD

      # ================================================================
      # 3. Verify source tree
      # ================================================================
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE TREE ==="
          echo "========================================"

          echo "--- PWD ---"
          pwd

          echo
          echo "--- IMMORTALWRT ---"
          git rev-parse HEAD

          echo
          echo "--- REQUIRED DIRECTORIES ---"

          for path in \
            Makefile \
            package \
            scripts \
            target \
            toolchain \
            tools
          do
            test -e "$path"
            echo "OK: $path"
          done

          echo
          echo "--- SCRIPT DIRECTORY ---"
          ls -la scripts

      # ================================================================
      # 4. Audit Sing-box package
      # ================================================================
      - name: Audit Sing-box package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX PACKAGE AUDIT ==="
          echo "========================================"

          SINGBOX_MAKEFILE="package/openwrt-passwall-packages/sing-box/Makefile"

          test -f "$SINGBOX_MAKEFILE"

          echo "--- COMMITS ---"

          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- SING-BOX DIRECTORY ---"

          ls -la \
            package/openwrt-passwall-packages/sing-box

          echo
          echo "--- SING-BOX MAKEFILE ---"

          sed -n '1,160p' "$SINGBOX_MAKEFILE"

      # ================================================================
      # 5. Generate package metadata
      # ================================================================
      - name: Generate package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

      # ================================================================
      # 6. Inspect Sing-box metadata
      # ================================================================
      - name: Inspect Sing-box metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT SING-BOX METADATA ==="
          echo "========================================"

          echo "--- PACKAGE INFO ---"

          grep -n -A30 -B5 \
            "Source-Makefile: package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo || true

          echo
          echo "--- PACKAGE DEPENDENCIES ---"

          grep -n \
            "sing-box" \
            tmp/.packagedeps \
            | head -n 30 || true

          echo
          echo "--- CONFIG ---"

          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config || true

      # ================================================================
      # 7. Build OpenWrt host Ninja
      #
      # This is the confirmed fix for the original APK host failure:
      #
      # staging_dir/host/bin/ninja
      #
      # must be generated by OpenWrt itself.
      # ================================================================
      - name: Build OpenWrt host Ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST NINJA ==="
          echo "========================================"

          echo "--- SYSTEM NINJA ---"

          if command -v ninja >/dev/null 2>&1; then
            command -v ninja
            ninja --version
          else
            echo "System ninja: NOT FOUND"
          fi

          echo
          echo "--- OPENWRT STAGING NINJA BEFORE BUILD ---"

          if [ -x staging_dir/host/bin/ninja ]; then
            staging_dir/host/bin/ninja --version
          else
            echo "OpenWrt staging ninja: NOT FOUND"
          fi

          echo
          echo "--- BUILD OPENWRT NINJA ---"

          make tools/ninja/compile V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING NINJA ---"

          test -x staging_dir/host/bin/ninja

          staging_dir/host/bin/ninja --version

          echo
          echo "Ninja path:"
          readlink -f staging_dir/host/bin/ninja

      # ================================================================
      # 8. Build OpenWrt host Meson
      # ================================================================
      - name: Build OpenWrt host Meson
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST MESON ==="
          echo "========================================"

          make tools/meson/compile V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING MESON ---"

          test -f staging_dir/host/bin/meson.py
          test -x staging_dir/host/bin/meson.py

          staging_dir/host/bin/meson.py --version

          echo
          echo "Meson path:"
          readlink -f staging_dir/host/bin/meson.py

          echo
          echo "Meson file:"
          ls -l staging_dir/host/bin/meson.py

      # ================================================================
      # 9. Verify APK host Meson/Ninja
      #
      # This is an intermediate dependency-chain test.
      #
      # Confirmed result from the previous run:
      #
      # package/system/apk/host-compile: PASS
      #
      # ================================================================
      - name: Verify APK host Meson Ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY APK HOST MESON/NINJA ==="
          echo "========================================"

          echo "--- NINJA ---"

          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "--- MESON ---"

          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- APK HOST TARGET ---"

          make package/system/apk/host/compile V=s -j1

          echo
          echo "APK host compile: PASS"

      # ================================================================
      # 10. REAL SING-BOX COMPILE TEST
      #
      # IMPORTANT:
      #
      # This is now the actual test.
      #
      # At this point we have already verified:
      #
      #   1. ImmortalWrt source tree
      #   2. PassWall-Packages commit
      #   3. Sing-box Makefile
      #   4. Sing-box package metadata
      #   5. OpenWrt staging Ninja
      #   6. OpenWrt staging Meson
      #   7. APK host compile
      #
      # We deliberately DO NOT run "make -pn".
      #
      # The previous "make -pn" probe returned exit code 2 and did not
      # provide a reliable target existence test in this OpenWrt tree.
      #
      # Now execute the actual package target.
      # ================================================================
      - name: Compile Sing-box
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== REAL SING-BOX COMPILE TEST ==="
          echo "========================================"

          echo
          echo "--- VERIFY STAGING NINJA ---"

          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "--- VERIFY STAGING MESON ---"

          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- SING-BOX MAKEFILE ---"

          SINGBOX_MAKEFILE="package/openwrt-passwall-packages/sing-box/Makefile"

          test -f "$SINGBOX_MAKEFILE"

          grep '^PKG_NAME:=' \
            "$SINGBOX_MAKEFILE"

          grep '^PKG_VERSION:=' \
            "$SINGBOX_MAKEFILE"

          grep '^PKG_RELEASE:=' \
            "$SINGBOX_MAKEFILE"

          echo
          echo "--- REAL TARGET ---"
          echo "package/sing-box/compile"

          echo
          echo "========================================"
          echo "=== START SING-BOX BUILD ==="
          echo "========================================"

          make package/sing-box/compile V=s -j1

          echo
          echo "========================================"
          echo "=== SING-BOX COMPILE: PASS ==="
          echo "========================================"

      # ================================================================
      # 11. Final audit
      # ================================================================
      - name: Final audit
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== FINAL AUDIT ==="
          echo "========================================"

          echo
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "Sing-box:"
          grep '^PKG_NAME:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_VERSION:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_RELEASE:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          echo
          echo "OpenWrt staging Ninja:"
          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "OpenWrt staging Meson:"
          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "APK host:"
          test -f staging_dir/host/stamp/.apk_installed
          echo "PASS"

          echo
          echo "========================================"
          echo "RESULT: PASS"
          echo "========================================"
