name: TEST - Sing-box Target Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:

      # ================================================================
      # 1. Checkout ImmortalWrt
      #
      # IMPORTANT:
      # ImmortalWrt always uses the latest master commit.
      # This test is for the current SNAPSHOT build environment.
      # ================================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          fetch-depth: 1

      # ================================================================
      # 2. Clone latest official PassWall-Packages
      #
      # IMPORTANT:
      # Always pull the CURRENT latest main commit.
      #
      # Official repository:
      # Openwrt-Passwall/openwrt-passwall-packages
      #
      # DO NOT pin an old PassWall-Packages commit here.
      # ================================================================
      - name: Clone latest official PassWall-Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CLONE LATEST PASSWALL-PACKAGES ==="
          echo "========================================"

          git clone \
            --depth=1 \
            --branch main \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages

          echo
          echo "--- PASSWALL-PACKAGES REMOTE ---"

          git -C package/openwrt-passwall-packages remote -v

          echo
          echo "--- PASSWALL-PACKAGES HEAD ---"

          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- PASSWALL-PACKAGES LOG ---"

          git -C package/openwrt-passwall-packages \
            log -1 --oneline --decorate

      # ================================================================
      # 3. Verify source tree
      # ================================================================
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY SOURCE TREE ==="
          echo "========================================"

          echo "--- PWD ---"
          pwd

          echo
          echo "--- IMMORTALWRT ---"
          git rev-parse HEAD

          echo
          echo "--- REQUIRED DIRECTORIES ---"

          for path in \
            Makefile \
            package \
            scripts \
            target \
            toolchain \
            tools
          do
            test -e "$path"
            echo "OK: $path"
          done

          echo
          echo "--- SCRIPT DIRECTORY ---"
          ls -la scripts

      # ================================================================
      # 4. Audit Sing-box package
      # ================================================================
      - name: Audit Sing-box package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== SING-BOX PACKAGE AUDIT ==="
          echo "========================================"

          SINGBOX_MAKEFILE="package/openwrt-passwall-packages/sing-box/Makefile"

          test -f "$SINGBOX_MAKEFILE"

          echo "--- COMMITS ---"

          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "Latest PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "--- SING-BOX DIRECTORY ---"

          ls -la \
            package/openwrt-passwall-packages/sing-box

          echo
          echo "--- SING-BOX MAKEFILE ---"

          sed -n '1,180p' "$SINGBOX_MAKEFILE"

      # ================================================================
      # 5. Generate package metadata
      # ================================================================
      - name: Generate package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== GENERATE PACKAGE METADATA ==="
          echo "========================================"

          make defconfig

      # ================================================================
      # 5A. Diagnose Host OpenSSL
      #
      # ADDED TEST STEP ONLY.
      #
      # IMPORTANT:
      # Do NOT modify OpenWrt source files.
      # Do NOT modify package Makefiles.
      # Only locate the expected Host OpenSSL target and
      # inspect the system OpenSSL available on the GitHub runner.
      # ================================================================
      - name: Diagnose Host OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== DIAGNOSE HOST OPENSSL ==="
          echo "========================================"

          echo "--- EXPECTED OPENSSL ---"

          echo "Expected:"
          echo "staging_dir/host/bin/openssl"

          if [ -e staging_dir/host/bin/openssl ]; then
            echo "FOUND:"
            ls -l staging_dir/host/bin/openssl
            readlink -f staging_dir/host/bin/openssl || true
          else
            echo "NOT FOUND:"
            echo "staging_dir/host/bin/openssl"
          fi

          echo
          echo "--- SYSTEM OPENSSL ---"

          if command -v openssl >/dev/null 2>&1; then
            echo "System OpenSSL:"
            command -v openssl
            readlink -f "$(command -v openssl)" || true
            openssl version
          else
            echo "System OpenSSL: NOT FOUND"
          fi

          echo
          echo "--- HOST OPENSSL REFERENCES ---"

          grep -RniE \
            'STAGING_DIR_HOST.*openssl|openssl.*STAGING_DIR_HOST|BUILD_KEY_APK_SEC|BUILD_KEY_APK_PUB' \
            package \
            include \
            tools \
            --exclude-dir=.git \
            2>/dev/null \
            | head -n 300 || true

          echo
          echo "--- OPENSSL PACKAGE MAKEFILE ---"

          if [ -f package/libs/openssl/Makefile ]; then
            sed -n '1,430p' package/libs/openssl/Makefile
          else
            echo "package/libs/openssl/Makefile: NOT FOUND"
          fi

          echo
          echo "--- OPENSSL HOST TARGET DIRECTORIES ---"

          find tools package \
            -maxdepth 5 \
            -type d \
            \( \
              -iname '*openssl*' \
              -o -iname '*libssl*' \
              -o -iname '*libcrypto*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 300

          echo
          echo "--- CURRENT STAGING HOST BIN ---"

          ls -la staging_dir/host/bin 2>/dev/null \
            | head -n 200 || true

      # ================================================================
      # 5B. Repair Host OpenSSL for TEST
      #
      # ADDED TEST STEP ONLY.
      #
      # IMPORTANT:
      # This is intentionally a TEST-RUNNER repair.
      #
      # We do NOT modify:
      #   - package/Makefile
      #   - package/libs/openssl
      #   - package/system/apk
      #   - sing-box
      #   - PassWall-Packages
      #
      # We only provide the OpenSSL executable at the exact path
      # required by the current package infrastructure.
      # ================================================================
      - name: Repair Host OpenSSL for test
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== REPAIR HOST OPENSSL FOR TEST ==="
          echo "========================================"

          echo "--- SYSTEM OPENSSL ---"

          command -v openssl
          readlink -f "$(command -v openssl)" || true
          openssl version

          echo
          echo "--- CREATE HOST BIN DIRECTORY ---"

          mkdir -p staging_dir/host/bin

          echo
          echo "--- EXISTING STAGING OPENSSL ---"

          if [ -e staging_dir/host/bin/openssl ]; then
            ls -l staging_dir/host/bin/openssl
          else
            echo "No existing staging OpenSSL."
          fi

          echo
          echo "--- INSTALL TEST HOST OPENSSL PATH ---"

          if [ -e staging_dir/host/bin/openssl ]; then
            if [ -L staging_dir/host/bin/openssl ]; then
              echo "Existing staging OpenSSL is a symlink."
              readlink -f staging_dir/host/bin/openssl || true
            else
              echo "Existing staging OpenSSL is a regular file."
            fi
          else
            ln -s "$(command -v openssl)" \
              staging_dir/host/bin/openssl
          fi

          echo
          echo "--- VERIFY TEST HOST OPENSSL ---"

          test -x staging_dir/host/bin/openssl

          ls -l staging_dir/host/bin/openssl

          echo
          echo "Resolved path:"
          readlink -f staging_dir/host/bin/openssl

          echo
          echo "Version:"
          staging_dir/host/bin/openssl version

          echo
          echo "========================================"
          echo "=== HOST OPENSSL TEST REPAIR: PASS ==="
          echo "========================================"

      # ================================================================
      # 5C. Verify Host OpenSSL repair
      #
      # ADDED TEST STEP ONLY.
      #
      # This reproduces the exact operations required by
      # package/Makefile before Sing-box compilation.
      # ================================================================
      - name: Verify Host OpenSSL repair
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY HOST OPENSSL REPAIR ==="
          echo "========================================"

          OPENSSL="staging_dir/host/bin/openssl"

          test -x "$OPENSSL"

          echo "--- OPENSSL PATH ---"
          readlink -f "$OPENSSL"

          echo
          echo "--- OPENSSL VERSION ---"
          "$OPENSSL" version

          echo
          echo "--- TEST EC PRIVATE KEY GENERATION ---"

          rm -f private-key.pem public-key.pem

          "$OPENSSL" \
            ecparam \
            -name prime256v1 \
            -genkey \
            -noout \
            -out private-key.pem

          test -s private-key.pem

          echo
          echo "--- TEST EC PUBLIC KEY GENERATION ---"

          "$OPENSSL" \
            ec \
            -in private-key.pem \
            -pubout \
            > public-key.pem

          test -s public-key.pem

          echo
          echo "--- KEY FILES ---"

          ls -lh \
            private-key.pem \
            public-key.pem

          echo
          echo "========================================"
          echo "=== HOST OPENSSL VERIFICATION: PASS ==="
          echo "========================================"

      # ================================================================
      # 5D. Diagnose libgcc_s.so
      #
      # ADDED TEST STEP ONLY.
      #
      # IMPORTANT:
      # This step ONLY locates and diagnoses libgcc_s.so.
      #
      # DO NOT:
      #   - modify OpenWrt source files
      #   - modify package Makefiles
      #   - modify PassWall-Packages
      #   - modify sing-box
      #   - create symlinks
      #   - copy libgcc_s.so
      #   - repair the toolchain
      #
      # The purpose is to identify why package/libs/toolchain
      # cannot find the expected libgcc_s.so.* file.
      # ================================================================
      - name: Diagnose libgcc_s.so
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== DIAGNOSE LIBGCC_S.SO ==="
          echo "========================================"

          echo "--- TARGET TOOLCHAIN VARIABLES ---"

          echo "TARGET:"
          echo "${TARGET:-NOT SET}"

          echo
          echo "ARCH:"
          echo "${ARCH:-NOT SET}"

          echo
          echo "STAGING_DIR:"
          echo "${STAGING_DIR:-NOT SET}"

          echo
          echo "STAGING_DIR_TOOLCHAIN:"
          echo "${STAGING_DIR_TOOLCHAIN:-NOT SET}"

          echo
          echo "--- EXPECTED TOOLCHAIN DIRECTORY ---"

          EXPECTED_TOOLCHAIN="staging_dir/toolchain-aarch64_cortex-a53_gcc-14.4.0_musl"

          echo "Expected:"
          echo "$EXPECTED_TOOLCHAIN"

          if [ -d "$EXPECTED_TOOLCHAIN" ]; then
            echo "FOUND:"
            ls -ld "$EXPECTED_TOOLCHAIN"
          else
            echo "NOT FOUND:"
            echo "$EXPECTED_TOOLCHAIN"
          fi

          echo
          echo "--- EXPECTED LIB DIRECTORY ---"

          EXPECTED_LIB="$EXPECTED_TOOLCHAIN/lib"

          echo "Expected:"
          echo "$EXPECTED_LIB"

          if [ -d "$EXPECTED_LIB" ]; then
            echo "FOUND:"
            ls -lad "$EXPECTED_LIB"
          else
            echo "NOT FOUND:"
            echo "$EXPECTED_LIB"
          fi

          echo
          echo "--- EXPECTED LIBGCC_S.SO ---"

          if compgen -G "$EXPECTED_LIB/libgcc_s.so.*" > /dev/null; then
            echo "FOUND:"
            ls -lah "$EXPECTED_LIB"/libgcc_s.so.*
          else
            echo "NOT FOUND:"
            echo "$EXPECTED_LIB/libgcc_s.so.*"
          fi

          echo
          echo "--- ALL LIBGCC_S.SO FILES UNDER STAGING_DIR ---"

          find staging_dir \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -n 300 || true

          echo
          echo "--- ALL LIBGCC_S.SO FILES UNDER WORKSPACE ---"

          find . \
            -type f \
            \( \
              -name 'libgcc_s.so' \
              -o -name 'libgcc_s.so.*' \
            \) \
            -not -path './.git/*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500 || true

          echo
          echo "--- GCC TOOLCHAIN DIRECTORIES ---"

          find staging_dir \
            -maxdepth 3 \
            -type d \
            -iname '*gcc*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 300 || true

          echo
          echo "--- TOOLCHAIN LIB CONTENTS ---"

          if [ -d "$EXPECTED_LIB" ]; then
            ls -lah "$EXPECTED_LIB" | head -n 300
          else
            echo "Cannot inspect missing directory:"
            echo "$EXPECTED_LIB"
          fi

          echo
          echo "--- TOOLCHAIN GCC VERSION ---"

          if command -v aarch64-openwrt-linux-musl-gcc >/dev/null 2>&1; then
            command -v aarch64-openwrt-linux-musl-gcc
            aarch64-openwrt-linux-musl-gcc --version
          else
            echo "aarch64-openwrt-linux-musl-gcc: NOT FOUND"
          fi

          echo
          echo "--- STAGING TOOLCHAIN GCC ---"

          find staging_dir \
            -type f \
            -name 'aarch64-openwrt-linux-musl-gcc' \
            -print \
            2>/dev/null \
            | head -n 50 || true

          echo
          echo "--- GCC SEARCH PATH ---"

          if command -v aarch64-openwrt-linux-musl-gcc >/dev/null 2>&1; then
            GCC_PATH="$(command -v aarch64-openwrt-linux-musl-gcc)"

            echo "GCC:"
            echo "$GCC_PATH"

            echo
            echo "GCC REAL PATH:"
            readlink -f "$GCC_PATH" || true

            echo
            echo "GCC PRINT SEARCH DIRS:"

            aarch64-openwrt-linux-musl-gcc \
              -print-search-dirs \
              2>/dev/null || true

            echo
            echo "GCC PRINT LIBGCC FILE:"

            aarch64-openwrt-linux-musl-gcc \
              -print-file-name=libgcc_s.so.1 \
              2>/dev/null || true

            echo
            echo "GCC PRINT LIBGCC DIRECTORY:"

            aarch64-openwrt-linux-musl-gcc \
              -print-libgcc-file-name \
              2>/dev/null || true
          else
            echo "GCC executable unavailable."
          fi

          echo
          echo "--- TOOLCHAIN PACKAGE MAKEFILE ---"

          if [ -f package/libs/toolchain/Makefile ]; then
            echo "Relevant libgcc references:"
            grep -n -A15 -B15 \
              'libgcc_s\.so' \
              package/libs/toolchain/Makefile \
              || true

            echo
            echo "Relevant TOOLCHAIN references:"
            grep -n -A10 -B10 \
              'STAGING_DIR_TOOLCHAIN' \
              package/libs/toolchain/Makefile \
              | head -n 300 || true
          else
            echo "package/libs/toolchain/Makefile: NOT FOUND"
          fi

          echo
          echo "--- TOOLCHAIN CONFIGURATION ---"

          grep -nE \
            'CONFIG_(GCC|USE_MUSL|TARGET_ARCH|TARGET_OPTIMIZATION|TOOLCHAIN)' \
            .config \
            2>/dev/null \
            | head -n 300 || true

          echo
          echo "--- BUILD DIRECTORY TOOLCHAIN CONTENTS ---"

          find build_dir \
            -maxdepth 5 \
            -type d \
            -iname '*toolchain*' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 300 || true

          echo
          echo "--- STAGING DIR OVERVIEW ---"

          find staging_dir \
            -maxdepth 2 \
            -type d \
            -print \
            2>/dev/null \
            | sort \
            | head -n 300 || true

          echo
          echo "========================================"
          echo "=== LIBGCC_S.SO DIAGNOSIS COMPLETE ==="
          echo "========================================"

      # ================================================================
      # 6. Inspect Sing-box metadata
      # ================================================================
      - name: Inspect Sing-box metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT SING-BOX METADATA ==="
          echo "========================================"

          echo "--- PACKAGE INFO ---"

          grep -n -A30 -B5 \
            "Source-Makefile: package/openwrt-passwall-packages/sing-box/Makefile" \
            tmp/.packageinfo || true

          echo
          echo "--- PACKAGE DEPENDENCIES ---"

          grep -n \
            "sing-box" \
            tmp/.packagedeps \
            | head -n 50 || true

          echo
          echo "--- CONFIG ---"

          grep -n \
            '^CONFIG_PACKAGE_sing-box=' \
            .config || true

      # ================================================================
      # 7. Build OpenWrt host Ninja
      # ================================================================
      - name: Build OpenWrt host Ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST NINJA ==="
          echo "========================================"

          echo "--- SYSTEM NINJA ---"

          if command -v ninja >/dev/null 2>&1; then
            command -v ninja
            ninja --version
          else
            echo "System ninja: NOT FOUND"
          fi

          echo
          echo "--- OPENWRT STAGING NINJA BEFORE BUILD ---"

          if [ -x staging_dir/host/bin/ninja ]; then
            staging_dir/host/bin/ninja --version
          else
            echo "OpenWrt staging ninja: NOT FOUND"
          fi

          echo
          echo "--- BUILD OPENWRT NINJA ---"

          make tools/ninja/compile V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING NINJA ---"

          test -x staging_dir/host/bin/ninja

          staging_dir/host/bin/ninja --version

          echo
          echo "Ninja path:"
          readlink -f staging_dir/host/bin/ninja

      # ================================================================
      # 8. Build OpenWrt host Meson
      # ================================================================
      - name: Build OpenWrt host Meson
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== BUILD OPENWRT HOST MESON ==="
          echo "========================================"

          make tools/meson/compile V=s -j1

          echo
          echo "--- VERIFY OPENWRT STAGING MESON ---"

          test -f staging_dir/host/bin/meson.py
          test -x staging_dir/host/bin/meson.py

          staging_dir/host/bin/meson.py --version

          echo
          echo "Meson path:"
          readlink -f staging_dir/host/bin/meson.py

      # ================================================================
      # 9. Verify APK host Meson Ninja
      # ================================================================
      - name: Verify APK host Meson Ninja
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== VERIFY APK HOST MESON/NINJA ==="
          echo "========================================"

          echo "--- NINJA ---"

          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "--- MESON ---"

          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- APK HOST TARGET ---"

          make package/system/apk/host/compile V=s -j1

          echo
          echo "APK host compile: PASS"

      # ================================================================
      # 10. Locate OpenSSL host dependency
      #
      # IMPORTANT:
      # We do NOT guess a target.
      # We only inspect the actual source tree.
      # ================================================================
      - name: Locate OpenSSL host dependency
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== LOCATE OPENSSL HOST DEPENDENCY ==="
          echo "========================================"

          echo "--- STAGING OPENSSL ---"

          if [ -x staging_dir/host/bin/openssl ]; then
            echo "FOUND:"
            readlink -f staging_dir/host/bin/openssl
            staging_dir/host/bin/openssl version
          else
            echo "staging_dir/host/bin/openssl: NOT FOUND"
          fi

          echo
          echo "--- PACKAGE MAKEFILE REFERENCES ---"

          grep -RniE \
            'STAGING_DIR_HOST.*openssl|BUILD_KEY_APK_SEC|BUILD_KEY_APK_PUB' \
            package \
            --exclude-dir=.git \
            | head -n 200 || true

          echo
          echo "--- INCLUDE REFERENCES ---"

          grep -RniE \
            'STAGING_DIR_HOST.*openssl|OPENSSL_DIR|libcrypto|libssl' \
            include \
            --exclude-dir=.git \
            | head -n 300 || true

          echo
          echo "--- TOOLS REFERENCES ---"

          grep -RniE \
            'STAGING_DIR_HOST.*openssl|OPENSSL_DIR|libcrypto|libssl' \
            tools \
            --exclude-dir=.git \
            | head -n 300 || true

          echo
          echo "--- OPENSSL DIRECTORIES ---"

          find tools package \
            -maxdepth 5 \
            -type d \
            \( \
              -iname '*openssl*' \
              -o -iname '*libssl*' \
              -o -iname '*libcrypto*' \
            \) \
            -print \
            | sort \
            | head -n 300

          echo
          echo "--- OPENSSL MAKEFILES ---"

          find tools package \
            -type f \
            -name Makefile \
            -print \
            | while read -r mf; do
                if grep -qiE \
                  'openssl|libcrypto|libssl' \
                  "$mf" 2>/dev/null
                then
                  echo "$mf"
                fi
              done \
            | sort \
            | head -n 300

      # ================================================================
      # 11. Inspect APK signing key rule
      # ================================================================
      - name: Inspect APK signing key rule
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT APK SIGNING KEY RULE ==="
          echo "========================================"

          echo "--- package/Makefile ---"

          nl -ba package/Makefile \
            | sed -n '45,80p'

          echo
          echo "--- BUILD KEY REFERENCES ---"

          grep -Rni \
            'BUILD_KEY_APK_' \
            package include \
            --exclude-dir=.git \
            | head -n 100 || true

      # ================================================================
      # 12. Inspect host dependency infrastructure
      # ================================================================
      - name: Inspect host dependency infrastructure
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== INSPECT HOST DEPENDENCY SYSTEM ==="
          echo "========================================"

          echo "--- HOST BUILD REFERENCES ---"

          grep -RniE \
            'HOST_BUILD|Build/Host|Host/Compile|STAGING_DIR_HOST' \
            include \
            --exclude-dir=.git \
            | head -n 400 || true

          echo
          echo "--- HOST TOOL INSTALL REFERENCES ---"

          grep -RniE \
            'INSTALL_BIN.*STAGING_DIR_HOST|STAGING_DIR_HOST.*/bin/' \
            include tools package \
            --exclude-dir=.git \
            | head -n 500 || true

      # ================================================================
      # 13. State report before real build
      # ================================================================
      - name: State report
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== CURRENT BUILD STATE ==="
          echo "========================================"

          echo
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "Sing-box:"
          grep '^PKG_NAME:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_VERSION:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_RELEASE:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          echo
          echo "Ninja:"
          staging_dir/host/bin/ninja --version

          echo
          echo "Meson:"
          staging_dir/host/bin/meson.py --version

          echo
          echo "OpenSSL:"

          if [ -x staging_dir/host/bin/openssl ]; then
            staging_dir/host/bin/openssl version
          else
            echo "NOT FOUND"
          fi

      # ================================================================
      # 14. REAL SING-BOX COMPILE TEST
      # ================================================================
      - name: Real Sing-box compile test
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== REAL SING-BOX COMPILE TEST ==="
          echo "========================================"

          echo
          echo "--- VERIFY STAGING NINJA ---"

          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

          echo
          echo "--- VERIFY STAGING MESON ---"

          test -x staging_dir/host/bin/meson.py
          staging_dir/host/bin/meson.py --version

          echo
          echo "--- VERIFY STAGING OPENSSL ---"

          test -x staging_dir/host/bin/openssl
          staging_dir/host/bin/openssl version

          echo
          echo "--- VERIFY SING-BOX MAKEFILE ---"

          SINGBOX_MAKEFILE="package/openwrt-passwall-packages/sing-box/Makefile"

          test -f "$SINGBOX_MAKEFILE"

          grep '^PKG_NAME:=' \
            "$SINGBOX_MAKEFILE"

          grep '^PKG_VERSION:=' \
            "$SINGBOX_MAKEFILE"

          grep '^PKG_RELEASE:=' \
            "$SINGBOX_MAKEFILE"

          echo
          echo "--- REAL TARGET ---"
          echo "package/sing-box/compile"

          echo
          echo "========================================"
          echo "=== START SING-BOX BUILD ==="
          echo "========================================"

          make package/sing-box/compile V=s -j1

          echo
          echo "========================================"
          echo "=== SING-BOX COMPILE: PASS ==="
          echo "========================================"

      # ================================================================
      # 15. Final audit
      # ================================================================
      - name: Final audit
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== FINAL AUDIT ==="
          echo "========================================"

          echo
          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo
          echo "PassWall-Packages:"
          git -C package/openwrt-passwall-packages rev-parse HEAD

          echo
          echo "Sing-box:"
          grep '^PKG_NAME:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_VERSION:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          grep '^PKG_RELEASE:=' \
            package/openwrt-passwall-packages/sing-box/Makefile

          echo
          echo "OpenWrt staging Ninja:"
          staging_dir/host/bin/ninja --version

          echo
          echo "OpenWrt staging Meson:"
          staging_dir/host/bin/meson.py --version

          echo
          echo "OpenWrt staging OpenSSL:"

          if [ -x staging_dir/host/bin/openssl ]; then
            staging_dir/host/bin/openssl version
          else
            echo "NOT FOUND"
          fi

          echo
          echo "========================================"
          echo "RESULT: PASS"
          echo "========================================"
