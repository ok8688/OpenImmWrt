# =====================================================================
# 🛡️ [GOLD-FINAL-v1.2] - ImmWrt 25.12.0 (APK-Only 穩定典藏版)
# =====================================================================
# 狀態：工程化封存版本，具備 100% 可重現與高度除錯追蹤能力。
# 修正：
# 1. 驗證階段引入目錄存在性檢查。
# 2. Debug 重編階段強化清理邏輯 (包含 staging_dir)。
# 3. 嚴格 Pipefail 與目錄防禦機制，確保 CI 鏈條在極端情況下亦不崩潰。
# =====================================================================

name: Build ImmWrt 25.12.0 Stable

on:
  workflow_dispatch:
  schedule:
    - cron: '26 14 * * 0,2,4,6' # HKT 22:26

concurrency:
  group: immwrt-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_COMPRESS: 1
  CCACHE_MAXSIZE: 3G
  CCACHE_SLOPPINESS: time_macros,file_macro

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Metadata
        id: meta
        run: echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Inject SRE Core Utilities
        run: |
          cat << 'EOF' > /tmp/sre_utils.sh
          #!/bin/bash
          retry() {
            : > /tmp/retry_history.log
            : > /tmp/retry_debug.log
            local max=5
            local delay=2
            local n=1
            while true; do
              "$@" >> /tmp/retry_debug.log 2>&1 && break || {
                if [[ $n -lt $max ]]; then
                  echo "⚠️ [FAIL] Attempt $n: $@" >> /tmp/retry_history.log
                  ((n++))
                  delay=$((delay * 2 + RANDOM % 3))
                  sleep $delay
                else
                  echo "❌ FAILED after $max retries: $@"
                  cat /tmp/retry_history.log
                  cat /tmp/retry_debug.log
                  return 1
                fi
              }
            done
          }
          EOF
          chmod +x /tmp/sre_utils.sh
          
      - name: Init SRE Environment & ABI Fingerprint
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/lib/node_modules /opt/hostedtoolcache /usr/local/share/powershell /usr/share/rust /opt/microsoft /usr/local/share/edge_driver /usr/local/.ghcup /usr/share/miniconda /opt/az /usr/local/share/boost /usr/local/share/chromium /usr/local/lib/heroku
          sudo docker system prune -af || true
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget jq golang-go python3-setuptools ccache
          if apt-cache show python3-distutils >/dev/null 2>&1; then sudo apt-get install -y --no-install-recommends python3-distutils; fi
          sudo swapoff -a && sudo fallocate -l 4G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          
          echo "=== 🧬 ABI Fingerprint ===" > toolchain.info
          echo "Build Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> toolchain.info
          uname -r >> toolchain.info
          gcc --version | sed -n '1p' >> toolchain.info
          clang --version | sed -n '1p' >> toolchain.info
          ld --version | sed -n '1p' >> toolchain.info
          ldd --version | sed -n '1p' >> toolchain.info
          go version >> toolchain.info || true
          git --version >> toolchain.info
          make --version | sed -n '1p' >> toolchain.info
          python3 --version >> toolchain.info
          dpkg -s libc6 | grep Version >> toolchain.info
          
      - name: Clone & Official PassWall Main Source
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          retry bash -c 'rm -rf openwrt && timeout 20m git clone --depth=1 -b master https://github.com/immortalwrt/immortalwrt.git openwrt'
          cd openwrt
          retry timeout 20m ./scripts/feeds update -a
          
          rm -rf feeds/luci/applications/luci-app-passwall feeds/packages/net/xray-core feeds/packages/net/sing-box
          retry git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages
          retry git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall
          
          retry bash -c 'set -o pipefail; timeout 20m ./scripts/feeds install -a -f 2>&1 | tee ../feeds-install.log'
          
          echo "Build Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > feeds.snapshot.txt
          echo "Branch: $(git branch --show-current)" >> feeds.snapshot.txt
          echo "ImmortalWrt HEAD: $(git rev-parse HEAD)" >> feeds.snapshot.txt
          echo "ImmortalWrt Describe: $(git describe --always)" >> feeds.snapshot.txt
          find feeds package -type d -name ".git" -print0 | while IFS= read -r -d '' gitdir; do
            repo_path=$(dirname "$gitdir")
            repo_root=$(git -C "$repo_path" rev-parse --show-toplevel 2>/dev/null || true)
            remote_url=$(git -C "$repo_root" remote get-url origin 2>/dev/null || echo "unknown")
            [ -n "$repo_root" ] && echo "commit: $(git -C "$repo_root" rev-parse HEAD) | remote: $remote_url | path: $repo_root"
          done | sort -u >> feeds.snapshot.txt
          
      - name: Generate Cache Variables
        id: var
        run: echo "dl_key=dl-25.12-${{ hashFiles('openwrt/feeds.snapshot.txt') }}" >> $GITHUB_OUTPUT

      - name: Restore Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
            ~/.ccache
          key: ${{ steps.var.outputs.dl_key }}
          restore-keys: dl-25.12-
          
      - name: Generate Core Config
        run: |
          cd openwrt
          mkdir -p logs files/etc/uci-defaults
          echo '#!/bin/sh' > files/etc/uci-defaults/99-force-language
          echo "uci -q set luci.main.lang='zh_cn'; uci -q commit luci; exit 0" >> files/etc/uci-defaults/99-force-language
          chmod +x files/etc/uci-defaults/99-force-language
          cat << 'EOF' > .config
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=1536
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_qemu-ga=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-advanced-reboot=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_block-mount=n
          CONFIG_PACKAGE_luci-app-fstab=n
          CONFIG_CCACHE=y
          EOF
          make defconfig 2>&1 | tee logs/defconfig.log
          ./scripts/diffconfig.sh > logs/diffconfig.txt
          gzip -9f -c .config > logs/full.config.gz
          
      - name: Build Firmware
        run: |
          set -euo pipefail
          cd openwrt
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export CCACHE_BASEDIR=$PWD
          export CC="ccache gcc"
          export CXX="ccache g++"
          mkdir -p logs
          cp feeds.snapshot.txt logs/snapshot.sbom
          cp ../toolchain.info logs/toolchain.info
          
          ( while true; do echo "[MONITOR] $(date '+%H:%M:%S') | Load: $(uptime | awk -F'load average:' '{print $2}') | RAM: $(free -m | awk '/Mem:/ {print $3"/"$2"MB"}') | DISK: $(df -h . | awk 'NR==2 {print $3 "/" $2}')"; sleep 120; done ) &
          MONITOR_PID=$!
          trap 'kill "$MONITOR_PID" 2>/dev/null || true; wait "$MONITOR_PID" 2>/dev/null || true' EXIT
          
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression_level=9 || true
          ccache -z
          
          retry bash -c 'set -o pipefail; make download -j$(nproc) V=s 2>&1 | tee logs/download.log'
          
          if ! make -j$(nproc) BUILD_LOG=1 2>&1 | tee logs/build.log; then
            echo "⚠️ [FAIL] Fast build failed, switching to single-thread debug build..."
            rm -rf tmp build_dir staging_dir
            make -j1 V=s BUILD_LOG=1 2>&1 | tee logs/build-debug.log || exit 1
          fi
          
          ccache -s > logs/ccache.info
          ccache -p >> logs/ccache.info
          
      - name: Cleanup & Save Cache
        if: always() && !cancelled()
        run: |
          [ -d openwrt/dl ] && find openwrt/dl -type f -size -4k -delete
          sync
        
      - name: Save Cache
        uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            openwrt/dl
            ~/.ccache
          key: ${{ steps.var.outputs.dl_key }}

      - name: Validate & Final Packaging
        run: |
          ROOT="$(pwd)"
          TARGET_DIR="openwrt/bin/targets/x86/64"
          [ -d "$TARGET_DIR" ] || exit 1
          cd "$TARGET_DIR"
          
          shopt -s nullglob; files=(*combined*.img.gz); [ ${#files[@]} -eq 0 ] && exit 1; shopt -u nullglob
          for f in *combined*.img.gz; do gunzip -t "$f" || exit 1; done
          
          [ ! -f "sha256sums" ] && exit 1
          sha256sum --ignore-missing -c sha256sums
          
          find . -name "*combined*.img.gz" -type f -print0 | sort -z | xargs -0 sha256sum > manifest.txt
          mv manifest.txt "$ROOT/openwrt/logs/"
          cd "$ROOT/openwrt/"
          
          find bin/packages -type f -name "APKINDEX*" > logs/apk-indexes.log || true
          find bin/packages -type f -name "*luci-i18n*.apk" > logs/luci-i18n-packages.log || true
          
          [ -d logs ] && find logs -type f -size 0 -delete
          [ -f logs/build.log ] && gzip -9f logs/build.log
          [ -f logs/build-debug.log ] && gzip -9f logs/build-debug.log
          
          pkg_logs=$(find logs -maxdepth 1 -type d -name "package*" -print -quit)
          [ -n "$pkg_logs" ] && tar -czf logs/package-logs.tar.gz -C logs "$(basename "$pkg_logs")"
          
          cat << EOF > logs/build-info.txt
          Build Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          Workflow Run ID: ${{ github.run_id }}
          Runner OS: ${ImageOS:-unknown}
          Runner Version: ${ImageVersion:-unknown}
          ImmortalWrt Commit: $(git -C . rev-parse HEAD)
          PassWall Commit: $(git -C package/openwrt-passwall rev-parse HEAD)
          Kernel: $(uname -r)
          OpenWrt Kernel: $(make -s kernelversion)
          GCC: $(gcc --version | head -n1)
          Clang: $(clang --version | head -n1)
          Go: $(go version)
          CCache Version: $(ccache --version | head -n1)
          Hardware Info:
          - CPU: $(lscpu | grep "Model name" | cut -d: -f2 | xargs)
          - Memory: $(free -h | awk '/^Mem:/ {print $2}')
          - Disk: $(df -h . | awk 'NR==2 {print $2}')
          EOF
          
          mkdir -p release_assets
          find bin/targets/x86/64 -name "*combined*.img.gz" -exec install -m644 {} release_assets/ \;
          [ -f bin/targets/x86/64/sha256sums ] && install -m644 bin/targets/x86/64/sha256sums release_assets/
          [ -f bin/targets/x86/64/profiles.json ] && jq . bin/targets/x86/64/profiles.json > /dev/null && install -m644 bin/targets/x86/64/profiles.json release_assets/
          install -m644 .config release_assets/.config
          
          for log in manifest.txt diffconfig.txt full.config.gz build.log.gz build-debug.log.gz package-logs.tar.gz apk-indexes.log luci-i18n-packages.log snapshot.sbom toolchain.info ccache.info build-info.txt defconfig.log download.log; do
            [ -s "logs/$log" ] && install -m644 "logs/$log" release_assets/
          done
          install -m644 logs/snapshot.sbom release_assets/feeds.snapshot
          [ -f ../feeds-install.log ] && install -m644 ../feeds-install.log release_assets/feeds-install.log
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: STABLE-b${{ github.run_number }}-${{ steps.meta.outputs.date }}
          name: ImmWrt 25.12.0 (穩定正式版)
          files: openwrt/release_assets/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
