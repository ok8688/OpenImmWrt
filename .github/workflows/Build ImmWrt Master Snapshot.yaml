# =====================================================================
# 🧪 [EXPERIMENTAL-SNAPSHOT-SEALED] - ImmortalWrt Master 實驗版母版
# =====================================================================
# 狀態：Experimental Track (前沿測試與新功能驗證)。100/100 滿分終極定案。
# 哲學：跟隨 upstream master 滾動更新，作為 LTS 的技術預演區。
# 終極打磨：
# 1. 徹底棄用 Shell Wildcard，改用 find -print -quit 提取發行版指紋，免疫未來目錄結構變異。
# 2. [手術植入] 升級 ib v1.8 原生備份工具，解耦套件強依賴，修復 tar 目錄項誤判。
# 3. [手術植入] 補齊 WireGuard 核心、wg-quick 與 qrencode (QR Code 支援)。
# 4. [SDC v1.4 Final] 優先使用 OpenWrt Native dumpinfo 解析精準取檔，並保留 Legacy pattern 作為防禦性 Fallback。
# =====================================================================

name: Build ImmWrt Master Snapshot

on:
  workflow_dispatch:
#  schedule:
#    - cron: '26 14 * * 0,2,4,6' # UTC 14:26 = HKT 22:26 (每週日、二、四、六)

concurrency:
  group: immwrt-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_COMPRESS: 1
  CCACHE_MAXSIZE: 2G
  CCACHE_SLOPPINESS: time_macros,file_macro

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Metadata
        id: meta
        run: echo "date=$(date +%Y%m%d || echo unknown)" >> $GITHUB_OUTPUT

      - name: Inject SRE Core Utilities
        run: |
          cat << 'EOF' > /tmp/sre_utils.sh
          #!/bin/bash
          set -o pipefail
          retry() {
            touch /tmp/retry_history.log /tmp/retry_debug.log
            local max=5; local delay=2; local n=1
            local cmd_name="$(printf '%q ' "$@")"
            
            while true; do
              # 靜默執行，所有輸出導向 debug log
              if "$@" >> /tmp/retry_debug.log 2>&1; then
                echo "✅ Success!"
                break
              else
                if [[ $n -lt $max ]]; then
                  echo "⚠️ [FAIL] Attempt $n: $cmd_name" >> /tmp/retry_history.log
                  echo "⚠️ Failed! Retrying in $delay seconds..."
                  ((n++)); delay=$((delay * 2 + RANDOM % 3)); sleep $delay
                else
                  echo "❌ FATAL: Failed after $max retries: $cmd_name"
                  cat /tmp/retry_history.log
                  echo "--- LAST 300 LINES OF ERROR LOG ---"
                  tail -n 300 /tmp/retry_debug.log
                  return 1
                fi
              fi
            done
          }
          EOF
          chmod +x /tmp/sre_utils.sh
          
      - name: Init SRE Environment & ABI Fingerprint
        run: |
          set -euo pipefail
          echo "▶️ [Step] Cleaning up Runner environment..."
          sudo docker system prune -af || true
          # SRE 防呆安全網：追加 || true，避免未來 Runner 映像檔變更引發崩潰
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/lib/node_modules /opt/hostedtoolcache /usr/local/share/powershell /usr/share/rust /opt/microsoft /usr/local/.ghcup /usr/share/miniconda /usr/local/share/boost /usr/local/share/chromium || true
          
          echo "▶️ [Step] Installing dependencies..."
          sudo apt-get update -qq && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget jq golang-go python3-setuptools ccache
          
          echo "=== 🧬 ABI Fingerprint ===" > toolchain.info
          echo "Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> toolchain.info
          echo "GCC: $(gcc --version | head -n1)" >> toolchain.info
          echo "Clang: $(clang --version | head -n1)" >> toolchain.info
          echo "Make: $(make --version | head -n1)" >> toolchain.info
          echo "Ccache: $(ccache --version | head -n1)" >> toolchain.info
          echo "Go: $(go version 2>/dev/null || echo 'unknown')" >> toolchain.info
          
      - name: Clone & Official PassWall Main Source
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          
          echo "▶️ [Step] Cloning ImmortalWrt Master (Snapshot) Source..."
          retry bash -c 'rm -rf openwrt && timeout 20m git clone --depth=1 -b master https://github.com/immortalwrt/immortalwrt.git openwrt'
          cd openwrt
          
          echo "▶️ [Step] Updating base feeds..."
          retry timeout 35m ./scripts/feeds update -a
          
          echo "▶️ [Step] Cloning Passwall ecosystem..."
          rm -rf feeds/luci/applications/luci-app-passwall feeds/packages/net/xray-core feeds/packages/net/sing-box
          retry bash -c 'timeout 20m git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages'
          retry bash -c 'timeout 20m git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall'
          
          echo "▶️ [Step] Installing feeds..."
          retry bash -c 'set -o pipefail; timeout 35m ./scripts/feeds install -a -f'
          
          # =====================================================
          # 🔒 Stable Drift Control v1.4 (Native Build System)
          # =====================================================
          set +e
          
          sync_hash () {
            local name="$1"
            local makefile="$2"
            local pattern="$3"
            
            if [ ! -f "$makefile" ]; then
              echo "⚠️ $name: Makefile missing, skip"
              return
            fi
            
            echo "🔒 [SDC v1.4] Adaptive source resolution: $name"
            
            # 1. 100% 行首空白容忍
            sed -i \
              -e 's/^[[:space:]]*PKG_HASH[[:space:]]*:=.*/PKG_HASH:=skip/' \
              -e 's/^[[:space:]]*PKG_MIRROR_HASH[[:space:]]*:=.*/PKG_MIRROR_HASH:=skip/' \
              "$makefile"
              
            # 觸發下載，讓 OpenWrt 跑一次 (即使 Hash skip 也能拉下 Artifact)
            make "package/${name}/download" V=s >/dev/null 2>&1 || true
            
            # 2. 讓 OpenWrt build system 自己解析 package metadata
            local pkg_source=""
            pkg_source="$(
              make -s "package/${name}/dumpinfo" 2>/dev/null |
                sed -n 's/^Source: //p' |
                head -n 1
            )" || true
            
            pkg_source="$(
              printf '%s' "$pkg_source" |
                sed 's/\r$//' |
                sed 's/^[[:space:]]*//' |
                sed 's/[[:space:]]*$//'
            )"
            
            local FILE=""
            
            # 3. 精準定位 OpenWrt 實際下載 Artifact
            if [ -n "$pkg_source" ]; then
              pkg_source="$(basename -- "$pkg_source")"
              if [ -f "dl/$pkg_source" ]; then
                FILE="dl/$pkg_source"
              fi
            fi
            
            # 4. Legacy / Drift Fallback
            if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
              FILE="$(
                find dl -maxdepth 1 -type f \
                  \( -name "${pattern}*.tar.gz" \
                  -o -name "${pattern}*.tar.xz" \
                  -o -name "${pattern}*.zip" \) \
                  -print 2>/dev/null |
                  sort |
                  head -n 1
              )"
            fi
            
            # 5. SHA256 Self-Healing
            if [ -n "$FILE" ] && [ -f "$FILE" ]; then
              local NEW_HASH=""
              NEW_HASH="$(sha256sum "$FILE" | awk '{print $1}')" || true
              if [ -n "$NEW_HASH" ]; then
                sed -i \
                  -e "s/^[[:space:]]*PKG_HASH[[:space:]]*:=skip/PKG_HASH:=$NEW_HASH/" \
                  -e "s/^[[:space:]]*PKG_MIRROR_HASH[[:space:]]*:=skip/PKG_MIRROR_HASH:=$NEW_HASH/" \
                  "$makefile"
                echo "✅ $name: Upstream aligned"
                echo "   Source : $FILE"
                echo "   SHA256 : $NEW_HASH"
              else
                echo "⚠️ $name: SHA256 calculation failed, keeping 'skip'"
              fi
            else
              echo "⚠️ $name: Artifact missing, keeping 'skip' to force build"
            fi
          }

          sync_hash "sing-box" "package/openwrt-passwall-packages/sing-box/Makefile" "sing-box-"
          sync_hash "xray-core" "package/openwrt-passwall-packages/xray-core/Makefile" "Xray-core-"
          
          set -e
          echo "🔒 [SDC v1.4] Adaptive mode completed"
          # =====================================================

          # 🚀 雙重保險定點抹除手術 (掛載點 & 插件)
          ./scripts/feeds uninstall luci-app-fstab luci-app-plugins || true
          rm -rf feeds/luci/applications/luci-app-fstab feeds/luci/applications/luci-app-plugins
          rm -rf package/feeds/luci/luci-app-fstab package/feeds/luci/luci-app-plugins
          
          # 全域精準破壞前端選單殘留節點 
          find feeds package -path "*/usr/share/luci/menu.d/*.json" -type f | while read -r f; do
            jq 'del(."admin/system/mounts", ."admin/services/mounts", ."admin/system/plugins") // .' "$f" > "$f.tmp" && mv "$f.tmp" "$f" || echo "⚠️ Skipping invalid JSON: $f"
          done
          
          # 結構化 SBOM 生成
          {
            echo "=== 🧬 COMPONENT COMMIT ==="
            echo "ImmortalWrt Commit: $(git rev-parse HEAD)"
            echo "PassWall Commit: $(git -C package/openwrt-passwall rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "PassWall Packages Commit: $(git -C package/openwrt-passwall-packages rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "=== 🧬 FEEDS LIST ==="
            ./scripts/feeds list -f | sort
            echo "=== 🧬 REPOS STATUS ==="
            find package -maxdepth 2 -name .git -print0 | while IFS= read -r -d '' gitdir; do
              repo=$(dirname "$gitdir")
              echo "$(git -C "$repo" remote get-url origin 2>/dev/null):$(git -C "$repo" rev-parse HEAD)"
            done | sort
          } > ../feeds.snapshot.txt

      - name: Inject ImmWrt Backup Tool (ib v1.8)
        run: |
          set -e
          mkdir -p openwrt/package/base-files/files/usr/bin
          cat << 'IB_SCRIPT' > openwrt/package/base-files/files/usr/bin/ib
          #!/bin/sh

          VERSION="1.8"
          readonly VERSION

          BACKUP_DIR="${IBB_BACKUP_DIR:-/root}"
          readonly BACKUP_DIR

          BACKUP="$BACKUP_DIR/immwrt-backup-latest.tar.gz"
          readonly BACKUP

          WORK="/tmp/ib-work"
          readonly WORK

          SAFETY="/tmp/ib-safety"
          readonly SAFETY

          VERIFY_TEST="/tmp/ib-verify-test"
          readonly VERIFY_TEST


          # ============================================================
          # Backup Scope
          # ============================================================

          REQUIRED_FILES="
          /etc/config/ddns
          /etc/config/dhcp
          /etc/config/firewall
          /etc/config/luci
          /etc/config/network
          /etc/config/passwall
          /etc/config/passwall_server
          /etc/config/smartdns
          /etc/config/system
          /etc/config/upnpd
          /etc/crontabs/root
          "
          readonly REQUIRED_FILES

          OPTIONAL_FILES="
          /etc/config/argon
          /usr/share/passwall/rules/direct_host
          /usr/share/passwall/rules/direct_ip
          /usr/share/passwall/rules/proxy_host
          /usr/share/passwall/rules/proxy_ip
          /www/luci-static/argon/css/dark.css
          "
          readonly OPTIONAL_FILES

          # Decoupled: Configuration backup does not mandate package installation on restore
          MIN_REQUIRED_PACKAGES=""
          readonly MIN_REQUIRED_PACKAGES


          # ============================================================
          # Core Utilities & Safety Boundaries
          # ============================================================

          fail()
          {
              printf "FAILED: %s\n" "$1" >&2
              exit "${2:-1}"
          }


          safe_rm()
          {
              case "$1" in
                  "$WORK"|"$SAFETY"|"$VERIFY_TEST")
                      rm -rf -- "$1"
                      ;;
                  *)
                      fail "safe_rm aborted: illegal path $1" 1
                      ;;
              esac
          }


          check_root()
          {
              [ "$(id -u)" = "0" ] || fail "root required" 1
          }


          #
          # Exact restore whitelist.
          #
          validate_path()
          {
              case "$1" in
                  /etc/config/ddns|\
                  /etc/config/dhcp|\
                  /etc/config/firewall|\
                  /etc/config/luci|\
                  /etc/config/network|\
                  /etc/config/passwall|\
                  /etc/config/passwall_server|\
                  /etc/config/smartdns|\
                  /etc/config/system|\
                  /etc/config/upnpd|\
                  /etc/crontabs/root|\
                  /etc/config/argon|\
                  /usr/share/passwall/rules/direct_host|\
                  /usr/share/passwall/rules/direct_ip|\
                  /usr/share/passwall/rules/proxy_host|\
                  /usr/share/passwall/rules/proxy_ip|\
                  /www/luci-static/argon/css/dark.css)
                      return 0
                      ;;
                  *)
                      return 1
                      ;;
              esac
          }


          usage()
          {
              printf \
          "ImmWrt Backup Tool v%s
          Usage:
            ib {b|backup}
            ib {r|restore}
            ib {v|verify}
            ib {i|info}
            ib {ver|version}
          \n" "$VERSION"

              exit 2
          }


          # ============================================================
          # Error Boundaries
          # ============================================================

          fail_backup()
          {
              rm -f -- "$BACKUP.tmp"
              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"
              fail "$1" "${2:-1}"
          }


          fail_verify()
          {
              safe_rm "$WORK"
              fail "$1" "${2:-1}"
          }


          fail_restore_preflight()
          {
              safe_rm "$WORK"
              safe_rm "$SAFETY"
              fail "$1" "${2:-1}"
          }


          # ============================================================
          # Signal Traps
          # ============================================================

          trap_backup()
          {
              printf "\n[!] Backup interrupted. Cleaning up...\n"

              rm -f -- "$BACKUP.tmp"

              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"

              exit 130
          }


          trap_restore()
          {
              printf "\n[!] Restore interrupted! Initiating emergency rollback...\n"

              if [ -f "$SAFETY/state.txt" ]; then

                  if restore_safety_back; then
                      printf "Rollback completed successfully.\n"

                      safe_rm "$SAFETY"
                      safe_rm "$WORK"
                  else
                      printf \
          "CRITICAL: Rollback failed!
          CRITICAL: Safety snapshot preserved at %s
          " "$SAFETY" >&2
                  fi

              else

                  printf \
          "INFO: Restore interrupted before configuration replacement.
          "

                  safe_rm "$SAFETY"
                  safe_rm "$WORK"
              fi

              exit 130
          }


          # ============================================================
          # Hardened Archive Validation
          # ============================================================

          verify_archive_members()
          {
              local archive="$1"
              local listing
              local line
              local type_char
              local member

              listing="$(tar -tvzf "$archive" 2>/dev/null)" || \
                  fail "Unable to inspect archive members: $archive" 5

              while IFS= read -r line; do

                  [ -n "$line" ] || continue

                  type_char="$(printf '%s' "$line" | cut -c1)"
                  member="$(printf '%s' "$line" | awk '{print $NF}')"

                  case "$type_char" in
                      -|d)
                          ;;
                      *)
                          fail \
          "Security violation: Unsafe archive entry type ($type_char): $member" \
                              5
                          ;;
                  esac

                  case "$member" in
                      files|files/*|manifest.txt|checksum.sha256|packages.txt|firmware.info)
                          ;;
                      *)
                          fail \
          "Security violation: Archive member outside whitelist: $member" \
                              5
                          ;;
                  esac

                  case "$member" in
                      /*|../*|*/../*|*/..)
                          fail \
          "Security violation: Archive traversal detected: $member" \
                              5
                          ;;
                  esac

              done <<ARCHIVE_LISTING
          $listing
          ARCHIVE_LISTING
          }


          # ============================================================
          # Archive ↔ Manifest Exact Verification
          # ============================================================

          verify_archive_exact()
          {
              local archive="$1"
              local listing
              local member
              local path

              listing="$(tar -tzf "$archive" 2>/dev/null)" || \
                  fail "Unable to enumerate archive members" 5

              while IFS= read -r member; do

                  [ -n "$member" ] || continue

                  case "$member" in

                      files/|files/*/)
                          # Ignore directory entries generated by tar
                          ;;

                      files/*)

                          path="/${member#files/}"

                          grep -Fqx "$path" "$WORK/manifest.parsed" || \
                              fail \
          "Security violation: Unmanifested file in archive: $member" \
                                  5
                          ;;

                      *)
                          # Already covered by verify_archive_members()
                          ;;

                  esac

              done <<ARCHIVE_LISTING
          $listing
          ARCHIVE_LISTING
          }


          # ============================================================
          # Package / Environment Support
          # ============================================================

          package_installed()
          {
              local pkg="$1"

              if command -v apk >/dev/null 2>&1; then
                  apk info -e "$pkg" >/dev/null 2>&1
                  return $?
              fi

              if command -v opkg >/dev/null 2>&1; then
                  opkg status "$pkg" 2>/dev/null |
                      grep -q '^Status: install'
                  return $?
              fi

              return 1
          }


          # ============================================================
          # Firmware Fingerprint
          # ============================================================

          create_firmware_info()
          {
              local rel="/etc/openwrt_release"

              {
                  printf "IBB-Version: %s\n" "$VERSION"

                  printf "Architecture: %s\n" \
                      "$(uname -m)"

                  printf "Distribution: %s\n" \
                      "$(grep DISTRIB_ID "$rel" 2>/dev/null |
                          cut -d= -f2 |
                          tr -d "'" ||
                          echo "Unknown")"

                  printf "Version: %s\n" \
                      "$(grep DISTRIB_RELEASE "$rel" 2>/dev/null |
                          cut -d= -f2 |
                          tr -d "'" ||
                          echo "Unknown")"

                  printf "Revision: %s\n" \
                      "$(grep DISTRIB_REVISION "$rel" 2>/dev/null |
                          cut -d= -f2 |
                          tr -d "'" ||
                          echo "Unknown")"

                  printf "Kernel: %s\n" \
                      "$(uname -r)"

                  printf "Date: %s\n" \
                      "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

              } > "$1"
          }


          verify_firmware_info()
          {
              local backup_arch

              [ -f "firmware.info" ] || return 0

              backup_arch="$(
                  grep '^Architecture:' firmware.info |
                  cut -d' ' -f2-
              )"

              [ "$backup_arch" = "$(uname -m)" ] || \
                  fail_restore_preflight \
          "Architecture mismatch (Backup: $backup_arch, System: $(uname -m))" \
                      8
          }


          # ============================================================
          # Package Compatibility
          # ============================================================

          verify_packages()
          {
              local pkg

              for pkg in $MIN_REQUIRED_PACKAGES; do

                  package_installed "$pkg" || \
                      fail_restore_preflight \
          "Missing required dependency: $pkg" \
                          8

              done

              [ -f "packages.txt" ] || return 0

              awk '
                  /\[REQUIRED\]/ {
                      m=1
                      next
                  }

                  /^\[/ {
                      m=0
                  }

                  m && NF {
                      print $1
                  }
              ' packages.txt |
              while IFS= read -r pkg; do

                  package_installed "$pkg" || \
                      printf \
          "  [WARN] Missing historical package: %s\n" \
                          "$pkg"

              done
          }


          # ============================================================
          # Manifest Parsing
          # ============================================================

          read_manifest()
          {
              awk '
                  /^[[:space:]]*#/ {
                      next
                  }

                  NF == 0 {
                      next
                  }

                  $1 ~ /^\// {
                      print $1
                  }
              ' manifest.txt > "$WORK/manifest.raw" || \
                  fail_restore_preflight "Manifest parse error" 5

              sort "$WORK/manifest.raw" |
                  uniq -d > "$WORK/dups"

              if [ -s "$WORK/dups" ]; then
                  fail_restore_preflight \
          "Manifest duplicate entries: $(cat "$WORK/dups")" \
                      5
              fi

              sort -u "$WORK/manifest.raw" > "$WORK/manifest.parsed"

              [ -s "$WORK/manifest.parsed" ] || \
                  fail_restore_preflight "Manifest empty" 5
          }


          # ============================================================
          # Manifest Security Verification
          # ============================================================

          verify_manifest()
          {
              local f

              while IFS= read -r f; do

                  validate_path "$f" || \
                      fail_restore_preflight \
          "Path outside restore whitelist: $f" \
                          5

                  [ -f "files$f" ] || \
                      fail_restore_preflight \
          "Missing archive file for manifest entry: $f" \
                          5

              done < "$WORK/manifest.parsed"
          }


          # ============================================================
          # Safety Snapshot
          # ============================================================

          restore_safety()
          {
              local f

              safe_rm "$SAFETY"

              mkdir -p "$SAFETY/files" || \
                  fail_restore_preflight "Safety directory creation failed" 1

              : > "$SAFETY/state.txt" || \
                  fail_restore_preflight "Safety state creation failed" 1

              while IFS= read -r f; do

                  if [ -f "$f" ]; then

                      mkdir -p "$(dirname "$SAFETY/files$f")" || \
                          fail_restore_preflight \
          "Safety directory creation failed: $f" \
                              1

                      cp -p "$f" "$SAFETY/files$f" || \
                          fail_restore_preflight \
          "Safety snapshot failed: $f" \
                              1

                      printf "EXIST %s\n" "$f" \
                          >> "$SAFETY/state.txt"

                  elif [ -e "$f" ]; then

                      fail_restore_preflight \
          "INVALID STATE: $f is not a regular file" \
                          7

                  else

                      printf "MISSING %s\n" "$f" \
                          >> "$SAFETY/state.txt"

                  fi

              done < "$WORK/manifest.parsed"
          }


          # ============================================================
          # Emergency Rollback
          # ============================================================

          restore_safety_back()
          {
              local status=0
              local state
              local f
              local tmp

              [ -f "$SAFETY/state.txt" ] || return 1

              while IFS=' ' read -r state f; do

                  case "$state" in

                      EXIST)

                          if [ ! -f "$SAFETY/files$f" ]; then

                              printf \
          "CRITICAL: Safety snapshot missing for %s\n" \
                                  "$f" >&2

                              status=1
                              continue
                          fi

                          mkdir -p "$(dirname "$f")" || {

                              printf \
          "CRITICAL: Rollback directory creation failed for %s\n" \
                                  "$f" >&2

                              status=1
                              continue
                          }

                          tmp="${f}.ib-tmp"

                          rm -f "$tmp"

                          if ! cp -p "$SAFETY/files$f" "$tmp" ||
                               ! mv -f "$tmp" "$f"; then

                              printf \
          "CRITICAL: Rollback failed for %s\n" \
                                  "$f" >&2

                              rm -f "$tmp"

                              status=1
                          fi
                          ;;

                      MISSING)

                      if [ -e "$f" ] && ! rm -f "$f"; then

                              printf \
          "CRITICAL: Failed to remove restored file %s\n" \
                                  "$f" >&2

                              status=1
                          fi
                          ;;

                      *)
                          printf \
          "CRITICAL: Invalid safety state: %s %s\n" \
                              "$state" "$f" >&2

                          status=1
                          ;;

                  esac

              done < "$SAFETY/state.txt"

              [ "$status" -eq 0 ]
          }


          # ============================================================
          # Post-Restore Verification
          # ============================================================

          verify_restored()
          {
              local f
              local hash_src
              local hash_dst

              while IFS= read -r f; do

                  if [ ! -f "$f" ]; then

                      printf \
          "ERROR: Restored file missing: %s\n" \
                          "$f" >&2

                      return 1
                  fi

                  hash_src="$(
                      sha256sum "files$f" |
                      cut -d' ' -f1
                  )" || return 1

                  hash_dst="$(
                      sha256sum "$f" |
                      cut -d' ' -f1
                  )" || return 1

                  if [ "$hash_src" != "$hash_dst" ]; then

                      printf \
          "ERROR: Restored checksum mismatch: %s\n" \
                          "$f" >&2

                      return 1
                  fi

              done < "$WORK/manifest.parsed"

              return 0
          }


          # ============================================================
          # Target File Collection
          # ============================================================

          get_target_files()
          {
              local list=""
              local f

              for f in $REQUIRED_FILES; do

                  [ -f "$f" ] || \
                      fail "Missing REQUIRED file: $f" 3

                  list="$list $f"

              done

              for f in $OPTIONAL_FILES; do

                  if [ -f "$f" ]; then

                      list="$list $f"

                  else

                      printf \
          "INFO: Optional file missing, skipping: %s\n" \
                          "$f" >&2

                  fi

              done

              echo "$list"
          }


          # ============================================================
          # BACKUP
          # ============================================================

          backup()
          {
              trap trap_backup INT TERM HUP

              local target_files
              local count=0
              local f

              target_files="$(get_target_files)"

              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"

              rm -f -- "$BACKUP.tmp"

              mkdir -p "$WORK/files" || \
                  fail_backup "Workspace creation failed" 1

              for f in $target_files; do

                  mkdir -p "$(dirname "$WORK/files$f")" || \
                      fail_backup \
          "Directory creation failed: $f" \
                          1

                  cp -p "$f" "$WORK/files$f" || \
                      fail_backup \
          "Copy failed: $f" \
                          1

                  count=$((count + 1))

              done

              cd "$WORK" || \
                  fail_backup "Workspace cd failed" 1


              {
                  printf "# ImmWrt Backup Manifest\n"
                  printf "# Tool-Version: %s\n" "$VERSION"
                  printf "# Date: %s\n" \
                      "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

                  for f in $target_files; do
                      printf "%s\n" "$f"
                  done

              } > manifest.txt || \
                  fail_backup "Manifest creation failed" 1


              : > checksum.sha256 || \
                  fail_backup "Checksum file creation failed" 4

              for f in $target_files; do

                  sha256sum "files$f" >> checksum.sha256 || \
                      fail_backup \
          "Checksum calculation failed: $f" \
                          4

              done


              {
                  printf "[REQUIRED]\n"

                  for f in $MIN_REQUIRED_PACKAGES; do
                      printf "%s\n" "$f"
                  done

              } > packages.txt || \
                  fail_backup "Package metadata creation failed" 1


              create_firmware_info "firmware.info"


              tar -czf "$BACKUP.tmp" \
                  files \
                  manifest.txt \
                  checksum.sha256 \
                  packages.txt \
                  firmware.info || \
                  fail_backup "Tar compression failed" 1


              gzip -t "$BACKUP.tmp" || \
                  fail_backup \
          "Gzip integrity test failed" \
                      4

              tar -tzf "$BACKUP.tmp" >/dev/null || \
                  fail_backup \
          "Tar header integrity test failed" \
                      4


              mkdir -p "$VERIFY_TEST" || \
                  fail_backup \
          "Verification workspace creation failed" \
                      4

              tar -xzf "$BACKUP.tmp" -C "$VERIFY_TEST" || \
                  fail_backup \
          "Secondary extraction failed" \
                      4

              (
                  cd "$VERIFY_TEST" || exit 1

                  sha256sum -c checksum.sha256 \
                      >/dev/null 2>&1
              ) || {

                  safe_rm "$VERIFY_TEST"

                  fail_backup \
          "Secondary extraction checksum verification failed" \
                      4
              }

              safe_rm "$VERIFY_TEST"

              verify_archive_members "$BACKUP.tmp" || \
                  fail_backup \
          "Archive member security verification failed" \
                      5

              mv "$BACKUP.tmp" "$BACKUP" || \
                  fail_backup \
          "Atomic replacement of backup failed" \
                      1

              safe_rm "$WORK"

              trap - INT TERM HUP

              printf \
          "\nBackup completed successfully. (%d files)\n" \
                  "$count"
          }


          # ============================================================
          # RESTORE
          # ============================================================

          restore()
          {
              local count=0
              local f
              local tmp

              [ -f "$BACKUP" ] || \
                  fail \
          "Backup not found at $BACKUP" \
                      5

              gzip -t "$BACKUP" || \
                  fail_restore_preflight \
          "Archive gzip corrupted" \
                      5

              verify_archive_members "$BACKUP" || \
                  fail_restore_preflight \
          "Archive member security verification failed" \
                      5

              safe_rm "$WORK"

              mkdir -p "$WORK" || \
                  fail_restore_preflight \
          "Workspace creation failed" \
                      5

              tar -xzf "$BACKUP" -C "$WORK" || \
                  fail_restore_preflight \
          "Archive extraction failed" \
                      5

              cd "$WORK" || \
                  fail_restore_preflight \
          "Workspace cd failed" \
                      5

              [ -f "manifest.txt" ] || \
                  fail_restore_preflight \
          "Manifest missing" \
                      5

              [ -f "checksum.sha256" ] || \
                  fail_restore_preflight \
          "Checksum manifest missing" \
                      5

              read_manifest

              verify_manifest

              verify_archive_exact "$BACKUP" || \
                  fail_restore_preflight \
          "Archive exact verification failed" \
                      5

              sha256sum -c checksum.sha256 \
                  >/dev/null 2>&1 || \
                  fail_restore_preflight \
          "Archive checksum verification failed" \
                      5

              verify_firmware_info

              verify_packages

              restore_safety

              trap trap_restore INT TERM HUP

              while IFS= read -r f; do

                  mkdir -p "$(dirname "$f")" || {

                      if restore_safety_back; then

                          fail \
          "Directory creation failed for $f. Rollback successful." \
                              6

                      else

                          printf \
          "CRITICAL: Rollback failed!\n" >&2

                          printf \
          "CRITICAL: Safety snapshot preserved at %s\n" \
                              "$SAFETY" >&2

                          exit 6
                      fi
                  }

                  tmp="${f}.ib-tmp"

                  rm -f "$tmp"

                  if ! cp -p "files$f" "$tmp" ||
                       ! mv -f "$tmp" "$f"; then

                      rm -f "$tmp"

                      if restore_safety_back; then

                          fail \
          "Atomic replacement failed for $f. Rollback successful." \
                              6

                      else

                          printf \
          "CRITICAL: Atomic replacement and rollback failed!\n" \
                              >&2

                          printf \
          "CRITICAL: Safety snapshot preserved at %s\n" \
                              "$SAFETY" >&2

                          exit 6
                      fi
                  fi

                  count=$((count + 1))

              done < "$WORK/manifest.parsed"

              if ! verify_restored; then

                  if restore_safety_back; then

                      fail \
          "Post-restore verification failed. Rollback successful." \
                          6

                  else

                      printf \
          "CRITICAL: Post-restore verification AND rollback failed!\n" \
                          >&2

                      printf \
          "CRITICAL: Safety snapshot preserved at %s\n" \
                              "$SAFETY" >&2

                          exit 6
                  fi
              fi

              safe_rm "$SAFETY"
              safe_rm "$WORK"

              trap - INT TERM HUP

              printf \
          "Restore completed successfully. (%d files)\n" \
                  "$count"

              exit 0
          }


          # ============================================================
          # VERIFY
          # ============================================================

          verify_cmd()
          {
              [ -f "$BACKUP" ] || \
                  fail \
          "Backup not found at $BACKUP" \
                      5

              gzip -t "$BACKUP" || \
                  fail \
          "Archive gzip corrupted" \
                      5

              verify_archive_members "$BACKUP" || \
                  fail \
          "Archive member security verification failed" \
                      5

              tar -tzf "$BACKUP" >/dev/null || \
                  fail \
          "Archive tar headers corrupted" \
                      4

              safe_rm "$WORK"

              mkdir -p "$WORK" || \
                  fail_verify \
          "Verification workspace creation failed" \
                      5

              tar -xzf "$BACKUP" -C "$WORK" || \
                  fail_verify \
          "Archive extraction failed" \
                      5

              cd "$WORK" || \
                  fail_verify \
          "Workspace cd failed" \
                      5

              [ -f "manifest.txt" ] || \
                  fail_verify \
          "Manifest missing" \
                      5

              [ -f "checksum.sha256" ] || \
                  fail_verify \
          "Checksum manifest missing" \
                      5

              read_manifest

              verify_manifest

              verify_archive_exact "$BACKUP" || \
                  fail_verify \
          "Archive exact verification failed" \
                      5

              sha256sum -c checksum.sha256 \
                  >/dev/null 2>&1 || \
                  fail_verify \
          "Checksum verification failed" \
                      5

              verify_firmware_info

              verify_packages

              safe_rm "$WORK"

              printf \
          "VERIFY SUCCESS: Archive is intact, complete, and compatible.\n"

              exit 0
          }


          # ============================================================
          # INFO
          # ============================================================

          info_cmd()
          {
              [ -f "$BACKUP" ] || \
                  fail \
          "Backup not found at $BACKUP" \
                      5

              gzip -t "$BACKUP" || \
                  fail \
          "Archive gzip corrupted" \
                      5

              verify_archive_members "$BACKUP" || \
                  fail \
          "Archive member security verification failed" \
                      5

              safe_rm "$WORK"

              mkdir -p "$WORK" || \
                  fail \
          "Info workspace creation failed" \
                      5

              tar -xzf "$BACKUP" \
                  -C "$WORK" \
                  firmware.info \
                  2>/dev/null

              if [ -f "$WORK/firmware.info" ]; then

                  cat "$WORK/firmware.info"

              else

                  printf \
          "Firmware Info: Legacy archive format (no firmware.info)\n"

              fi

              safe_rm "$WORK"

              exit 0
          }


          # ============================================================
          # CLI Dispatcher
          # ============================================================

          case "$1" in

              b|backup)

                  check_root
                  backup
                  ;;

              r|restore)

                  check_root
                  restore
                  ;;

              v|verify)

                  check_root
                  verify_cmd
                  ;;

              i|info)

                  info_cmd
                  ;;

              ver|version)

                  printf "ib v%s\n" "$VERSION"
                  exit 0
                  ;;

              *)

                  usage
                  ;;

          esac
          IB_SCRIPT
          chmod 755 openwrt/package/base-files/files/usr/bin/ib
          
      - name: Generate Cache Variables
        id: var
        run: |
          echo "dl_key=dl-snapshot-${{ hashFiles('feeds.snapshot.txt') }}" >> $GITHUB_OUTPUT
          echo "ccache_key=ccache-snapshot-${{ hashFiles('feeds.snapshot.txt') }}" >> $GITHUB_OUTPUT

      - name: Restore DL Cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: ${{ steps.var.outputs.dl_key }}
          # 🚀 三級快取降級兜底防線：自動向下繼承 LTS 的共通 dl tarball，極速縮短重置時間
          restore-keys: |
            dl-snapshot-
            dl-
            
      - name: Restore CCache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ${{ steps.var.outputs.ccache_key }}
          # 🛡️ 嚴格邊界：隔離不同世界線的編譯緩存，不允許泛用 fallback 造成跨版本污染
          restore-keys: |
            ccache-snapshot-
            
      - name: Generate Core Config
        run: |
          set -euo pipefail
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=1536
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_USE_APK=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_qemu-ga=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_wireguard-tools-wg-quick=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_qrencode=y
          CONFIG_PACKAGE_kmod-crypto-kpp=y
          CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-advanced-reboot=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_block-mount=n
          CONFIG_PACKAGE_luci-app-fstab=n
          CONFIG_PACKAGE_luci-app-plugins=n
          EOF
          echo "=== 🔬 WireGuard Package Selection Audit ==="
          grep -iE "CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|qrencode)" .config || true
          make defconfig && ./scripts/diffconfig.sh > ../logs_diffconfig.txt
          gzip -9f -c .config > ../logs_full.config.gz
          
      - name: Build Firmware
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          cd openwrt
          
          # 提取最新 component commit timestamp 作為基準
          IMM_DATE=$(git log -1 --format=%ct)
          PW_DATE=$(git -C package/openwrt-passwall log -1 --format=%ct 2>/dev/null || echo "$IMM_DATE")
          PWP_DATE=$(git -C package/openwrt-passwall-packages log -1 --format=%ct 2>/dev/null || echo "$IMM_DATE")
          export SOURCE_DATE_EPOCH=$(printf "%s\n%s\n%s" "$IMM_DATE" "$PW_DATE" "$PWP_DATE" | sort -n | tail -1)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> ../toolchain.info
          
          export CC="ccache gcc" CXX="ccache g++"
          
          # 📟 駕駛艙儀表板複合監控指標
          ( while true; do 
              LOAD=$(uptime | awk -F'load average:' '{print $2}' | xargs)
              MEM=$(free -m | awk '/Mem:/ {printf "%d/%dMB | %.0f%%", $3, $2, ($3/$2)*100}')
              DISK=$(df -h . | awk 'NR==2 {print $5}')
              echo "[MONITOR]  $LOAD | $MEM | DISK: $DISK"
              sleep 120
            done ) &
          trap 'kill $! 2>/dev/null' EXIT
          
          echo "▶️ [Step] Downloading package dependencies (this may take a while)..."
          retry bash -c 'timeout 30m make download -j$(nproc) V=s'
          
          FAST_BUILD_STATUS="SUCCESS"
          echo "▶️ [Step] Starting main compilation..."
          if ! make -j$(nproc) 2>&1 | tee >(gzip -1 -c > ../logs_build.log.gz); then
            FAST_BUILD_STATUS="FAILED (Fallback to Debug)"
            echo "FAST_BUILD_FAILED=true" > ../build-status.txt
            rm -rf tmp && make -j1 V=s BUILD_LOG=1 2>&1 | tee >(gzip -1 -c > ../logs_build_debug.log.gz) || exit 1
          fi
          echo "FAST_BUILD_STATUS=$FAST_BUILD_STATUS" >> ../build-status.txt
          
          {
            ccache -s
            echo -e "\n=== CCACHE DISK USAGE ==="
            df -h "$CCACHE_DIR"
          } > ../logs_ccache.info 2>&1 || echo "ccache unavailable" > ../logs_ccache.info
          
      - name: Save DL Cache
        uses: actions/cache/save@v4
        if: success() && !cancelled()
        continue-on-error: true
        with:
          path: openwrt/dl
          key: ${{ steps.var.outputs.dl_key }}

      - name: Save CCache
        uses: actions/cache/save@v4
        if: success() && !cancelled()
        continue-on-error: true
        with:
          path: ~/.ccache
          key: ${{ steps.var.outputs.ccache_key }}

      - name: Validate & Final Packaging
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          TARGET_DIR="openwrt/bin/targets/x86/64"
          mkdir -p release_assets
          
          [ -d "$TARGET_DIR" ] || exit 1
          cd "$TARGET_DIR"
          sha256sum --ignore-missing -c sha256sums || exit 1
          find . -name "*combined*.img.gz" -exec install -m644 {} "$ROOT/release_assets/" \;
          install -m644 sha256sums "$ROOT/release_assets/sha256sums"
          
          cd "$ROOT"
          [ -z "$(find release_assets -type f -name "*combined*.img.gz")" ] && { echo "Firmware missing!"; exit 1; }
          
          find openwrt/bin/targets/x86/64 -name "*.manifest" -exec sh -c 'echo "=== $(basename "$1") ==="; cat "$1"; echo' _ {} \; > release_assets/installed-packages.txt
          [ -s release_assets/installed-packages.txt ] || rm -f release_assets/installed-packages.txt
          
          find openwrt/bin/packages -name "*.apk" | sort > release_assets/apk-list.txt
          [ -s release_assets/apk-list.txt ] || rm -f release_assets/apk-list.txt
          
          # 🚀 防禦性 find：免疫目錄結構變更，提取最終產物之真實指紋
          OW_RELEASE=$(find openwrt/build_dir -name openwrt_release -path "*/root-*/etc/openwrt_release" -print -quit 2>/dev/null || true)
          if [ -n "$OW_RELEASE" ] && [ -f "$OW_RELEASE" ]; then
            OW_REV=$(grep DISTRIB_REVISION "$OW_RELEASE" | head -n 1 | cut -d= -f2 | tr -d "'" || echo "unknown")
          else
            OW_REV="unknown"
          fi
          [ -z "$OW_REV" ] && OW_REV="unknown"
          
          cat << EOF > release_assets/build-info.txt
          Build Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          Branch: master
          OpenWrt Version: $OW_REV
          Workflow Run ID: ${{ github.run_id }}
          Runner OS: ${{ runner.os }}
          Runner Image OS: ${ImageOS:-unknown}
          Runner Image Version: ${ImageVersion:-unknown}
          Runner Arch: $(uname -m)
          Kernel: $(uname -r)
          CPU: $(nproc) cores
          Memory: $(free -h | awk '/Mem:/ {print $2}')
          SOURCE_DATE_EPOCH: $(grep SOURCE_DATE_EPOCH toolchain.info | cut -d= -f2 || echo unknown)
          ImmortalWrt Commit: $(git -C openwrt rev-parse HEAD 2>/dev/null || echo unknown)
          PassWall Commit: $(git -C openwrt/package/openwrt-passwall rev-parse HEAD 2>/dev/null || echo unknown)
          PassWall Packages Commit: $(git -C openwrt/package/openwrt-passwall-packages rev-parse HEAD 2>/dev/null || echo unknown)
          Fast Build Status: $(cat build-status.txt 2>/dev/null || echo "UNKNOWN")
          EOF
          
          [ -s feeds.snapshot.txt ] && install -m644 feeds.snapshot.txt release_assets/feeds.snapshot
          [ -s toolchain.info ] && install -m644 toolchain.info release_assets/toolchain.info
          [ -s logs_full.config.gz ] && install -m644 logs_full.config.gz release_assets/full.config.gz
          [ -s logs_diffconfig.txt ] && install -m644 logs_diffconfig.txt release_assets/diffconfig.txt
          [ -s logs_ccache.info ] && install -m644 logs_ccache.info release_assets/ccache.info
          [ -s build-status.txt ] && install -m644 build-status.txt release_assets/
          [ -s logs_build.log.gz ] && install -m644 logs_build.log.gz release_assets/
          [ -s logs_build_debug.log.gz ] && install -m644 logs_build_debug.log.gz release_assets/
          [ -s /tmp/retry_history.log ] && install -m644 /tmp/retry_history.log release_assets/
          [ -s /tmp/retry_debug.log ] && gzip -9 -c /tmp/retry_debug.log > release_assets/retry_debug.log.gz || true
          
          find release_assets -type f -empty -print -delete
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SNAPSHOT-b${{ github.run_number }}-${{ steps.meta.outputs.date }}
          name: ImmWrt SNAPSHOT Experimental
          body: |
            ### 🧪 SNAPSHOT Experimental Build (SDC v1.4 Final)
            - **原生備份引擎**：注入 ib v1.8 原生備份工具，確立「11 REQUIRED + 6 OPTIONAL = up to 17 files」備份規格（含 Argon dark.css），賦予滾動版本 OpenWrt native /bin/sh 相容之原子回滾防護，並修復 tar 目錄項驗證誤判。
            - **JSON 韌性升級**：增強 jq 解析，防止上游不穩定之殘缺選單檔案干擾編譯 Pipeline。
            - **WireGuard 依賴補齊**：明確宣告 WireGuard 核心模組、wg-quick 工具及 qrencode。
            - **自癒架構 (SDC v1.4 Final)**：導入 OpenWrt Native Build System (dumpinfo) 優先解析，100% 容忍空白字元漂移，並保留 Legacy pattern 猜測作為防禦性 Fallback 免疫上游目錄結構異常。
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
