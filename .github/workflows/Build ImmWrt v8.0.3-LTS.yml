# =====================================================================
# 🔒 [LTS FINAL SEALED] - THE ABSOLUTE FINALITY v8.0.3 (25.12.1 TSAR BOMBA)
# =====================================================================
# 狀態：TSAR BOMBA SEALED (沙皇級物理空間強化封存)。
# 哲學：鎖定正式版發行分支，透過 Adaptive Drift 容忍上游漂移。
# 終極融合：
# 1. 繼承 Snapshot 的企業級 retry 除錯、串流日誌與全套考古 Artifacts。
# 2. 升級 SOURCE_DATE_EPOCH 溯源與 find 精準提取 openwrt_release。
# 3. 保留 LTS 專屬的沙皇空間清理、4G Swap 與自癒 Hash 架構。
# 4. [v8.0.3] 升級 ib v1.8 垂直排版黃金基準備份引擎，新增 WireGuard 核心依賴。
# =====================================================================

name: Build ImmWrt v8.0.3-LTS

on:
  workflow_dispatch:
#  schedule:
#    - cron: '26 14 * * 0,2,4,6' # UTC 14:26 = HKT 22:26 (每週日、二、四、六)

concurrency:
  group: immwrt-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Metadata
        id: meta
        run: echo "date=$(date +%Y%m%d || echo unknown)" >> $GITHUB_OUTPUT

      - name: Inject SRE Core Utilities
        run: |
          cat << 'EOF' > /tmp/sre_utils.sh
          #!/bin/bash
          set -o pipefail
          retry() {
            touch /tmp/retry_history.log /tmp/retry_debug.log
            local max=5; local delay=2; local n=1
            local cmd_name="$(printf '%q ' "$@")"
            
            while true; do
              if "$@" >> /tmp/retry_debug.log 2>&1; then
                echo "✅ Success!"
                break
              else
                if [[ $n -lt $max ]]; then
                  echo "⚠️ [FAIL] Attempt $n: $cmd_name" >> /tmp/retry_history.log
                  echo "⚠️ Failed! Retrying in $delay seconds..."
                  ((n++)); delay=$((delay * 2 + RANDOM % 3)); sleep $delay
                else
                  echo "❌ FATAL: Failed after $max retries: $cmd_name"
                  cat /tmp/retry_history.log
                  echo "--- LAST 300 LINES OF ERROR LOG ---"
                  tail -n 300 /tmp/retry_debug.log
                  return 1
                fi
              fi
            done
          }
          EOF
          chmod +x /tmp/sre_utils.sh
          
      - name: Init SRE Environment & Space Cleanup
        run: |
          set -euo pipefail
          echo "=== 💥 啟動沙皇級核爆清理 (釋放終極極限空間) ==="
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/share/rust \
            /opt/microsoft \
            /usr/local/share/edge_driver \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /opt/az \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/lib/heroku || true
            
          sudo docker system prune -af || true
          sudo apt-get clean
          
          echo "=== 🚀 部署依賴與內存裝甲 ==="
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget jq golang-go ccache
            
          echo "▶️ [Step] Deploying 4G Swap Armor..."
          sudo swapoff -a || true
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          echo "=== 🧬 Deep ABI Fingerprint ===" > toolchain.info
          echo "Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> toolchain.info
          uname -r >> toolchain.info
          gcc --version | head -n 1 >> toolchain.info
          ld --version | head -n 1 >> toolchain.info
          ldd --version | head -n 1 >> toolchain.info
          dpkg -s libc6 | grep Version >> toolchain.info
          go version >> toolchain.info || true
          
      - name: Clone & Official PassWall Main Source
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          
          echo "▶️ [Step] Cloning ImmortalWrt 25.12.1 LTS Source..."
          retry bash -c 'rm -rf openwrt && timeout 20m git clone -b v25.12.1 --single-branch --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt'
          cd openwrt
          
          echo "▶️ [Step] Updating base feeds..."
          retry timeout 35m ./scripts/feeds update -a
          
          # ✅ 終極物理防護 - 徹底切斷舊版供應鏈 (修正：保留 upnp 與 advanced-reboot)
          ./scripts/feeds uninstall luci-app-passwall xray-core sing-box luci-app-fstab luci-app-plugins || true
          rm -rf feeds/luci/applications/luci-app-passwall feeds/packages/net/xray-core feeds/packages/net/sing-box feeds/luci/applications/luci-app-fstab feeds/luci/applications/luci-app-plugins
          rm -rf package/feeds/luci/luci-app-passwall package/feeds/packages/xray-core package/feeds/packages/sing-box package/feeds/luci/luci-app-fstab package/feeds/luci/luci-app-plugins
          
          echo "▶️ [Step] Cloning Passwall ecosystem..."
          retry git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages
          retry git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall
            
          echo "▶️ [Step] Installing feeds..."
          retry bash -c 'set -o pipefail; timeout 35m ./scripts/feeds install -a -f'

          # =====================================================
          # 🔒 Stable Drift Control v1.1 (ADAPTIVE REVISION)
          # =====================================================
          set +e
          echo "🔒 [SDC v1.1] Adaptive drift mode active..."
          
          sync_hash () {
            local name="$1"
            local makefile="$2"
            local pattern="$3"
            
            if [ ! -f "$makefile" ]; then
              echo "⚠️ $name: Makefile missing, skip"
              return
            fi
            
            sed -i 's/^PKG_HASH:=.*/PKG_HASH:=skip/' "$makefile"
            make "package/${name}/download" V=s >/dev/null 2>&1 || true
            
            FILE=$(ls dl/${pattern}* 2>/dev/null | grep -E '\.(tar\.gz|tar\.xz|zip)$' | head -n 1)
            
            if [ -n "$FILE" ]; then
              NEW_HASH=$(sha256sum "$FILE" | awk '{print $1}')
              sed -i "s/^PKG_HASH:=skip/PKG_HASH:=$NEW_HASH/" "$makefile"
              echo "✅ $name: Upstream aligned -> $NEW_HASH"
            else
              echo "⚠️ $name: Artifact missing, keeping 'skip' to force build"
            fi
          }

          sync_hash "sing-box" "package/openwrt-passwall-packages/sing-box/Makefile" "sing-box-"
          sync_hash "xray-core" "package/openwrt-passwall-packages/xray-core/Makefile" "Xray-core-"
          
          set -e
          echo "🔒 [SDC v1.1] Adaptive mode completed"
          # =====================================================

          # 全域精準破壞前端選單殘留節點 (修正：加入 // . 增強 JSON 解析韌性)
          find feeds package -path "*/usr/share/luci/menu.d/*.json" -type f | while read -r f; do
            jq 'del(."admin/system/mounts", ."admin/services/mounts", ."admin/system/plugins") // .' "$f" > "$f.tmp" && mv "$f.tmp" "$f" || echo "⚠️ Skipping invalid JSON: $f"
          done
          
          # 結構化 SBOM 生成
          {
            echo "=== 🧬 COMPONENT COMMIT ==="
            echo "ImmortalWrt Commit: $(git rev-parse HEAD)"
            echo "PassWall Commit: $(git -C package/openwrt-passwall rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "PassWall Packages Commit: $(git -C package/openwrt-passwall-packages rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "=== 🧬 FEEDS LIST ==="
            ./scripts/feeds list -f | sort
            echo "=== 🧬 REPOS STATUS ==="
            find package -maxdepth 2 -name .git -print0 | while IFS= read -r -d '' gitdir; do
              repo=$(dirname "$gitdir")
              echo "$(git -C "$repo" remote get-url origin 2>/dev/null):$(git -C "$repo" rev-parse HEAD)"
            done | sort
          } > ../feeds.snapshot.txt

      - name: Inject ImmWrt Backup Tool (ib v1.8)
        run: |
          set -e
          mkdir -p openwrt/package/base-files/files/usr/bin
          cat << 'EOF' > openwrt/package/base-files/files/usr/bin/ib
          #!/bin/sh

          VERSION="1.8"
          readonly VERSION

          BACKUP_DIR="${IBB_BACKUP_DIR:-/root}"
          readonly BACKUP_DIR

          BACKUP="$BACKUP_DIR/immwrt-backup-latest.tar.gz"
          readonly BACKUP

          WORK="/tmp/ib-work"
          readonly WORK

          SAFETY="/tmp/ib-safety"
          readonly SAFETY

          VERIFY_TEST="/tmp/ib-verify-test"
          readonly VERIFY_TEST


          # ============================================================
          # Backup Scope
          # ============================================================

          REQUIRED_FILES="
          /etc/config/ddns
          /etc/config/dhcp
          /etc/config/firewall
          /etc/config/luci
          /etc/config/network
          /etc/config/passwall
          /etc/config/passwall_server
          /etc/config/smartdns
          /etc/config/system
          /etc/config/upnpd
          /etc/crontabs/root
          "
          readonly REQUIRED_FILES

          OPTIONAL_FILES="
          /etc/config/argon
          /usr/share/passwall/rules/direct_host
          /usr/share/passwall/rules/direct_ip
          /usr/share/passwall/rules/proxy_host
          /usr/share/passwall/rules/proxy_ip
          /www/luci-static/argon/css/dark.css
          "
          readonly OPTIONAL_FILES

          MIN_REQUIRED_PACKAGES="
          wireguard-tools
          luci-proto-wireguard
          "
          readonly MIN_REQUIRED_PACKAGES


          # ============================================================
          # Core Utilities & Safety Boundaries
          # ============================================================

          fail()
          {
              printf "FAILED: %s\n" "$1" >&2
              exit "${2:-1}"
          }


          safe_rm()
          {
              case "$1" in
                  "$WORK"|"$SAFETY"|"$VERIFY_TEST")
                      rm -rf -- "$1"
                      ;;
                  *)
                      fail "safe_rm aborted: illegal path $1" 1
                      ;;
              esac
          }


          check_root()
          {
              [ "$(id -u)" = "0" ] || fail "root required" 1
          }


          #
          # Exact restore whitelist.
          #
          # Do NOT broaden this to arbitrary /etc or /usr/share paths.
          #
          validate_path()
          {
              case "$1" in
                  /etc/config/ddns|\
                  /etc/config/dhcp|\
                  /etc/config/firewall|\
                  /etc/config/luci|\
                  /etc/config/network|\
                  /etc/config/passwall|\
                  /etc/config/passwall_server|\
                  /etc/config/smartdns|\
                  /etc/config/system|\
                  /etc/config/upnpd|\
                  /etc/crontabs/root|\
                  /etc/config/argon|\
                  /usr/share/passwall/rules/direct_host|\
                  /usr/share/passwall/rules/direct_ip|\
                  /usr/share/passwall/rules/proxy_host|\
                  /usr/share/passwall/rules/proxy_ip|\
                  /www/luci-static/argon/css/dark.css)
                      return 0
                      ;;
                  *)
                      return 1
                      ;;
              esac
          }


          usage()
          {
              printf \
          "ImmWrt Backup Tool v%s
          Usage:
            ib {b|backup}
            ib {r|restore}
            ib {v|verify}
            ib {i|info}
            ib {ver|version}
          \n" "$VERSION"

              exit 2
          }


          # ============================================================
          # Error Boundaries
          # ============================================================

          fail_backup()
          {
              rm -f -- "$BACKUP.tmp"
              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"
              fail "$1" "${2:-1}"
          }


          fail_verify()
          {
              safe_rm "$WORK"
              fail "$1" "${2:-1}"
          }


          fail_restore_preflight()
          {
              safe_rm "$WORK"
              safe_rm "$SAFETY"
              fail "$1" "${2:-1}"
          }


          # ============================================================
          # Signal Traps
          # ============================================================

          trap_backup()
          {
              printf "\n[!] Backup interrupted. Cleaning up...\n"

              rm -f -- "$BACKUP.tmp"

              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"

              exit 130
          }


          trap_restore()
          {
              printf "\n[!] Restore interrupted! Initiating emergency rollback...\n"

              if [ -f "$SAFETY/state.txt" ]; then

                  if restore_safety_back; then
                      printf "Rollback completed successfully.\n"

                      safe_rm "$SAFETY"
                      safe_rm "$WORK"
                  else
                      printf \
          "CRITICAL: Rollback failed!
          CRITICAL: Safety snapshot preserved at %s
          " "$SAFETY" >&2
                  fi

              else

                  printf \
          "INFO: Restore interrupted before configuration replacement.
          "

                  safe_rm "$SAFETY"
                  safe_rm "$WORK"
              fi

              exit 130
          }


          # ============================================================
          # Hardened Archive Validation
          # ============================================================

          verify_archive_members()
          {
              local archive="$1"
              local listing
              local line
              local type_char
              local member

              listing="$(tar -tvzf "$archive" 2>/dev/null)" || \
                  fail "Unable to inspect archive members: $archive" 5

              while IFS= read -r line; do

                  [ -n "$line" ] || continue

                  type_char="$(printf '%s' "$line" | cut -c1)"
                  member="$(printf '%s' "$line" | awk '{print $NF}')"

                  #
                  # Only regular files and directories are permitted.
                  #
                  case "$type_char" in
                      -|d)
                          ;;
                      *)
                          fail \
          "Security violation: Unsafe archive entry type ($type_char): $member" \
                              5
                          ;;
                  esac

                  #
                  # Archive-level whitelist.
                  #
                  case "$member" in
                      files|files/*|manifest.txt|checksum.sha256|packages.txt|firmware.info)
                          ;;
                      *)
                          fail \
          "Security violation: Archive member outside whitelist: $member" \
                              5
                          ;;
                  esac

                  #
                  # Path traversal protection.
                  #
                  case "$member" in
                      /*|../*|*/../*|*/..)
                          fail \
          "Security violation: Archive traversal detected: $member" \
                              5
                          ;;
                  esac

              done <<EOF
          $listing
          EOF
          }


          # ============================================================
          # Archive ↔ Manifest Exact Verification
          # ============================================================

          verify_archive_exact()
          {
              local archive="$1"
              local listing
              local member
              local path

              listing="$(tar -tzf "$archive" 2>/dev/null)" || \
                  fail "Unable to enumerate archive members" 5

              while IFS= read -r member; do

                  [ -n "$member" ] || continue

                  case "$member" in

                      files/*)

                          path="/${member#files/}"

                          grep -Fqx "$path" "$WORK/manifest.parsed" || \
                              fail \
          "Security violation: Unmanifested file in archive: $member" \
                                  5
                          ;;

                  esac

              done <<EOF
          $listing
          EOF
          }


          # ============================================================
          # Package / Environment Support
          # ============================================================

          package_installed()
          {
              local pkg="$1"

              if command -v apk >/dev/null 2>&1; then
                  apk info -e "$pkg" >/dev/null 2>&1
                  return $?
              fi

              if command -v opkg >/dev/null 2>&1; then
                  opkg status "$pkg" 2>/dev/null |
                      grep -q '^Status: install'
                  return $?
              fi

              return 1
          }


          # ============================================================
          # Firmware Fingerprint
          # ============================================================

          create_firmware_info()
          {
              local rel="/etc/openwrt_release"

              {
                  printf "IBB-Version: %s\n" "$VERSION"

                  printf "Architecture: %s\n" \
                      "$(uname -m)"

                  printf "Distribution: %s\n" \
                      "$(grep DISTRIB_ID "$rel" 2>/dev/null |
                          cut -d= -f2 |
                          tr -d "'" ||
                          echo "Unknown")"

                  printf "Version: %s\n" \
                      "$(grep DISTRIB_RELEASE "$rel" 2>/dev/null |
                          cut -d= -f2 |
                          tr -d "'" ||
                          echo "Unknown")"

                  printf "Revision: %s\n" \
                      "$(grep DISTRIB_REVISION "$rel" 2>/dev/null |
                          cut -d= -f2 |
                          tr -d "'" ||
                          echo "Unknown")"

                  printf "Kernel: %s\n" \
                      "$(uname -r)"

                  printf "Date: %s\n" \
                      "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

              } > "$1"
          }


          verify_firmware_info()
          {
              local backup_arch

              [ -f "firmware.info" ] || return 0

              backup_arch="$(
                  grep '^Architecture:' firmware.info |
                  cut -d' ' -f2-
              )"

              [ "$backup_arch" = "$(uname -m)" ] || \
                  fail_restore_preflight \
          "Architecture mismatch (Backup: $backup_arch, System: $(uname -m))" \
                      8
          }


          # ============================================================
          # Package Compatibility
          # ============================================================

          verify_packages()
          {
              local pkg

              #
              # Current system must have the minimum required dependencies.
              #
              for pkg in $MIN_REQUIRED_PACKAGES; do

                  package_installed "$pkg" || \
                      fail_restore_preflight \
          "Missing required dependency: $pkg" \
                          8

              done

              #
              # Historical package information is informational.
              #
              [ -f "packages.txt" ] || return 0

              awk '
                  /\[REQUIRED\]/ {
                      m=1
                      next
                  }

                  /^\[/ {
                      m=0
                  }

                  m && NF {
                      print $1
                  }
              ' packages.txt |
              while IFS= read -r pkg; do

                  package_installed "$pkg" || \
                      printf \
          "  [WARN] Missing historical package: %s\n" \
                          "$pkg"

              done
          }


          # ============================================================
          # Manifest Parsing
          # ============================================================

          read_manifest()
          {
              awk '
                  /^[[:space:]]*#/ {
                      next
                  }

                  NF == 0 {
                      next
                  }

                  $1 ~ /^\// {
                      print $1
                  }
              ' manifest.txt > "$WORK/manifest.raw" || \
                  fail_restore_preflight "Manifest parse error" 5

              #
              # Duplicate detection BEFORE sorting unique.
              #
              sort "$WORK/manifest.raw" |
                  uniq -d > "$WORK/dups"

              if [ -s "$WORK/dups" ]; then
                  fail_restore_preflight \
          "Manifest duplicate entries: $(cat "$WORK/dups")" \
                      5
              fi

              sort -u "$WORK/manifest.raw" > "$WORK/manifest.parsed"

              [ -s "$WORK/manifest.parsed" ] || \
                  fail_restore_preflight "Manifest empty" 5
          }


          # ============================================================
          # Manifest Security Verification
          # ============================================================

          verify_manifest()
          {
              local f

              while IFS= read -r f; do

                  validate_path "$f" || \
                      fail_restore_preflight \
          "Path outside restore whitelist: $f" \
                          5

                  [ -f "files$f" ] || \
                      fail_restore_preflight \
          "Missing archive file for manifest entry: $f" \
                          5

              done < "$WORK/manifest.parsed"
          }


          # ============================================================
          # Safety Snapshot
          # ============================================================

          restore_safety()
          {
              local f

              safe_rm "$SAFETY"

              mkdir -p "$SAFETY/files" || \
                  fail_restore_preflight "Safety directory creation failed" 1

              : > "$SAFETY/state.txt" || \
                  fail_restore_preflight "Safety state creation failed" 1

              while IFS= read -r f; do

                  if [ -f "$f" ]; then

                      mkdir -p "$(dirname "$SAFETY/files$f")" || \
                          fail_restore_preflight \
          "Safety directory creation failed: $f" \
                              1

                      cp -p "$f" "$SAFETY/files$f" || \
                          fail_restore_preflight \
          "Safety snapshot failed: $f" \
                              1

                      printf "EXIST %s\n" "$f" \
                          >> "$SAFETY/state.txt"

                  elif [ -e "$f" ]; then

                      fail_restore_preflight \
          "INVALID STATE: $f is not a regular file" \
                          7

                  else

                      printf "MISSING %s\n" "$f" \
                          >> "$SAFETY/state.txt"

                  fi

              done < "$WORK/manifest.parsed"
          }


          # ============================================================
          # Emergency Rollback
          # ============================================================

          restore_safety_back()
          {
              local status=0
              local state
              local f
              local tmp

              [ -f "$SAFETY/state.txt" ] || return 1

              while IFS=' ' read -r state f; do

                  case "$state" in

                      EXIST)

                          if [ ! -f "$SAFETY/files$f" ]; then

                              printf \
          "CRITICAL: Safety snapshot missing for %s\n" \
                                  "$f" >&2

                              status=1
                              continue
                          fi

                          mkdir -p "$(dirname "$f")" || {

                              printf \
          "CRITICAL: Rollback directory creation failed for %s\n" \
                                  "$f" >&2

                              status=1
                              continue
                          }

                          tmp="${f}.ib-tmp"

                          rm -f "$tmp"

                          if ! cp -p "$SAFETY/files$f" "$tmp" ||
                             ! mv -f "$tmp" "$f"; then

                              printf \
          "CRITICAL: Rollback failed for %s\n" \
                                  "$f" >&2

                              rm -f "$tmp"

                              status=1
                          fi
                          ;;

                      MISSING)

                          if [ -e "$f" ] && ! rm -f "$f"; then

                              printf \
          "CRITICAL: Failed to remove restored file %s\n" \
                                  "$f" >&2

                              status=1
                          fi
                          ;;

                      *)
                          printf \
          "CRITICAL: Invalid safety state: %s %s\n" \
                              "$state" "$f" >&2

                          status=1
                          ;;

                  esac

              done < "$SAFETY/state.txt"

              [ "$status" -eq 0 ]
          }


          # ============================================================
          # Post-Restore Verification
          # ============================================================

          verify_restored()
          {
              local f
              local hash_src
              local hash_dst

              while IFS= read -r f; do

                  if [ ! -f "$f" ]; then

                      printf \
          "ERROR: Restored file missing: %s\n" \
                          "$f" >&2

                      return 1
                  fi

                  hash_src="$(
                      sha256sum "files$f" |
                      cut -d' ' -f1
                  )" || return 1

                  hash_dst="$(
                      sha256sum "$f" |
                      cut -d' ' -f1
                  )" || return 1

                  if [ "$hash_src" != "$hash_dst" ]; then

                      printf \
          "ERROR: Restored checksum mismatch: %s\n" \
                          "$f" >&2

                      return 1
                  fi

              done < "$WORK/manifest.parsed"

              return 0
          }


          # ============================================================
          # Target File Collection
          # ============================================================

          get_target_files()
          {
              local list=""
              local f

              #
              # Required files.
              #
              for f in $REQUIRED_FILES; do

                  [ -f "$f" ] || \
                      fail "Missing REQUIRED file: $f" 3

                  list="$list $f"

              done

              #
              # Optional files.
              #
              for f in $OPTIONAL_FILES; do

                  if [ -f "$f" ]; then

                      list="$list $f"

                  else

                      printf \
          "INFO: Optional file missing, skipping: %s\n" \
                          "$f" >&2

                  fi

              done

              echo "$list"
          }


          # ============================================================
          # BACKUP
          # ============================================================

          backup()
          {
              trap trap_backup INT TERM HUP

              local target_files
              local count=0
              local f

              target_files="$(get_target_files)"

              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"

              rm -f -- "$BACKUP.tmp"

              mkdir -p "$WORK/files" || \
                  fail_backup "Workspace creation failed" 1

              #
              # Copy target files while preserving their absolute hierarchy.
              #
              for f in $target_files; do

                  mkdir -p "$(dirname "$WORK/files$f")" || \
                      fail_backup \
          "Directory creation failed: $f" \
                          1

                  cp -p "$f" "$WORK/files$f" || \
                      fail_backup \
          "Copy failed: $f" \
                          1

                  count=$((count + 1))

              done

              cd "$WORK" || \
                  fail_backup "Workspace cd failed" 1


              # --------------------------------------------------------
              # Manifest
              # --------------------------------------------------------

              {
                  printf "# ImmWrt Backup Manifest\n"
                  printf "# Tool-Version: %s\n" "$VERSION"
                  printf "# Date: %s\n" \
                      "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

                  for f in $target_files; do
                      printf "%s\n" "$f"
                  done

              } > manifest.txt || \
                  fail_backup "Manifest creation failed" 1


              # --------------------------------------------------------
              # SHA256
              # --------------------------------------------------------

              : > checksum.sha256 || \
                  fail_backup "Checksum file creation failed" 4

              for f in $target_files; do

                  sha256sum "files$f" >> checksum.sha256 || \
                      fail_backup \
          "Checksum calculation failed: $f" \
                          4

              done


              # --------------------------------------------------------
              # Package Metadata
              # --------------------------------------------------------

              {
                  printf "[REQUIRED]\n"

                  for f in $MIN_REQUIRED_PACKAGES; do
                      printf "%s\n" "$f"
                  done

              } > packages.txt || \
                  fail_backup "Package metadata creation failed" 1


              # --------------------------------------------------------
              # Firmware Metadata
              # --------------------------------------------------------

              create_firmware_info "firmware.info"


              # --------------------------------------------------------
              # Create Archive
              # --------------------------------------------------------

              tar -czf "$BACKUP.tmp" \
                  files \
                  manifest.txt \
                  checksum.sha256 \
                  packages.txt \
                  firmware.info || \
                  fail_backup "Tar compression failed" 1


              # --------------------------------------------------------
              # Basic Archive Integrity
              # --------------------------------------------------------

              gzip -t "$BACKUP.tmp" || \
                  fail_backup \
          "Gzip integrity test failed" \
                      4

              tar -tzf "$BACKUP.tmp" >/dev/null || \
                  fail_backup \
          "Tar header integrity test failed" \
                      4


              # --------------------------------------------------------
              # Secondary Extract + SHA256 Verification
              # --------------------------------------------------------

              mkdir -p "$VERIFY_TEST" || \
                  fail_backup \
          "Verification workspace creation failed" \
                      4

              tar -xzf "$BACKUP.tmp" -C "$VERIFY_TEST" || \
                  fail_backup \
          "Secondary extraction failed" \
                      4

              (
                  cd "$VERIFY_TEST" || exit 1

                  sha256sum -c checksum.sha256 \
                      >/dev/null 2>&1
              ) || {

                  safe_rm "$VERIFY_TEST"

                  fail_backup \
          "Secondary extraction checksum verification failed" \
                      4
              }


              safe_rm "$VERIFY_TEST"


              # --------------------------------------------------------
              # Hardened Archive Security Verification
              # --------------------------------------------------------

              verify_archive_members "$BACKUP.tmp" || \
                  fail_backup \
          "Archive member security verification failed" \
                      5


              # --------------------------------------------------------
              # Final Atomic Backup Replacement
              # --------------------------------------------------------

              mv "$BACKUP.tmp" "$BACKUP" || \
                  fail_backup \
          "Atomic replacement of backup failed" \
                      1


              safe_rm "$WORK"

              trap - INT TERM HUP

              printf \
          "\nBackup completed successfully. (%d files)\n" \
                  "$count"
          }


          # ============================================================
          # RESTORE
          # ============================================================

          restore()
          {
              local count=0
              local f
              local tmp

              [ -f "$BACKUP" ] || \
                  fail \
          "Backup not found at $BACKUP" \
                      5


              # --------------------------------------------------------
              # Preflight: Archive
              # --------------------------------------------------------

              gzip -t "$BACKUP" || \
                  fail_restore_preflight \
          "Archive gzip corrupted" \
                      5

              verify_archive_members "$BACKUP" || \
                  fail_restore_preflight \
          "Archive member security verification failed" \
                      5


              # --------------------------------------------------------
              # Workspace
              # --------------------------------------------------------

              safe_rm "$WORK"

              mkdir -p "$WORK" || \
                  fail_restore_preflight \
          "Workspace creation failed" \
                      5

              tar -xzf "$BACKUP" -C "$WORK" || \
                  fail_restore_preflight \
          "Archive extraction failed" \
                      5

              cd "$WORK" || \
                  fail_restore_preflight \
          "Workspace cd failed" \
                      5


              # --------------------------------------------------------
              # Required Archive Metadata
              # --------------------------------------------------------

              [ -f "manifest.txt" ] || \
                  fail_restore_preflight \
          "Manifest missing" \
                      5

              [ -f "checksum.sha256" ] || \
                  fail_restore_preflight \
          "Checksum manifest missing" \
                      5


              # --------------------------------------------------------
              # Manifest Validation
              # --------------------------------------------------------

              read_manifest

              verify_manifest

              verify_archive_exact "$BACKUP" || \
                  fail_restore_preflight \
          "Archive exact verification failed" \
                      5


              # --------------------------------------------------------
              # Archive SHA256 Validation
              # --------------------------------------------------------

              sha256sum -c checksum.sha256 \
                  >/dev/null 2>&1 || \
                  fail_restore_preflight \
          "Archive checksum verification failed" \
                      5


              # --------------------------------------------------------
              # Firmware / Package Compatibility
              # --------------------------------------------------------

              verify_firmware_info

              verify_packages


              # --------------------------------------------------------
              # Create Safety Snapshot
              #
              # Nothing has been modified yet.
              # --------------------------------------------------------

              restore_safety


              #
              # From this point onward, interruption triggers rollback.
              #
              trap trap_restore INT TERM HUP


              # --------------------------------------------------------
              # Atomic Restore
              # --------------------------------------------------------

              while IFS= read -r f; do

                  mkdir -p "$(dirname "$f")" || {

                      if restore_safety_back; then

                          fail \
          "Directory creation failed for $f. Rollback successful." \
                              6

                      else

                          printf \
          "CRITICAL: Rollback failed!\n" >&2

                          printf \
          "CRITICAL: Safety snapshot preserved at %s\n" \
                              "$SAFETY" >&2

                          exit 6
                      fi
                  }


                  tmp="${f}.ib-tmp"

                  rm -f "$tmp"


                  #
                  # Copy to temporary file first,
                  # then atomically replace target.
                  #
                  if ! cp -p "files$f" "$tmp" ||
                     ! mv -f "$tmp" "$f"; then

                      rm -f "$tmp"

                      if restore_safety_back; then

                          fail \
          "Atomic replacement failed for $f. Rollback successful." \
                              6

                      else

                          printf \
          "CRITICAL: Atomic replacement and rollback failed!\n" \
                              >&2

                          printf \
          "CRITICAL: Safety snapshot preserved at %s\n" \
                              "$SAFETY" >&2

                          exit 6
                      fi
                  fi


                  count=$((count + 1))

              done < "$WORK/manifest.parsed"


              # --------------------------------------------------------
              # Post-Restore Verification
              # --------------------------------------------------------

              if ! verify_restored; then

                  if restore_safety_back; then

                      fail \
          "Post-restore verification failed. Rollback successful." \
                          6

                  else

                      printf \
          "CRITICAL: Post-restore verification AND rollback failed!\n" \
                          >&2

                      printf \
          "CRITICAL: Safety snapshot preserved at %s\n" \
                              "$SAFETY" >&2

                          exit 6
                  fi
              fi


              # --------------------------------------------------------
              # Restore Complete
              # --------------------------------------------------------

              safe_rm "$SAFETY"
              safe_rm "$WORK"

              trap - INT TERM HUP

              printf \
          "Restore completed successfully. (%d files)\n" \
                  "$count"

              exit 0
          }


          # ============================================================
          # VERIFY
          # ============================================================

          verify_cmd()
          {
              [ -f "$BACKUP" ] || \
                  fail \
          "Backup not found at $BACKUP" \
                      5


              # --------------------------------------------------------
              # Archive Integrity
              # --------------------------------------------------------

              gzip -t "$BACKUP" || \
                  fail \
          "Archive gzip corrupted" \
                      5

              verify_archive_members "$BACKUP" || \
                  fail \
          "Archive member security verification failed" \
                      5

              tar -tzf "$BACKUP" >/dev/null || \
                  fail \
          "Archive tar headers corrupted" \
                      4


              # --------------------------------------------------------
              # Extract
              # --------------------------------------------------------

              safe_rm "$WORK"

              mkdir -p "$WORK" || \
                  fail_verify \
          "Verification workspace creation failed" \
                      5

              tar -xzf "$BACKUP" -C "$WORK" || \
                  fail_verify \
          "Archive extraction failed" \
                      5

              cd "$WORK" || \
                  fail_verify \
          "Workspace cd failed" \
                      5


              # --------------------------------------------------------
              # Metadata
              # --------------------------------------------------------

              [ -f "manifest.txt" ] || \
                  fail_verify \
          "Manifest missing" \
                      5

              [ -f "checksum.sha256" ] || \
                  fail_verify \
          "Checksum manifest missing" \
                      5


              # --------------------------------------------------------
              # Manifest
              # --------------------------------------------------------

              read_manifest

              verify_manifest

              verify_archive_exact "$BACKUP" || \
                  fail_verify \
          "Archive exact verification failed" \
                      5


              # --------------------------------------------------------
              # SHA256
              # --------------------------------------------------------

              sha256sum -c checksum.sha256 \
                  >/dev/null 2>&1 || \
                  fail_verify \
          "Checksum verification failed" \
                      5


              # --------------------------------------------------------
              # Compatibility
              # --------------------------------------------------------

              verify_firmware_info

              verify_packages


              # --------------------------------------------------------
              # Cleanup
              # --------------------------------------------------------

              safe_rm "$WORK"

              printf \
          "VERIFY SUCCESS: Archive is intact, complete, and compatible.\n"

              exit 0
          }


          # ============================================================
          # INFO
          # ============================================================

          info_cmd()
          {
              [ -f "$BACKUP" ] || \
                  fail \
          "Backup not found at $BACKUP" \
                      5


              gzip -t "$BACKUP" || \
                  fail \
          "Archive gzip corrupted" \
                      5

              verify_archive_members "$BACKUP" || \
                  fail \
          "Archive member security verification failed" \
                      5


              safe_rm "$WORK"

              mkdir -p "$WORK" || \
                  fail \
          "Info workspace creation failed" \
                      5


              #
              # Extract only firmware metadata.
              #
              tar -xzf "$BACKUP" \
                  -C "$WORK" \
                  firmware.info \
                  2>/dev/null


              if [ -f "$WORK/firmware.info" ]; then

                  cat "$WORK/firmware.info"

              else

                  printf \
          "Firmware Info: Legacy archive format (no firmware.info)\n"

              fi


              safe_rm "$WORK"

              exit 0
          }


          # ============================================================
          # CLI Dispatcher
          # ============================================================

          case "$1" in

              b|backup)

                  check_root
                  backup
                  ;;


              r|restore)

                  check_root
                  restore
                  ;;


              v|verify)

                  check_root
                  verify_cmd
                  ;;


              i|info)

                  info_cmd
                  ;;


              ver|version)

                  printf "ib v%s\n" "$VERSION"
                  exit 0
                  ;;


              *)

                  usage
                  ;;

          esac
          EOF
          chmod 755 openwrt/package/base-files/files/usr/bin/ib
          
      - name: Generate Cache Variables
        id: var
        run: echo "dl_key=dl-v8.0.3-${{ hashFiles('feeds.snapshot.txt') }}-$(sha256sum toolchain.info | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Restore Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
          key: ${{ steps.var.outputs.dl_key }}
          restore-keys: |
            dl-v8.0.3-
            dl-v8.0.2-
            dl-v8.0.1-
            dl-
            
      - name: Generate Core Config
        run: |
          set -euo pipefail
          cd openwrt
          {
            echo "CONFIG_TARGET_x86=y"
            echo "CONFIG_TARGET_x86_64=y"
            echo "CONFIG_TARGET_x86_64_DEVICE_generic=y"
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1536"
            echo "CONFIG_TARGET_IMAGES_GZIP=y"
            echo "CONFIG_PACKAGE_luci-app-passwall=y"
            echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y"
            echo "CONFIG_PACKAGE_xray-core=y"
            echo "CONFIG_PACKAGE_sing-box=y"
            echo "CONFIG_PACKAGE_geoview=y"
            echo "CONFIG_PACKAGE_ca-bundle=y"
            echo "CONFIG_PACKAGE_ca-certificates=y"
            echo "CONFIG_PACKAGE_smartdns=y"
            echo "CONFIG_PACKAGE_luci-app-smartdns=y"
            echo "CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-app-ddns=y"
            echo "CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y"
            echo "CONFIG_PACKAGE_ddns-scripts-cloudflare=y"
            echo "CONFIG_PACKAGE_luci-app-upnp=y"
            echo "CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-light=y"
            echo "CONFIG_PACKAGE_luci-theme-argon=y"
            echo "CONFIG_PACKAGE_luci-app-argon-config=y"
            echo "CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y"
            echo "CONFIG_PACKAGE_qemu-ga=y"
            echo "CONFIG_PACKAGE_irqbalance=y"
            echo "CONFIG_PACKAGE_kmod-wireguard=y"
            echo "CONFIG_PACKAGE_wireguard-tools=y"
            echo "CONFIG_PACKAGE_luci-proto-wireguard=y"
            echo "CONFIG_PACKAGE_luci-proto-wireguard=y"
            echo "CONFIG_PACKAGE_luci-app-ttyd=y"
            echo "CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-app-advanced-reboot=y"
            echo "CONFIG_PACKAGE_luci-i18n-advanced-reboot-zh-cn=y"
            echo "CONFIG_PACKAGE_htop=y"
            echo "CONFIG_PACKAGE_ethtool=y"
            echo "CONFIG_PACKAGE_nano=y"
            echo "CONFIG_PACKAGE_curl=y"
            echo "CONFIG_PACKAGE_wget-ssl=y"
            echo "CONFIG_PACKAGE_unzip=y"
            echo "CONFIG_PACKAGE_kmod-tcp-bbr=y"
            echo "CONFIG_PACKAGE_kmod-virtio-net=y"
            echo "CONFIG_PACKAGE_kmod-virtio-blk=y"
            echo "CONFIG_PACKAGE_kmod-nft-offload=y"
            echo "CONFIG_PACKAGE_block-mount=n"
            echo "CONFIG_PACKAGE_luci-app-fstab=n"
            echo "CONFIG_PACKAGE_luci-app-plugins=n"
            echo "# CONFIG_CCACHE is not set"
          } > .config
          make defconfig && ./scripts/diffconfig.sh > ../logs_diffconfig.txt
          gzip -9f -c .config > ../logs_full.config.gz
          
      - name: Build Firmware
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          cd openwrt
          
          # 提取最新 component commit timestamp 作為基準 (與 Snapshot 統一，最高精度)
          IMM_DATE=$(git log -1 --format=%ct)
          PW_DATE=$(git -C package/openwrt-passwall log -1 --format=%ct 2>/dev/null || echo "$IMM_DATE")
          PWP_DATE=$(git -C package/openwrt-passwall-packages log -1 --format=%ct 2>/dev/null || echo "$IMM_DATE")
          export SOURCE_DATE_EPOCH=$(printf "%s\n%s\n%s" "$IMM_DATE" "$PW_DATE" "$PWP_DATE" | sort -n | tail -1)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> ../toolchain.info
          
          # ==========================================
          # 📡 啟動 SRE 駕駛艙雷達
          # ==========================================
          MONITOR_PID=""
          cleanup_monitor() {
            echo "🧹 關閉駕駛艙雷達..."
            [ -n "$MONITOR_PID" ] && kill "$MONITOR_PID" 2>/dev/null || true
            jobs -p | xargs -r kill -9 2>/dev/null || true
          }
          trap cleanup_monitor EXIT INT TERM
          
          (
            echo "📡 BUILD MONITOR START"
            while true; do
              LOAD=$(uptime | awk -F'load average:' '{print $2}' | xargs)
              MEM=$(free -m | awk '/Mem:/ {printf "%d/%dMB | %.0f%%", $3, $2, ($3/$2)*100}')
              DISK=$(df -h / | awk 'NR==2 {print $5}')
              echo "[MONITOR]  $LOAD | $MEM | DISK: $DISK"
              sleep 120 || true
            done
          ) &
          MONITOR_PID=$!
          # ==========================================
          
          echo "▶️ [Step] Downloading package dependencies (this may take a while)..."
          retry bash -c 'timeout 30m make download -j$(nproc) V=s'
          
          FAST_BUILD_STATUS="SUCCESS"
          echo "▶️ [Step] Starting main compilation..."
          if ! make -j$(nproc) 2>&1 | tee >(gzip -1 -c > ../logs_build.log.gz); then
            FAST_BUILD_STATUS="FAILED (Fallback to Debug)"
            echo "FAST_BUILD_FAILED=true" > ../build-status.txt
            rm -rf tmp build_dir/hostpkg staging_dir/hostpkg
            make -j1 V=s 2>&1 | tee >(gzip -1 -c > ../logs_build_debug.log.gz) || exit 1
          fi
          echo "FAST_BUILD_STATUS=$FAST_BUILD_STATUS" >> ../build-status.txt
          
      - name: Save Cache
        uses: actions/cache/save@v4
        if: success() && !cancelled()
        with:
          path: |
            openwrt/dl
          key: ${{ steps.var.outputs.dl_key }}

      - name: Validate & Final Packaging
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          TARGET_DIR="openwrt/bin/targets/x86/64"
          mkdir -p release_assets
          
          [ -d "$TARGET_DIR" ] || exit 1
          cd "$TARGET_DIR"
          sha256sum --ignore-missing -c sha256sums || exit 1
          find . -name "*combined*.img.gz" -exec install -m644 {} "$ROOT/release_assets/" \;
          install -m644 sha256sums "$ROOT/release_assets/sha256sums"
          
          cd "$ROOT"
          [ -z "$(find release_assets -type f -name "*combined*.img.gz")" ] && { echo "Firmware missing!"; exit 1; }
          
          find openwrt/bin/targets/x86/64 -name "*.manifest" -exec sh -c 'echo "=== $(basename "$1") ==="; cat "$1"; echo' _ {} \; > release_assets/installed-packages.txt
          [ -s release_assets/installed-packages.txt ] || rm -f release_assets/installed-packages.txt
          
          find openwrt/bin/packages -name "*.apk" | sort > release_assets/apk-list.txt
          [ -s release_assets/apk-list.txt ] || rm -f release_assets/apk-list.txt
          
          # 🚀 防禦性 find：免疫目錄結構變更，提取最終產物之真實指紋
          OW_RELEASE=$(find openwrt/build_dir -name openwrt_release -path "*/etc/openwrt_release" -print -quit 2>/dev/null || true)
          if [ -n "$OW_RELEASE" ] && [ -f "$OW_RELEASE" ]; then
            OW_REV=$(grep DISTRIB_REVISION "$OW_RELEASE" | head -n 1 | cut -d= -f2 | tr -d "'" || echo "unknown")
          else
            OW_REV="unknown"
          fi
          [ -z "$OW_REV" ] && OW_REV="unknown"
          
          cat << EOF > release_assets/build-info.txt
          Build Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          Branch: v25.12.1-LTS
          OpenWrt Version: $OW_REV
          Workflow Run ID: ${{ github.run_id }}
          Runner OS: ${{ runner.os }}
          Runner Image OS: ${ImageOS:-unknown}
          Runner Image Version: ${ImageVersion:-unknown}
          Runner Arch: $(uname -m)
          Kernel: $(uname -r)
          CPU: $(nproc) cores
          Memory: $(free -h | awk '/Mem:/ {print $2}')
          SOURCE_DATE_EPOCH: $(grep SOURCE_DATE_EPOCH toolchain.info | cut -d= -f2 || echo unknown)
          ImmortalWrt Commit: $(git -C openwrt rev-parse HEAD 2>/dev/null || echo unknown)
          PassWall Commit: $(git -C openwrt/package/openwrt-passwall rev-parse HEAD 2>/dev/null || echo unknown)
          PassWall Packages Commit: $(git -C openwrt/package/openwrt-passwall-packages rev-parse HEAD 2>/dev/null || echo unknown)
          Fast Build Status: $(cat build-status.txt 2>/dev/null || echo "UNKNOWN")
          EOF
          
          [ -s feeds.snapshot.txt ] && install -m644 feeds.snapshot.txt release_assets/feeds.snapshot
          [ -s toolchain.info ] && install -m644 toolchain.info release_assets/toolchain.info
          [ -s logs_full.config.gz ] && install -m644 logs_full.config.gz release_assets/full.config.gz
          [ -s logs_diffconfig.txt ] && install -m644 logs_diffconfig.txt release_assets/diffconfig.txt
          [ -s build-status.txt ] && install -m644 build-status.txt release_assets/
          [ -s logs_build.log.gz ] && install -m644 logs_build.log.gz release_assets/
          [ -s logs_build_debug.log.gz ] && install -m644 logs_build_debug.log.gz release_assets/
          [ -s /tmp/retry_history.log ] && install -m644 /tmp/retry_history.log release_assets/
          [ -s /tmp/retry_debug.log ] && gzip -9 -c /tmp/retry_debug.log > release_assets/retry_debug.log.gz || true
          
          find release_assets -type f -empty -print -delete
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0.3-LTS-b${{ github.run_number }}-${{ steps.meta.outputs.date }}
          name: ImmWrt v8.0.3-LTS (TSAR BOMBA SEALED)
          body: |
            ### 🔒 v8.0.3-LTS TSAR BOMBA SEALED
            - **備份引擎升級**：[v8.0.3] 原生備份工具 `ib` 推進至 `v1.8` 黃金基準垂直排版版，具備雙向 Manifest 校驗、No-Subshell 安全防禦與原子回滾。
            - **網路核心擴展**：[v8.0.3] 系統核心編譯層級精準嵌入 `wireguard-tools` 與 `luci-proto-wireguard`，原生支援 WireGuard 隧道。
            - **套件依賴修正**：確保 `luci-app-upnp` 與 `luci-app-advanced-reboot` 正常編譯並寫入依賴清單。
            - **JSON 韌性升級**：增強 `jq` 解析，遇到殘缺前端選單檔案優雅跳過，防止 Pipeline 假性中斷。
            - **沙皇級空間釋放**：抹除 GitHub runner 深層工具包，為韌體封裝騰出極限實體空間。
            - **自癒架構 (Adaptive LTS)**：容忍上游漂移，實現 Hash 動態修復。
            - **進程安全**：引入 `xargs -r kill -9` 確保 CI 環境絕對無殭屍進程殘留。
            - **全域可觀測性**：SRE 雷達即時回傳負載與磁碟空間，完整封裝 SBOM、安裝清單與 Runner 指紋考古履歷。
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
