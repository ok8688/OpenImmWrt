name: Build ImmWrt v8.0.0-LTS

on:
  workflow_dispatch:
  schedule:
    - cron: '26 14 * * 0,4'

concurrency:
  group: immwrt-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Generate Metadata
        id: meta
        run: echo "date=$(date +%Y%m%d || echo unknown)" >> $GITHUB_OUTPUT
      - name: Inject SRE Core Utilities
        run: |
          cat << 'EOF' > /tmp/sre_utils.sh
          #!/bin/bash
          set -o pipefail
          retry() {
            touch /tmp/retry_history.log /tmp/retry_debug.log
            local max=5; local delay=2; local n=1
            local cmd_name="$(printf '%q ' "$@")"
            while true; do
              if "$@" >> /tmp/retry_debug.log 2>&1; then echo "✅ Success!"; break
              else if [[ $n -lt $max ]]; then echo "⚠️ [FAIL] Attempt $n: $cmd_name" >> /tmp/retry_history.log; ((n++)); delay=$((delay * 2 + RANDOM % 3)); sleep $delay
              else echo "❌ FATAL: Failed after $max retries"; return 1; fi; fi
            done
          }
          EOF
          chmod +x /tmp/sre_utils.sh
      - name: Init SRE Environment & Space Cleanup
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/lib/node_modules /opt/hostedtoolcache /usr/local/share/powershell /usr/share/rust /opt/microsoft /usr/local/share/edge_driver /usr/local/.ghcup /usr/share/miniconda /opt/az /usr/local/share/boost /usr/local/share/chromium /usr/local/lib/heroku || true
          sudo docker system prune -af || true
          sudo apt-get update -qq && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget jq golang-go ccache
          sudo swapoff -a || true; sudo fallocate -l 4G /swapfile; sudo chmod 600 /swapfile; sudo mkswap /swapfile; sudo swapon /swapfile
      - name: Clone & Official PassWall Main Source
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          retry bash -c 'rm -rf openwrt && timeout 20m git clone -b v25.12.1 --single-branch --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt'
          cd openwrt
          retry timeout 35m ./scripts/feeds update -a
          ./scripts/feeds uninstall luci-app-passwall xray-core sing-box luci-app-upnp luci-app-advanced-reboot luci-app-fstab luci-app-plugins || true
          rm -rf feeds/luci/applications/luci-app-passwall feeds/packages/net/xray-core feeds/packages/net/sing-box feeds/luci/applications/luci-app-fstab feeds/luci/applications/luci-app-plugins
          retry git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages
          retry git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall
          retry bash -c 'set -o pipefail; timeout 35m ./scripts/feeds install -a -f'
      - name: Scaffold ImmWrt Backup Package
        run: |
          set -euo pipefail
          PKG_DIR="openwrt/package/immwrt-backup"
          BIN_DIR="$PKG_DIR/files/usr/bin"
          mkdir -p "$BIN_DIR"
          cat << 'EOF' > "$BIN_DIR/ib"
#!/bin/sh
VERSION="1.0"
BACKUP="/root/immwrt-backup-latest.tar.gz"
WORK="/tmp/ib-work"
SAFETY="/tmp/ib-safety"
FILES="/etc/config/Argon /etc/config/ddns /etc/config/dhcp /etc/config/firewall /etc/config/luci /etc/config/network /etc/config/passwall /etc/config/passwall_server /etc/config/smartdns /etc/config/system /etc/config/upnpd /usr/share/passwall/rules/direct_host /usr/share/passwall/rules/direct_ip /usr/share/passwall/rules/proxy_host /usr/share/passwall/rules/proxy_ip /etc/crontabs/root"
fail(){ echo "FAILED: $1"; exit "$2"; }
fail_backup(){ rm -f "$BACKUP.tmp"; safe_rm "$WORK"; fail "$1" "$2"; }
fail_restore(){ safe_rm "$WORK"; safe_rm "$SAFETY"; fail "$1" "$2"; }
safe_rm(){ case "$1" in /tmp/ib-work|/tmp/ib-safety) rm -rf "$1" ;; *) fail "safe_rm aborted" 1 ;; esac; }
check_root(){ [ "$(id -u)" = "0" ] || fail "root required" 1; }
check_files(){ for f in $FILES; do [ -f "$f" ] || fail "missing file: $f" 3; done; }
create_manifest(){ : > "$1"; for f in $FILES; do echo "$f" >> "$1"; done; }
create_checksum(){ : > "$1"; for f in $FILES; do sha256sum "files$f" >> "$1" || fail_backup "checksum build failed" 4; done; }
verify_manifest(){ expected="$WORK/manifest.expected"; create_manifest "$expected"; cmp "$expected" manifest.txt || fail_restore "manifest mismatch" 5; rm -f "$expected"; }
verify_checksum(){ sha256sum -c checksum.sha256 >/dev/null 2>&1 || fail_restore "checksum mismatch" 5; }
verify_restored(){ for f in $FILES; do [ -f "$f" ] || return 1; hash_src=$(sha256sum "files$f" | cut -d' ' -f1); hash_dst=$(sha256sum "$f" | cut -d' ' -f1); [ "$hash_src" != "$hash_dst" ] && return 1; done; return 0; }
restore_safety(){ safe_rm "$SAFETY"; mkdir -p "$SAFETY/files"; : > "$SAFETY/state.txt"; for f in $FILES; do if [ -f "$f" ]; then mkdir -p "$(dirname "$SAFETY/files$f")"; cp "$f" "$SAFETY/files$f" || fail_restore "safety copy failed" 1; echo "EXIST $f" >> "$SAFETY/state.txt"; elif [ -e "$f" ]; then fail_restore "INVALID STATE: $f is not file" 7; else echo "MISSING $f" >> "$SAFETY/state.txt"; fi; done; }
restore_safety_back(){ status=0; while read -r state f; do if [ "$state" = "EXIST" ]; then rm -rf "$f"; cp "$SAFETY/files$f" "$f" || { echo "CRITICAL: restore failed"; status=1; }; elif [ "$state" = "MISSING" ]; then rm -rf "$f"; fi; done < "$SAFETY/state.txt"; [ "$status" -eq 1 ] && { echo "CRITICAL: Rollback incomplete."; return 1; }; return 0; }
backup(){ check_files; safe_rm "$WORK"; rm -f "$BACKUP.tmp"; mkdir -p "$WORK/files"; for f in $FILES; do mkdir -p "$(dirname "$WORK/files$f")"; cp "$f" "$WORK/files$f" || fail_backup "copy failed" 1; done; cd "$WORK" || fail_backup "cd failed" 1; create_manifest "manifest.txt"; create_checksum "checksum.sha256"; tar -czf "$BACKUP.tmp" files manifest.txt checksum.sha256 || fail_backup "tar failed" 1; tar -tzf "$BACKUP.tmp" >/dev/null || fail_backup "verify failed" 4; mv "$BACKUP.tmp" "$BACKUP"; safe_rm "$WORK"; echo "Backup completed"; }
reload_services(){ /etc/init.d/network restart; /etc/init.d/firewall reload; /etc/init.d/smartdns restart; /etc/init.d/passwall restart; }
restore(){ [ -f "$BACKUP" ] || fail "not found" 5; safe_rm "$WORK"; mkdir -p "$WORK"; tar -xzf "$BACKUP" -C "$WORK" || fail_restore "extract failed" 5; cd "$WORK" || fail_restore "cd failed" 5; verify_manifest; verify_checksum; restore_safety; for f in $FILES; do mkdir -p "$(dirname "$f")"; rm -rf "$f"; cp "files$f" "$f" || { ! restore_safety_back && fail_restore "rollback failed" 6 || fail_restore "rollback success" 6; }; done; ! verify_restored && { ! restore_safety_back && fail_restore "verify failed - rollback failed" 6 || fail_restore "verify failed - rollback success" 6; }; reload_services; safe_rm "$SAFETY"; safe_rm "$WORK"; echo "Restore completed"; }
case "$1" in b) check_root; backup ;; r) check_root; restore ;; *) echo "Usage: ib {b|r}"; exit 2 ;; esac
EOF
          chmod +x "$BIN_DIR/ib"
          cat << 'EOF' > "$PKG_DIR/Makefile"
include $(TOPDIR)/rules.mk
PKG_NAME:=immwrt-backup
PKG_VERSION:=1.0
PKG_RELEASE:=1
include $(INCLUDE_DIR)/package.mk
define Package/immwrt-backup
  SECTION:=utils
  CATEGORY:=Utilities
  TITLE:=ImmWrt Backup Specification (SEALED)
  PKGARCH:=all
endef
define Package/immwrt-backup/install
	$(INSTALL_DIR) $(1)/usr/bin
	$(INSTALL_BIN) ./files/usr/bin/ib $(1)/usr/bin/ib
endef
$(eval $(call BuildPackage,immwrt-backup))
EOF
      - name: Generate Core Config
        run: |
          set -euo pipefail
          cd openwrt
          {
            echo "CONFIG_TARGET_x86=y"; echo "CONFIG_TARGET_x86_64=y"; echo "CONFIG_TARGET_x86_64_DEVICE_generic=y"; echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1536"; echo "CONFIG_TARGET_IMAGES_GZIP=y"; echo "CONFIG_PACKAGE_immwrt-backup=y"; echo "CONFIG_PACKAGE_luci-app-passwall=y"; echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y"; echo "CONFIG_PACKAGE_xray-core=y"; echo "CONFIG_PACKAGE_sing-box=y"; echo "CONFIG_PACKAGE_geoview=y"; echo "CONFIG_PACKAGE_ca-bundle=y"; echo "CONFIG_PACKAGE_ca-certificates=y"; echo "CONFIG_PACKAGE_smartdns=y"; echo "CONFIG_PACKAGE_luci-app-smartdns=y"; echo "CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y"; echo "CONFIG_PACKAGE_luci-app-ddns=y"; echo "CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y"; echo "CONFIG_PACKAGE_ddns-scripts-cloudflare=y"; echo "CONFIG_PACKAGE_luci-app-upnp=y"; echo "CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y"; echo "CONFIG_PACKAGE_luci-light=y"; echo "CONFIG_PACKAGE_luci-theme-argon=y"; echo "CONFIG_PACKAGE_luci-app-argon-config=y"; echo "CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y"; echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y"; echo "CONFIG_PACKAGE_qemu-ga=y"; echo "CONFIG_PACKAGE_irqbalance=y"; echo "CONFIG_PACKAGE_luci-app-ttyd=y"; echo "CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y"; echo "CONFIG_PACKAGE_luci-app-advanced-reboot=y"; echo "CONFIG_PACKAGE_luci-i18n-advanced-reboot-zh-cn=y"; echo "CONFIG_PACKAGE_htop=y"; echo "CONFIG_PACKAGE_ethtool=y"; echo "CONFIG_PACKAGE_nano=y"; echo "CONFIG_PACKAGE_curl=y"; echo "CONFIG_PACKAGE_wget-ssl=y"; echo "CONFIG_PACKAGE_unzip=y"; echo "CONFIG_PACKAGE_kmod-tcp-bbr=y"; echo "CONFIG_PACKAGE_kmod-virtio-net=y"; echo "CONFIG_PACKAGE_kmod-virtio-blk=y"; echo "CONFIG_PACKAGE_kmod-nft-offload=y"; echo "CONFIG_PACKAGE_block-mount=n"; echo "CONFIG_PACKAGE_luci-app-fstab=n"; echo "CONFIG_PACKAGE_luci-app-plugins=n"; echo "# CONFIG_CCACHE is not set"
          } > .config
          make defconfig && ./scripts/diffconfig.sh > ../logs_diffconfig.txt
          gzip -9f -c .config > ../logs_full.config.gz
      - name: Build Firmware
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          cd openwrt
          IMM_DATE=$(git log -1 --format=%ct)
          PW_DATE=$(git -C package/openwrt-passwall log -1 --format=%ct 2>/dev/null || echo "$IMM_DATE")
          PWP_DATE=$(git -C package/openwrt-passwall-packages log -1 --format=%ct 2>/dev/null || echo "$IMM_DATE")
          export SOURCE_DATE_EPOCH=$(printf "%s\n%s\n%s" "$IMM_DATE" "$PW_DATE" "$PWP_DATE" | sort -n | tail -1)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> ../toolchain.info
          MONITOR_PID=""
          cleanup_monitor() { echo "🧹 關閉駕駛艙雷達..."; [ -n "$MONITOR_PID" ] && kill "$MONITOR_PID" 2>/dev/null || true; jobs -p | xargs -r kill -9 2>/dev/null || true; }
          trap cleanup_monitor EXIT INT TERM
          ( echo "📡 BUILD MONITOR START"; while true; do LOAD=$(uptime | awk -F'load average:' '{print $2}' | xargs); MEM=$(free -m | awk '/Mem:/ {printf "%d/%dMB | %.0f%%", $3, $2, ($3/$2)*100}'); DISK=$(df -h / | awk 'NR==2 {print $5}'); echo "[MONITOR] $LOAD | $MEM | DISK: $DISK"; sleep 120 || true; done ) &
          MONITOR_PID=$!
          retry bash -c 'timeout 30m make download -j$(nproc) V=s'
          FAST_BUILD_STATUS="SUCCESS"
          if ! make -j$(nproc) 2>&1 | tee >(gzip -1 -c > ../logs_build.log.gz); then
            FAST_BUILD_STATUS="FAILED (Fallback to Debug)"
            echo "FAST_BUILD_FAILED=true" > ../build-status.txt
            rm -rf tmp build_dir/hostpkg staging_dir/hostpkg
            make -j1 V=s 2>&1 | tee >(gzip -1 -c > ../logs_build_debug.log.gz) || exit 1
          fi
          echo "FAST_BUILD_STATUS=$FAST_BUILD_STATUS" >> ../build-status.txt
      - name: Save Cache
        uses: actions/cache/save@v4
        if: success() && !cancelled()
        with:
          path: |
            openwrt/dl
          key: ${{ steps.var.outputs.dl_key }}
      - name: Validate & Final Packaging
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          TARGET_DIR="openwrt/bin/targets/x86/64"
          mkdir -p release_assets
          [ -d "$TARGET_DIR" ] || exit 1
          cd "$TARGET_DIR"
          sha256sum --ignore-missing -c sha256sums || exit 1
          find . -name "*combined*.img.gz" -exec install -m644 {} "$ROOT/release_assets/" \;
          install -m644 sha256sums "$ROOT/release_assets/sha256sums"
          cd "$ROOT"
          [ -z "$(find release_assets -type f -name "*combined*.img.gz")" ] && { echo "Firmware missing!"; exit 1; }
          find openwrt/bin/targets/x86/64 -name "*.manifest" -exec sh -c 'echo "=== $(basename "$1") ==="; cat "$1"; echo' _ {} \; > release_assets/installed-packages.txt
          [ -s release_assets/installed-packages.txt ] || rm -f release_assets/installed-packages.txt
          find openwrt/bin/packages -name "*.apk" | sort > release_assets/apk-list.txt
          [ -s release_assets/apk-list.txt ] || rm -f release_assets/apk-list.txt
          OW_RELEASE=$(find openwrt/build_dir -name openwrt_release -path "*/etc/openwrt_release" -print -quit 2>/dev/null || true)
          OW_REV=$(if [ -n "$OW_RELEASE" ]; then grep DISTRIB_REVISION "$OW_RELEASE" | head -n 1 | cut -d= -f2 | tr -d "'" || echo "unknown"; else echo "unknown"; fi)
          cat << EOF > release_assets/build-info.txt
          Build Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          Branch: v25.12.1-LTS
          OpenWrt Version: $OW_REV
          Workflow Run ID: ${{ github.run_id }}
          Runner OS: ${{ runner.os }}
          Runner Image OS: ${ImageOS:-unknown}
          Runner Image Version: ${ImageVersion:-unknown}
          Runner Arch: $(uname -m)
          Kernel: $(uname -r)
          CPU: $(nproc) cores
          Memory: $(free -h | awk '/Mem:/ {print $2}')
          SOURCE_DATE_EPOCH: $(grep SOURCE_DATE_EPOCH toolchain.info | cut -d= -f2 || echo unknown)
          ImmortalWrt Commit: $(git -C openwrt rev-parse HEAD 2>/dev/null || echo unknown)
          PassWall Commit: $(git -C openwrt/package/openwrt-passwall rev-parse HEAD 2>/dev/null || echo unknown)
          PassWall Packages Commit: $(git -C openwrt/package/openwrt-passwall-packages rev-parse HEAD 2>/dev/null || echo unknown)
          Fast Build Status: $(cat build-status.txt 2>/dev/null || echo "UNKNOWN")
          EOF
          [ -s feeds.snapshot.txt ] && install -m644 feeds.snapshot.txt release_assets/feeds.snapshot
          [ -s toolchain.info ] && install -m644 toolchain.info release_assets/toolchain.info
          [ -s logs_full.config.gz ] && install -m644 logs_full.config.gz release_assets/full.config.gz
          [ -s logs_diffconfig.txt ] && install -m644 logs_diffconfig.txt release_assets/diffconfig.txt
          [ -s build-status.txt ] && install -m644 build-status.txt release_assets/
          [ -s logs_build.log.gz ] && install -m644 logs_build.log.gz release_assets/
          [ -s logs_build_debug.log.gz ] && install -m644 logs_build_debug.log.gz release_assets/
          [ -s /tmp/retry_history.log ] && install -m644 /tmp/retry_history.log release_assets/
          [ -s /tmp/retry_debug.log ] && gzip -9 -c /tmp/retry_debug.log > release_assets/retry_debug.log.gz || true
          find release_assets -type f -empty -print -delete
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0.0-LTS-b${{ github.run_number }}-${{ steps.meta.outputs.date }}
          name: ImmWrt v8.0.0-LTS (TSAR BOMBA SEALED)
          body: |
            ### 🔒 v8.0.0-LTS TSAR BOMBA SEALED
            - 25.12.1 正式版母體
            - 沙皇級空間釋放與自癒 Hash 架構
            - 內建封裝 spec ib v1.0
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
