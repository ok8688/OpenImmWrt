# =====================================================================
# 🔒 [LTS FINAL SEALED] - THE ABSOLUTE FINALITY v8.0.3 (25.12.1 TSAR BOMBA)
# =====================================================================
# 狀態：TSAR BOMBA SEALED (沙皇級物理空間強化封存)。
# 哲學：鎖定正式版發行分支，透過 Adaptive Drift 容忍上游漂移。
# 終極融合：
# 1. 繼承 Snapshot 的企業級 retry 除錯、串流日誌與全套考古 Artifacts。
# 2. 升級 SOURCE_DATE_EPOCH 溯源與 find 精準提取 openwrt_release。
# 3. 保留 LTS 專屬的沙皇空間清理、絕對決定性的 4G Swap 與自癒 Hash 架構。
# 4. [v8.0.3] 升級 ib v1.8 備份引擎，修復 tar 目錄項誤判，整合 wg-quick 支援、qrencode。
# 5. [SDC v1.4 Final] 導入 OpenWrt Native dumpinfo 解析；強制清除同名舊 dl 壓縮包消滅 Stale Cache；精準相容 ERE 賦值；導入可觀測性日誌。
# 6. [顯式宣告] 明確加入 CONFIG_USE_APK=y，並透過 Defconfig 與 Manifest 雙重審計嚴格排除 fstab、plugins 與 block-mount。
# 7. [Cache Schema Versioning] 導入 sdc14 Namespace，綁定 `feeds.snapshot.txt` 雜湊，阻斷跨快照污染。
# 8. [CCACHE 加速] 導入專屬 ccache-tls- 快取，大幅降低 LTS 重新編譯的時間成本。
# 9. [Rust Precision Fix] 保留 LTS 原生 Rust feed，僅修補 CI LLVM Artifact 404，並記錄完整 Rust provenance。
# =====================================================================

name: Build ImmWrt v8.0.3-LTS

on:
  workflow_dispatch:
#  schedule:
#    - cron: '26 14 * * 0,2,4,6' # UTC 14:26 = HKT 22:26 (每週日、二、四、六)

concurrency:
  group: immwrt-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_COMPRESS: 1
  CCACHE_MAXSIZE: 2G
  CCACHE_SLOPPINESS: time_macros,file_macro

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Metadata
        id: meta
        run: echo "date=$(date +%Y%m%d || echo unknown)" >> $GITHUB_OUTPUT

      - name: Inject SRE Core Utilities
        run: |
          cat << 'EOF' > /tmp/sre_utils.sh
          #!/bin/bash
          set -o pipefail
          retry() {
            touch /tmp/retry_history.log /tmp/retry_debug.log
            local max=5; local delay=2; local n=1
            local cmd_name="$(printf '%q ' "$@")"
            
            while true; do
              if "$@" >> /tmp/retry_debug.log 2>&1; then
                echo "✅ Success!"
                break
              else
                if [[ $n -lt $max ]]; then
                  echo "⚠️ [FAIL] Attempt $n: $cmd_name" >> /tmp/retry_history.log
                  echo "⚠️ Failed! Retrying in $delay seconds..."
                  ((n++)); delay=$((delay * 2 + RANDOM % 3)); sleep $delay
                else
                  echo "❌ FATAL: Failed after $max retries: $cmd_name"
                  cat /tmp/retry_history.log
                  echo "--- LAST 300 LINES OF ERROR LOG ---"
                  tail -n 300 /tmp/retry_debug.log
                  return 1
                fi
              fi
            done
          }
          EOF
          chmod +x /tmp/sre_utils.sh
          
      - name: Init SRE Environment & Space Cleanup
        run: |
          set -euo pipefail
          echo "=== 💥 啟動沙皇級核爆清理 (釋放終極極限空間) ==="
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/share/rust \
            /opt/microsoft \
            /usr/local/share/edge_driver \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /opt/az \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/lib/heroku || true
            
          sudo docker system prune -af || true
          sudo apt-get clean
          
          echo "=== 🚀 部署依賴與內存裝甲 ==="
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget jq golang-go ccache
            
          echo "▶️ [Step] Deploying 4G Swap Armor (Deterministic)..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          echo "=== 🧬 Deep ABI Fingerprint ===" > toolchain.info
          echo "Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> toolchain.info
          uname -r >> toolchain.info
          gcc --version | head -n 1 >> toolchain.info
          ld --version | head -n 1 >> toolchain.info
          ldd --version | head -n 1 >> toolchain.info
          dpkg -s libc6 | grep Version >> toolchain.info
          go version >> toolchain.info || true
          
      - name: Clone & Official PassWall Main Source (Latest Commit)
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          
          echo "▶️ [Step] Cloning ImmortalWrt 25.12.1 LTS Source..."
          retry bash -c 'rm -rf openwrt && timeout 20m git clone -b v25.12.1 --single-branch --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt'
          cd openwrt
          
          echo "▶️ [Step] Updating base feeds..."
          retry timeout 35m ./scripts/feeds update -a
          
          # ✅ 終極物理防護 - 徹底切斷舊版供應鏈，並嚴格拔除不要的插件
          ./scripts/feeds uninstall luci-app-passwall xray-core sing-box luci-app-fstab luci-app-plugins || true
          rm -rf feeds/luci/applications/luci-app-passwall feeds/packages/net/xray-core feeds/packages/net/sing-box feeds/luci/applications/luci-app-fstab feeds/luci/applications/luci-app-plugins
          rm -rf package/feeds/luci/luci-app-passwall package/feeds/packages/xray-core package/feeds/packages/sing-box package/feeds/luci/luci-app-fstab package/feeds/luci/luci-app-plugins
          
          echo "▶️ [Step] Cloning Passwall ecosystem (Latest Upstream)..."
          retry git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages
          retry git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall
            
          echo "▶️ [Step] Installing feeds..."
          retry bash -c 'set -o pipefail; timeout 35m ./scripts/feeds install -a -f'

          # =====================================================
          # 🔧 Rust Precision Fix (LTS Native Feed)
          # =====================================================
          # 目的：
          # 1. 不再漂移拉取 packages/master
          # 2. 保留 v25.12.1 LTS 原生 packages feed 的 Rust 結構
          # 3. 僅修補 Rust CI LLVM Artifact 404
          # 4. 將實際 Rust 版本 / Release / Makefile SHA256 / LLVM 模式寫入 snapshot
          #
          # 注意：
          # - 不修改 Rust 版本
          # - 不修改 Rust 其他編譯參數
          # - 不修改 PassWall
          # - 不修改 sing-box
          # - 不修改 xray-core
          # =====================================================

          RUST_MAKEFILE="feeds/packages/lang/rust/Makefile"

          if [ ! -f "$RUST_MAKEFILE" ]; then
            echo "❌ FATAL: Rust Makefile not found: $RUST_MAKEFILE"
            exit 1
          fi

          echo "=== 🔧 Rust Precision Fix ==="

          sed -i -E             's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/g'             "$RUST_MAKEFILE"

          if grep -Eq --             '--set=llvm\.download-ci-llvm=true'             "$RUST_MAKEFILE"; then
            echo "❌ FATAL: Rust download-ci-llvm=true still remains"
            exit 1
          fi

          if ! grep -Eq --             '--set=llvm\.download-ci-llvm=false'             "$RUST_MAKEFILE"; then
            echo "❌ FATAL: Rust download-ci-llvm=false was not found"
            exit 1
          fi

          RUST_VERSION="$(
            sed -n               's/^[[:space:]]*PKG_VERSION[[:space:]]*:=//p'               "$RUST_MAKEFILE" |
              head -n 1
          )"

          RUST_RELEASE="$(
            sed -n               's/^[[:space:]]*PKG_RELEASE[[:space:]]*:=//p'               "$RUST_MAKEFILE" |
              head -n 1
          )"

          RUST_MAKEFILE_SHA256="$(
            sha256sum "$RUST_MAKEFILE" |
            awk '{print $1}'
          )"

          echo "Rust Version  : ${RUST_VERSION:-unknown}"
          echo "Rust Release  : ${RUST_RELEASE:-unknown}"
          echo "Rust Makefile : ${RUST_MAKEFILE_SHA256:-unknown}"
          echo "LLVM Mode     : download-ci-llvm=false"

          cat > /tmp/rust-provenance.txt << EOF
          === 🦀 RUST PRECISION FIX ===
          Rust Makefile: $RUST_MAKEFILE
          Rust Version: ${RUST_VERSION:-unknown}
          Rust Release: ${RUST_RELEASE:-unknown}
          Rust Makefile SHA256: ${RUST_MAKEFILE_SHA256:-unknown}
          Rust LLVM Mode: download-ci-llvm=false
          Rust Source: ImmortalWrt v25.12.1 packages feed
          Rust Modification: CI LLVM Artifact 404 mitigation only
          EOF

          cat /tmp/rust-provenance.txt

          echo "✅ Rust precision fix completed"
          # =====================================================

          # =====================================================
          # 🔒 Stable Drift Control v1.4 (Anti-Stale & Adaptive)
          # =====================================================
          set +e
          
          sync_hash () {
            local name="$1"
            local makefile="$2"
            local pattern="$3"
            
            if [ ! -f "$makefile" ]; then
              echo "⚠️ $name: Makefile missing, skip"
              return
            fi
            
            echo "🔒 [SDC v1.4] Adaptive source resolution: $name"
            
            if grep -Eq '^[[:space:]]*PKG_HASH[[:space:]]*(:=|\?=|=)' "$makefile"; then
              sed -i -E 's/^[[:space:]]*PKG_HASH[[:space:]]*(:=|\?=|=).*/PKG_HASH:=skip/' "$makefile"
            else
              printf '\nPKG_HASH:=skip\n' >> "$makefile"
            fi

            if grep -Eq '^[[:space:]]*PKG_MIRROR_HASH[[:space:]]*(:=|\?=|=)' "$makefile"; then
              sed -i -E 's/^[[:space:]]*PKG_MIRROR_HASH[[:space:]]*(:=|\?=|=).*/PKG_MIRROR_HASH:=skip/' "$makefile"
            fi
            
            local pkg_source=""
            pkg_source="$(
              make -s "package/${name}/dumpinfo" 2>/dev/null |
                sed -n 's/^Source: //p' |
                head -n 1
            )" || true
            
            pkg_source="$(
              printf '%s' "$pkg_source" |
                sed 's/\r$//' |
                sed 's/^[[:space:]]*//' |
                sed 's/[[:space:]]*$//'
            )"
            
            if [ -n "$pkg_source" ]; then
              pkg_source="$(basename -- "$pkg_source")"
              echo "🧹 [SDC v1.4] Purging stale dl cache for exact source: $pkg_source"
              rm -f "dl/$pkg_source"
            fi
            
            if make "package/${name}/download" V=s >"/tmp/sdc-${name}-download.log" 2>&1; then
              echo "✅ $name: download stage completed"
            else
              echo "⚠️ $name: download stage failed; continuing with Adaptive Drift"
              tail -n 80 "/tmp/sdc-${name}-download.log" || true
            fi
            
            local FILE=""
            
            if [ -n "$pkg_source" ]; then
              if [ -f "dl/$pkg_source" ]; then
                FILE="dl/$pkg_source"
              fi
            fi
            
            if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
              FILE="$(
                find dl -maxdepth 1 -type f \
                  \( -name "${pattern}*.tar.gz" \
                  -o -name "${pattern}*.tar.xz" \
                  -o -name "${pattern}*.zip" \) \
                  -print 2>/dev/null |
                  sort |
                  head -n 1
              )"
            fi
            
            if [ -n "$FILE" ] && [ -f "$FILE" ]; then
              local NEW_HASH=""
              NEW_HASH="$(sha256sum "$FILE" | awk '{print $1}')" || true
              if [ -n "$NEW_HASH" ]; then
                sed -i -E "s/^[[:space:]]*PKG_HASH[[:space:]]*(:=|\?=|=).*/PKG_HASH:=$NEW_HASH/" "$makefile"
                echo "✅ $name: Upstream aligned"
                echo "   Source : $FILE"
                echo "   SHA256 : $NEW_HASH"
              else
                echo "⚠️ $name: SHA256 calculation failed, keeping 'skip'"
              fi
            else
              echo "⚠️ $name: Artifact missing, keeping 'skip' to force build"
            fi
          }

          sync_hash "sing-box" "package/openwrt-passwall-packages/sing-box/Makefile" "sing-box-"
          sync_hash "xray-core" "package/openwrt-passwall-packages/xray-core/Makefile" "Xray-core-"
          
          set -e
          echo "🔒 [SDC v1.4] Adaptive mode completed"
          # =====================================================

          find feeds package -path "*/usr/share/luci/menu.d/*.json" -type f | while read -r f; do
            jq 'del(."admin/system/mounts", ."admin/services/mounts", ."admin/services/mounts", ."admin/system/plugins") // .' "$f" > "$f.tmp" && mv "$f.tmp" "$f" || echo "⚠️ Skipping invalid JSON: $f"
          done
          
          {
            echo "=== 🧬 COMPONENT COMMIT ==="
            echo "ImmortalWrt Commit: $(git rev-parse HEAD)"
            echo "PassWall Commit: $(git -C package/openwrt-passwall rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "PassWall Packages Commit: $(git -C package/openwrt-passwall-packages rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "=== 🧬 FEEDS LIST ==="
            ./scripts/feeds list -f | sort
            echo "=== 🧬 REPOS STATUS ==="
            find package -maxdepth 2 -name .git -print0 | while IFS= read -r -d '' gitdir; do
              repo=$(dirname "$gitdir")
              echo "$(git -C "$repo" remote get-url origin 2>/dev/null):$(git -C "$repo" rev-parse HEAD)"
            done | sort
            echo
            cat /tmp/rust-provenance.txt
          } > ../feeds.snapshot.txt

      - name: Inject ImmWrt Backup Tool (ib v1.8)
        run: |
          set -e
          mkdir -p openwrt/package/base-files/files/usr/bin
          cat << 'IB_SCRIPT' > openwrt/package/base-files/files/usr/bin/ib
          #!/bin/sh

          VERSION="1.8"
          readonly VERSION

          BACKUP_DIR="${IBB_BACKUP_DIR:-/root}"
          readonly BACKUP_DIR

          BACKUP="$BACKUP_DIR/immwrt-backup-latest.tar.gz"
          readonly BACKUP

          WORK="/tmp/ib-work"
          readonly WORK

          SAFETY="/tmp/ib-safety"
          readonly SAFETY

          VERIFY_TEST="/tmp/ib-verify-test"
          readonly VERIFY_TEST


          # ============================================================
          # Backup Scope
          # ============================================================

          REQUIRED_FILES="
          /etc/config/ddns
          /etc/config/dhcp
          /etc/config/firewall
          /etc/config/luci
          /etc/config/network
          /etc/config/passwall
          /etc/config/passwall_server
          /etc/config/smartdns
          /etc/config/system
          /etc/config/upnpd
          /etc/crontabs/root
          "
          readonly REQUIRED_FILES

          OPTIONAL_FILES="
          /etc/config/argon
          /usr/share/passwall/rules/direct_host
          /usr/share/passwall/rules/direct_ip
          /usr/share/passwall/rules/proxy_host
          /usr/share/passwall/rules/proxy_ip
          /www/luci-static/argon/css/dark.css
          "
          readonly OPTIONAL_FILES

          MIN_REQUIRED_PACKAGES=""
          readonly MIN_REQUIRED_PACKAGES


          # ============================================================
          # Core Utilities & Safety Boundaries
          # ============================================================

          fail()
          {
              printf "FAILED: %s\n" "$1" >&2
              exit "${2:-1}"
          }


          safe_rm()
          {
              case "$1" in
                  "$WORK"|"$SAFETY"|"$VERIFY_TEST")
                      rm -rf -- "$1"
                      ;;
                  *)
                      fail "safe_rm aborted: illegal path $1" 1
                      ;;
              esac
          }


          check_root()
          {
              [ "$(id -u)" = "0" ] || fail "root required" 1
          }


          validate_path()
          {
              case "$1" in
                  /etc/config/ddns|\
                  /etc/config/dhcp|\
                  /etc/config/firewall|\
                  /etc/config/luci|\
                  /etc/config/network|\
                  /etc/config/passwall|\
                  /etc/config/passwall_server|\
                  /etc/config/smartdns|\
                  /etc/config/system|\
                  /etc/config/upnpd|\
                  /etc/crontabs/root|\
                  /etc/config/argon|\
                  /usr/share/passwall/rules/direct_host|\
                  /usr/share/passwall/rules/direct_ip|\
                  /usr/share/passwall/rules/proxy_host|\
                  /usr/share/passwall/rules/proxy_ip|\
                  /www/luci-static/argon/css/dark.css)
                      return 0
                      ;;
                  *)
                      return 1
                      ;;
              esac
          }


          usage()
          {
              printf \
          "ImmWrt Backup Tool v%s
          Usage:
            ib {b|backup}
            ib {r|restore}
            ib {v|verify}
            ib {i|info}
            ib {ver|version}
          \n" "$VERSION"

              exit 2
          }


          fail_backup()
          {
              rm -f -- "$BACKUP.tmp"
              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"
              fail "$1" "${2:-1}"
          }


          fail_verify()
          {
              safe_rm "$WORK"
              fail "$1" "${2:-1}"
          }


          fail_restore_preflight()
          {
              safe_rm "$WORK"
              safe_rm "$SAFETY"
              fail "$1" "${2:-1}"
          }


          trap_backup()
          {
              printf "\n[!] Backup interrupted. Cleaning up...\n"
              rm -f -- "$BACKUP.tmp"
              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"
              exit 130
          }


          trap_restore()
          {
              printf "\n[!] Restore interrupted! Initiating emergency rollback...\n"
              if [ -f "$SAFETY/state.txt" ]; then
                  if restore_safety_back; then
                      printf "Rollback completed successfully.\n"
                      safe_rm "$SAFETY"
                      safe_rm "$WORK"
                  else
                      printf "CRITICAL: Rollback failed!\n" >&2
                  fi
              else
                  safe_rm "$SAFETY"
                  safe_rm "$WORK"
              fi
              exit 130
          }


          verify_archive_members()
          {
              local archive="$1"
              local listing line type_char member

              listing="$(tar -tvzf "$archive" 2>/dev/null)" || \
                  fail "Unable to inspect archive members: $archive" 5

              while IFS= read -r line; do
                  [ -n "$line" ] || continue
                  type_char="$(printf '%s' "$line" | cut -c1)"
                  member="$(printf '%s' "$line" | awk '{print $NF}')"
                  case "$type_char" in
                      -|d) ;;
                      *) fail "Security violation: Unsafe archive entry type ($type_char): $member" 5 ;;
                  esac
                  case "$member" in
                      files|files/*|manifest.txt|checksum.sha256|packages.txt|firmware.info) ;;
                      *) fail "Security violation: Archive member outside whitelist: $member" 5 ;;
                  esac
              done <<ARCHIVE_LISTING
          $listing
          ARCHIVE_LISTING
          }


          verify_archive_exact()
          {
              local archive="$1"
              local listing member path

              listing="$(tar -tzf "$archive" 2>/dev/null)" || fail "Unable to enumerate archive members" 5

              while IFS= read -r member; do
                  [ -n "$member" ] || continue
                  case "$member" in
                      files/|files/*/) ;;
                      files/*)
                          path="/${member#files/}"
                          grep -Fqx "$path" "$WORK/manifest.parsed" || fail "Security violation: Unmanifested file: $member" 5
                          ;;
                  esac
              done <<ARCHIVE_LISTING
          $listing
          ARCHIVE_LISTING
          }


          package_installed()
          {
              local pkg="$1"
              command -v opkg >/dev/null 2>&1 && opkg status "$pkg" 2>/dev/null | grep -q '^Status: install'
          }


          create_firmware_info()
          {
              local rel="/etc/openwrt_release"
              {
                  printf "IBB-Version: %s\n" "$VERSION"
                  printf "Architecture: %s\n" "$(uname -m)"
                  printf "Distribution: %s\n" "$(grep DISTRIB_ID "$rel" 2>/dev/null | cut -d= -f2 | tr -d "'" || echo "Unknown")"
                  printf "Version: %s\n" "$(grep DISTRIB_RELEASE "$rel" 2>/dev/null | cut -d= -f2 | tr -d "'" || echo "Unknown")"
                  printf "Revision: %s\n" "$(grep DISTRIB_REVISION "$rel" 2>/dev/null | cut -d= -f2 | tr -d "'" || echo "Unknown")"
                  printf "Kernel: %s\n" "$(uname -r)"
                  printf "Date: %s\n" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              } > "$1"
          }


          verify_firmware_info()
          {
              local backup_arch
              [ -f "firmware.info" ] || return 0
              backup_arch="$(grep '^Architecture:' firmware.info | cut -d' ' -f2-)"
              [ "$backup_arch" = "$(uname -m)" ] || fail_restore_preflight "Architecture mismatch" 8
          }


          verify_packages() { return 0; }


          read_manifest()
          {
              awk '/^[[:space:]]*#/ { next } NF == 0 { next } $1 ~ /^\// { print $1 }' manifest.txt > "$WORK/manifest.raw" || fail_restore_preflight "Manifest parse error" 5
              sort -u "$WORK/manifest.raw" > "$WORK/manifest.parsed"
              [ -s "$WORK/manifest.parsed" ] || fail_restore_preflight "Manifest empty" 5
          }


          verify_manifest()
          {
              local f
              while IFS= read -r f; do
                  validate_path "$f" || fail_restore_preflight "Path outside whitelist: $f" 5
                  [ -f "files$f" ] || fail_restore_preflight "Missing archive file: $f" 5
              done < "$WORK/manifest.parsed"
          }


          restore_safety()
          {
              local f
              safe_rm "$SAFETY"
              mkdir -p "$SAFETY/files" || fail_restore_preflight "Safety dir creation failed" 1
              : > "$SAFETY/state.txt" || fail_restore_preflight "Safety state creation failed" 1

              while IFS= read -r f; do
                  if [ -f "$f" ]; then
                      mkdir -p "$(dirname "$SAFETY/files$f")"
                      cp -p "$f" "$SAFETY/files$f"
                      printf "EXIST %s\n" "$f" >> "$SAFETY/state.txt"
                  else
                      printf "MISSING %s\n" "$f" >> "$SAFETY/state.txt"
                  fi
              done < "$WORK/manifest.parsed"
          }


          restore_safety_back()
          {
              local status=0 state f tmp
              [ -f "$SAFETY/state.txt" ] || return 1
              while IFS=' ' read -r state f; do
                  case "$state" in
                      EXIST)
                          [ -f "$SAFETY/files$f" ] || { status=1; continue; }
                          mkdir -p "$(dirname "$f")"
                          tmp="${f}.ib-tmp"
                          cp -p "$SAFETY/files$f" "$tmp" && mv -f "$tmp" "$f" || { rm -f "$tmp"; status=1; }
                          ;;
                      MISSING)
                          [ -e "$f" ] && rm -f "$f"
                          ;;
                  esac
              done < "$SAFETY/state.txt"
              [ "$status" -eq 0 ]
          }


          verify_restored()
          {
              local f hash_src hash_dst
              while IFS= read -r f; do
                  [ -f "$f" ] || return 1
                  hash_src="$(sha256sum "files$f" | cut -d' ' -f1)" || return 1
                  hash_dst="$(sha256sum "$f" | cut -d' ' -f1)" || return 1
                  [ "$hash_src" = "$hash_dst" ] || return 1
              done < "$WORK/manifest.parsed"
              return 0
          }


          get_target_files()
          {
              local list="" f
              for f in $REQUIRED_FILES; do
                  [ -f "$f" ] || fail "Missing REQUIRED file: $f" 3
                  list="$list $f"
              done
              for f in $OPTIONAL_FILES; do
                  [ -f "$f" ] && list="$list $f"
              done
              echo "$list"
          }


          backup()
          {
              trap trap_backup INT TERM HUP
              local target_files count=0 f
              target_files="$(get_target_files)"
              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"
              rm -f -- "$BACKUP.tmp"
              mkdir -p "$WORK/files" || fail_backup "Workspace creation failed" 1

              for f in $target_files; do
                  mkdir -p "$(dirname "$WORK/files$f")"
                  cp -p "$f" "$WORK/files$f" || fail_backup "Copy failed: $f" 1
                  count=$((count + 1))
              done

              cd "$WORK" || fail_backup "Workspace cd failed" 1

              {
                  printf "# ImmWrt Backup Manifest\n"
                  printf "# Tool-Version: %s\n" "$VERSION"
                  for f in $target_files; do printf "%s\n" "$f"; done
              } > manifest.txt

              : > checksum.sha256
              for f in $target_files; do sha256sum "files$f" >> checksum.sha256; done

              "" > packages.txt
              create_firmware_info "firmware.info"

              tar -czf "$BACKUP.tmp" files manifest.txt checksum.sha256 packages.txt firmware.info || fail_backup "Tar compression failed" 1
              verify_archive_members "$BACKUP.tmp" || fail_backup "Archive member security verification failed" 5
              mv "$BACKUP.tmp" "$BACKUP" || fail_backup "Atomic replacement failed" 1
              safe_rm "$WORK"
              trap - INT TERM HUP
              printf "\nBackup completed successfully. (%d files)\n" "$count"
          }


          restore()
          {
              local count=0 f tmp
              [ -f "$BACKUP" ] || fail "Backup not found at $BACKUP" 5
              verify_archive_members "$BACKUP" || fail_restore_preflight "Archive member security verification failed" 5
              safe_rm "$WORK"
              mkdir -p "$WORK"
              tar -xzf "$BACKUP" -C "$WORK" || fail_restore_preflight "Archive extraction failed" 5
              cd "$WORK" || fail_restore_preflight "Workspace cd failed" 5

              read_manifest
              verify_manifest
              verify_archive_exact "$BACKUP" || fail_restore_preflight "Archive exact verification failed" 5
              sha256sum -c checksum.sha256 >/dev/null 2>&1 || fail_restore_preflight "Archive checksum verification failed" 5
              verify_firmware_info
              restore_safety

              trap trap_restore INT TERM HUP
              while IFS= read -r f; do
                  mkdir -p "$(dirname "$f")" || { restore_safety_back && fail "Directory creation failed for $f" 6; }
                  tmp="${f}.ib-tmp"
                  rm -f "$tmp"
                  cp -p "files$f" "$tmp" && mv -f "$tmp" "$f" || { rm -f "$tmp"; restore_safety_back && fail "Atomic replacement failed for $f" 6; }
                  count=$((count + 1))
              done < "$WORK/manifest.parsed"

              verify_restored || { restore_safety_back && fail "Post-restore verification failed" 6; }
              safe_rm "$SAFETY"
              safe_rm "$WORK"
              trap - INT TERM HUP
              printf "Restore completed successfully. (%d files)\n" "$count"
              exit 0
          }


          verify_cmd()
          {
              [ -f "$BACKUP" ] || fail "Backup not found at $BACKUP" 5
              verify_archive_members "$BACKUP" || fail_restore_preflight "Archive member security verification failed" 5
              safe_rm "$WORK"
              mkdir -p "$WORK"
              tar -xzf "$BACKUP" -C "$WORK" || fail_verify "Archive extraction failed" 5
              cd "$WORK" || fail_verify "Workspace cd failed" 5
              read_manifest
              verify_manifest
              verify_archive_exact "$BACKUP" || fail_verify "Archive exact verification failed" 5
              sha256sum -c checksum.sha256 >/dev/null 2>&1 || fail_verify "Checksum verification failed" 5
              verify_firmware_info
              safe_rm "$WORK"
              printf "VERIFY SUCCESS: Archive is intact, complete, and compatible.\n"
              exit 0
          }


          info_cmd()
          {
              [ -f "$BACKUP" ] || fail "Backup not found at $BACKUP" 5
              safe_rm "$WORK"
              mkdir -p "$WORK"
              tar -xzf "$BACKUP" -C "$WORK" firmware.info 2>/dev/null
              [ -f "$WORK/firmware.info" ] && cat "$WORK/firmware.info" || printf "Firmware Info: Legacy archive format\n"
              safe_rm "$WORK"
              exit 0
          }


          case "$1" in
              b|backup) check_root; backup ;;
              r|restore) check_root; restore ;;
              v|verify) check_root; verify_cmd ;;
              i|info) info_cmd ;;
              ver|version) printf "ib v%s\n" "$VERSION"; exit 0 ;;
              *) usage ;;
          esac
          IB_SCRIPT
          chmod 755 openwrt/package/base-files/files/usr/bin/ib
          
      - name: Generate Cache Variables
        id: var
        run: |
          echo "dl_key=dl-v8.0.3-sdc14-${{ hashFiles('feeds.snapshot.txt') }}-$(sha256sum toolchain.info | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "ccache_key=ccache-tls-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Restore Cache (dl)
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
          key: ${{ steps.var.outputs.dl_key }}
          restore-keys: |
            dl-v8.0.3-sdc14-${{ hashFiles('feeds.snapshot.txt') }}-
            
      - name: Restore Cache (ccache)
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ${{ steps.var.outputs.ccache_key }}
          restore-keys: |
            ccache-tls-
            
      - name: Generate Core Config
        run: |
          set -euo pipefail
          cd openwrt
          {
            echo "CONFIG_TARGET_x86=y"
            echo "CONFIG_TARGET_x86_64=y"
            echo "CONFIG_TARGET_x86_64_DEVICE_generic=y"
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1536"
            echo "CONFIG_TARGET_IMAGES_GZIP=y"
            echo "CONFIG_USE_APK=y"
            echo "CONFIG_PACKAGE_luci-app-passwall=y"
            echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y"
            echo "CONFIG_PACKAGE_xray-core=y"
            echo "CONFIG_PACKAGE_sing-box=y"
            echo "CONFIG_PACKAGE_geoview=y"
            echo "CONFIG_PACKAGE_ca-bundle=y"
            echo "CONFIG_PACKAGE_ca-certificates=y"
            echo "CONFIG_PACKAGE_smartdns=y"
            echo "CONFIG_PACKAGE_luci-app-smartdns=y"
            echo "CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-app-ddns=y"
            echo "CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y"
            echo "CONFIG_PACKAGE_ddns-scripts-cloudflare=y"
            echo "CONFIG_PACKAGE_luci-app-upnp=y"
            echo "CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-light=y"
            echo "CONFIG_PACKAGE_luci-theme-argon=y"
            echo "CONFIG_PACKAGE_luci-app-argon-config=y"
            echo "CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y"
            echo "CONFIG_PACKAGE_qemu-ga=y"
            echo "CONFIG_PACKAGE_irqbalance=y"
            echo "CONFIG_PACKAGE_kmod-wireguard=y"
            echo "CONFIG_PACKAGE_wireguard-tools=y"
            echo "CONFIG_PACKAGE_wireguard-tools-wg-quick=y"
            echo "CONFIG_PACKAGE_luci-proto-wireguard=y"
            echo "CONFIG_PACKAGE_qrencode=y"
            echo "CONFIG_PACKAGE_kmod-crypto-kpp=y"
            echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=y"
            echo "CONFIG_PACKAGE_luci-app-ttyd=y"
            echo "CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-app-advanced-reboot=y"
            echo "CONFIG_PACKAGE_luci-i18n-advanced-reboot-zh-cn=y"
            echo "CONFIG_PACKAGE_htop=y"
            echo "CONFIG_PACKAGE_ethtool=y"
            echo "CONFIG_PACKAGE_nano=y"
            echo "CONFIG_PACKAGE_curl=y"
            echo "CONFIG_PACKAGE_wget-ssl=y"
            echo "CONFIG_PACKAGE_unzip=y"
            echo "CONFIG_PACKAGE_kmod-tcp-bbr=y"
            echo "CONFIG_PACKAGE_kmod-virtio-net=y"
            echo "CONFIG_PACKAGE_kmod-virtio-blk=y"
            echo "CONFIG_PACKAGE_kmod-nft-offload=y"
            echo "CONFIG_PACKAGE_block-mount=n"
            echo "CONFIG_PACKAGE_luci-app-fstab=n"
            echo "CONFIG_PACKAGE_luci-app-plugins=n"
            echo "CONFIG_CCACHE=y"
          } > .config
          
          echo "=== 🔒 Forbidden Package Defconfig Audit ==="
          for p in block-mount luci-app-fstab luci-app-plugins; do
            if grep -Eq "^CONFIG_PACKAGE_${p}=[ym]" .config; then
              echo "❌ FORBIDDEN PACKAGE ENABLED IN CONFIG: $p"
              exit 1
            fi
          done
          echo "✅ Defconfig forbidden package audit passed"
          
          echo "=== 🔬 WireGuard Package Selection Audit ==="
          grep -iE "CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|qrencode)" .config || true
          make defconfig && ./scripts/diffconfig.sh > ../logs_diffconfig.txt
          gzip -9f -c .config > ../logs_full.config.gz
          
      - name: Build Firmware
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          cd openwrt
          
          IMM_DATE=$(git log -1 --format=%ct)
          PW_DATE=$(git -C package/openwrt-passwall log -1 --format=%ct 2>/dev/null || echo "$IMM_DATE")
          PWP_DATE=$(git -C package/openwrt-passwall-packages log -1 --format=%ct 2>/dev/null || echo "$IMM_DATE")
          export SOURCE_DATE_EPOCH=$(printf "%s\n%s\n%s" "$IMM_DATE" "$PW_DATE" "$PWP_DATE" | sort -n | tail -1)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> ../toolchain.info
          
          MONITOR_PID=""
          cleanup_monitor() {
            echo "🧹 關閉駕駛艙雷達..."
            [ -n "$MONITOR_PID" ] && kill "$MONITOR_PID" 2>/dev/null || true
          }
          trap cleanup_monitor EXIT INT TERM
          
          (
            echo "📡 BUILD MONITOR START"
            while true; do
              LOAD=$(uptime | awk -F'load average:' '{print $2}' | xargs)
              MEM=$(free -m | awk '/Mem:/ {printf "%d/%dMB | %.0f%%", $3, $2, ($3/$2)*100}')
              DISK=$(df -h / | awk 'NR==2 {print $5}')
              echo "[MONITOR]  $LOAD | $MEM | DISK: $DISK"
              sleep 120 || true
            done
          ) &
          MONITOR_PID=$!
          
          echo "▶️ [Step] Downloading package dependencies (this may take a while)..."
          retry bash -c 'timeout 30m make download -j$(nproc) V=s'
          
          export CC="ccache gcc"
          export CXX="ccache g++"
          
          FAST_BUILD_STATUS="SUCCESS"
          echo "▶️ [Step] Starting main compilation..."
          if ! make -j$(nproc) 2>&1 | tee >(gzip -1 -c > ../logs_build.log.gz); then
            FAST_BUILD_STATUS="FAILED (Fallback to Debug)"
            echo "FAST_BUILD_FAILED=true" > ../build-status.txt
            rm -rf tmp build_dir/hostpkg staging_dir/hostpkg
            make -j1 V=s 2>&1 | tee >(gzip -1 -c > ../logs_build_debug.log.gz) || exit 1
          fi
          echo "FAST_BUILD_STATUS=$FAST_BUILD_STATUS" >> ../build-status.txt
          
      - name: Save Cache (dl)
        uses: actions/cache/save@v4
        if: success() && !cancelled()
        with:
          path: |
            openwrt/dl
          key: ${{ steps.var.outputs.dl_key }}
          
      - name: Save Cache (ccache)
        uses: actions/cache/save@v4
        if: success() && !cancelled()
        with:
          path: ~/.ccache
          key: ${{ steps.var.outputs.ccache_key }}

      - name: Validate & Final Packaging
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          TARGET_DIR="openwrt/bin/targets/x86/64"
          mkdir -p release_assets
          
          [ -d "$TARGET_DIR" ] || exit 1
          cd "$TARGET_DIR"
          sha256sum --ignore-missing -c sha256sums || exit 1
          find . -name "*combined*.img.gz" -exec install -m644 {} "$ROOT/release_assets/" \;
          install -m644 sha256sums "$ROOT/release_assets/sha256sums"
          
          cd "$ROOT"
          [ -z "$(find release_assets -type f -name "*combined*.img.gz")" ] && { echo "Firmware missing!"; exit 1; }
          
          find openwrt/bin/targets/x86/64 -name "*.manifest" -exec sh -c 'echo "=== $(basename "$1") ==="; cat "$1"; echo' _ {} \; > release_assets/installed-packages.txt
          [ -s release_assets/installed-packages.txt ] || rm -f release_assets/installed-packages.txt
          
          echo "=== 🔒 Final Manifest Package Audit ==="
          for p in block-mount luci-app-fstab luci-app-plugins; do
            if grep -Eq "^${p} " release_assets/installed-packages.txt; then
              echo "❌ FORBIDDEN PACKAGE FOUND IN FINAL MANIFEST: $p"
              exit 1
            fi
          done
          echo "✅ Final manifest package audit passed"
          
          find openwrt/bin/packages -name "*.apk" | sort > release_assets/apk-list.txt
          [ -s release_assets/apk-list.txt ] || rm -f release_assets/apk-list.txt
          
          OW_RELEASE="$(find openwrt/build_dir/target-x86_64_musl -path "*/etc/openwrt_release" -type f -print -quit 2>/dev/null || true)"
          if [ -n "$OW_RELEASE" ] && [ -f "$OW_RELEASE" ]; then
            OW_REV=$(grep DISTRIB_REVISION "$OW_RELEASE" | head -n 1 | cut -d= -f2 | tr -d "'" || echo "unknown")
          else
            OW_REV="unknown"
          fi
          [ -z "$OW_REV" ] && OW_REV="unknown"
          
          cat << EOF > release_assets/build-info.txt
          Build Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          Branch: v25.12.1-LTS
          OpenWrt Version: $OW_REV
          Workflow Run ID: ${{ github.run_id }}
          Runner OS: ${{ runner.os }}
          Runner Image OS: ${ImageOS:-unknown}
          Runner Image Version: ${ImageVersion:-unknown}
          Runner Arch: $(uname -m)
          Kernel: $(uname -r)
          CPU: $(nproc) cores
          Memory: $(free -h | awk '/Mem:/ {print $2}')
          SOURCE_DATE_EPOCH: $(grep SOURCE_DATE_EPOCH toolchain.info | cut -d= -f2 || echo unknown)
          ImmortalWrt Commit: $(git -C openwrt rev-parse HEAD 2>/dev/null || echo unknown)
          PassWall Commit: $(git -C openwrt/package/openwrt-passwall rev-parse HEAD 2>/dev/null || echo unknown)
          PassWall Packages Commit: $(git -C openwrt/package/openwrt-passwall-packages rev-parse HEAD 2>/dev/null || echo unknown)
          Fast Build Status: $(cat build-status.txt 2>/dev/null || echo "UNKNOWN")
          EOF
          
          [ -s feeds.snapshot.txt ] && install -m644 feeds.snapshot.txt release_assets/feeds.snapshot
          [ -s toolchain.info ] && install -m644 toolchain.info release_assets/toolchain.info
          [ -s logs_full.config.gz ] && install -m644 logs_full.config.gz release_assets/full.config.gz
          [ -s logs_diffconfig.txt ] && install -m644 logs_diffconfig.txt release_assets/diffconfig.txt
          [ -s build-status.txt ] && install -m644 build-status.txt release_assets/
          [ -s logs_build.log.gz ] && install -m644 logs_build.log.gz release_assets/
          [ -s logs_build_debug.log.gz ] && install -m644 logs_build_debug.log.gz release_assets/
          [ -s /tmp/retry_history.log ] && install -m644 /tmp/retry_history.log release_assets/
          [ -s /tmp/retry_debug.log ] && gzip -9 -c /tmp/retry_debug.log > release_assets/retry_debug.log.gz || true
          
          find release_assets -type f -empty -print -delete
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0.3-LTS-b${{ github.run_number }}-${{ steps.meta.outputs.date }}
          name: ImmWrt v8.0.3-LTS (TSAR BOMBA SEALED)
          body: |
            ### 🔒 v8.0.3-LTS TSAR BOMBA SEALED (Rust Precision Fix)
            - **Rust 精準修補**：保留 v25.12.1-LTS 原生 Rust feed，不再漂移拉取 `packages/master`；僅將 `download-ci-llvm` 從 `true` 修補為 `false`，避免歷史 CI LLVM Artifact 404，並將 Rust 版本、Release、Makefile SHA256 與 LLVM 模式寫入 `feeds.snapshot`。
            - **顯式宣告 APK**：在設定檔中明確宣告 `CONFIG_USE_APK=y`，鎖定底層套件管理架構。
            - **雙重防線審計 (Final Audit)**：在 Defconfig 與最終固件 Manifest 階段全面導入強制檢查，杜絕 `block-mount`、`luci-app-fstab` 與 `luci-app-plugins` 任何形式的依賴回歸。
            - **PassWall 最新主幹同步**：即時拉取最新 `openwrt-passwall` 與 `openwrt-passwall-packages` 最新 commit。
            - **備份引擎升級**：內建 `ib v1.8` 黃金基準垂直排版版，解耦套件強依賴，確保跨版本配置恢復安全。
            - **快取綱要嚴格隔離**：`sdc14` Namespace 搭配 `ccache-tls-` 隔離前綴，確保與實驗分支絕對互不干擾。
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
